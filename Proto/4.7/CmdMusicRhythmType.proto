syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

enum CmdMusicRhythmType {
	CmdMusicRhythmType_NLCDGIPGFDJ = 0;
	CmdMusicRhythmType_MusicRhythmSaveSongConfigDataCsReq = 7577;
	CmdMusicRhythmType_MusicRhythmUnlockTrackScNotify = 7578;
	CmdMusicRhythmType_MusicRhythmDataScRsp = 7579;
	CmdMusicRhythmType_MusicRhythmMaxDifficultyLevelsUnlockNotify = 7582;
	CmdMusicRhythmType_MusicRhythmUnlockSongNotify = 7583;
	CmdMusicRhythmType_MusicRhythmFinishLevelCsReq = 7585;
	CmdMusicRhythmType_MusicRhythmStartLevelCsReq = 7586;
	CmdMusicRhythmType_MusicRhythmSaveSongConfigDataScRsp = 7589;
	CmdMusicRhythmType_MusicRhythmDataCsReq = 7592;
	CmdMusicRhythmType_MusicRhythmUnlockSongSfxScNotify = 7594;
	CmdMusicRhythmType_MusicRhythmStartLevelScRsp = 7598;
	CmdMusicRhythmType_MusicRhythmFinishLevelScRsp = 7600;
}

message MusicRhythmDataCsReq {
}

message MusicRhythmDataScRsp {
	uint32 cur_song_id = 1;
	repeated MusicRhythmGroup music_group = 2;
	repeated uint32 unlock_song_list = 3;
	repeated MusicRhythmLevel level_data_list = 6;
	bool show_hint = 7;
	repeated uint32 unlock_track_list = 8;
	uint32 retcode = 10;
	repeated uint32 unlock_phase_list = 11;
	uint32 cur_level_id = 12;
}

message MusicRhythmFinishLevelCsReq {
	uint32 score_id = 1;
	bool full_combo = 7;
	uint32 role_star = 11;
}

message MusicRhythmFinishLevelScRsp {
	uint32 level_id = 7;
	uint32 retcode = 10;
}

message MusicRhythmGroup {
	repeated uint32 BBINFDHMGII = 2;
	uint32 music_group_id = 8;
	uint32 music_group_phase = 11;
	repeated uint32 EOHMNCBOALC = 15;
}

message MusicRhythmLevel {
	uint32 unlock_level = 3;
	uint32 level_id = 7;
	bool full_combo = 14;
}

message MusicRhythmMaxDifficultyLevelsUnlockNotify {
}

message MusicRhythmSaveSongConfigDataCsReq {
	MusicRhythmGroup BENAFNHLCEO = 13;
}

message MusicRhythmSaveSongConfigDataScRsp {
	uint32 retcode = 1;
	uint32 EFEGLAOAJDA = 10;
	uint32 cur_song_id = 12;
}

message MusicRhythmStartLevelCsReq {
	uint32 level_id = 8;
}

message MusicRhythmStartLevelScRsp {
	uint32 retcode = 3;
	string trans_no = 4;
	uint32 level_id = 12;
}

message MusicRhythmUnlockSongNotify {
	repeated uint32 PHCHFKMHDMA = 3;
}

message MusicRhythmUnlockSongSfxScNotify {
	repeated uint32 PHCHFKMHDMA = 14;
}

message MusicRhythmUnlockTrackScNotify {
	repeated uint32 PFHNONKNHAC = 14;
}
