syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdRogueModifierType {
	CmdRogueModifierType_NLCDGIPGFDJ = 0;
	CmdRogueModifierType_RogueModifierSelectCellScRsp = 5305;
	CmdRogueModifierType_RogueModifierDelNotify = 5306;
	CmdRogueModifierType_RogueModifierUpdateNotify = 5318;
	CmdRogueModifierType_RogueModifierAddNotify = 5331;
	CmdRogueModifierType_RogueModifierStageStartNotify = 5370;
	CmdRogueModifierType_RogueModifierSelectCellCsReq = 5387;
}

message RogueModifierAddNotify {
	BMCNDLNONMO modifier = 10;
}

message RogueModifierDelNotify {
	uint64 FCHLCANJIGL = 4;
}

message RogueModifierSelectCellCsReq {
	uint32 IHAOMLEPHOM = 10;
}

message RogueModifierSelectCellScRsp {
	uint32 retcode = 5;
	ItemList NMJGHEACCMC = 10;
}

message RogueModifierStageStartNotify {
	RogueModifierSourceType source_type = 15;
}

message RogueModifierUpdateNotify {
	BMCNDLNONMO modifier = 1;
}
