syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message ActiveActivityData {
	repeated uint32 taken_star_rewards = 1;
	uint32 CDMIKICANEP = 2;
	uint32 id = 7;
	uint32 DBIFEEDMAOF = 9;
	uint32 FODLNKPNION = 12;
	uint32 panel_id = 13;
}

message ActiveActivityDataChangeScNotify {
	ActiveActivityData ANFFLNDCGLG = 6;
}

enum CmdActiveType {
	CmdActiveType_NLCDGIPGFDJ = 0;
	CmdActiveType_TakeActiveActivityRewardCsReq = 9554;
	CmdActiveType_GetActiveActivityDataScRsp = 9558;
	CmdActiveType_GetActiveActivityDataCsReq = 9565;
	CmdActiveType_ActiveActivityDataChangeScNotify = 9566;
	CmdActiveType_TakeActiveActivityRewardScRsp = 9570;
}

message GetActiveActivityDataCsReq {
}

message GetActiveActivityDataScRsp {
	uint32 retcode = 3;
	repeated ActiveActivityData HCLGPDFBDNP = 12;
}

message TakeActiveActivityRewardCsReq {
	uint32 id = 8;
}

message TakeActiveActivityRewardScRsp {
	ActiveActivityData ANFFLNDCGLG = 6;
	uint32 retcode = 7;
	ItemList reward = 10;
}
