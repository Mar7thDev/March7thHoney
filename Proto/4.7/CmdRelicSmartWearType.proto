syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message CABBOOKAODO {
	repeated uint32 relic_ids = 1;
	uint32 avatar_id = 5;
	ONFLANPGHHL AEONNKANGCE = 9;
}

enum CmdRelicSmartWearType {
	CmdRelicSmartWearType_NLCDGIPGFDJ = 0;
	CmdRelicSmartWearType_RelicSmartWearUpdatePinRelicCsReq = 8251;
	CmdRelicSmartWearType_RelicSmartWearDeletePinRelicCsReq = 8252;
	CmdRelicSmartWearType_RelicSmartWearDeletePinRelicScRsp = 8253;
	CmdRelicSmartWearType_RelicSmartWearAddPlanCsReq = 8254;
	CmdRelicSmartWearType_RelicSmartWearGetPinRelicCsReq = 8255;
	CmdRelicSmartWearType_RelicSmartWearDeletePlanScRsp = 8256;
	CmdRelicSmartWearType_RelicSmartWearDeletePlanCsReq = 8257;
	CmdRelicSmartWearType_RelicSmartWearGetPlanScRsp = 8258;
	CmdRelicSmartWearType_RelicSmartWearUpdatePlanScRsp = 8259;
	CmdRelicSmartWearType_RelicSmartWearGetPinRelicScRsp = 8261;
	CmdRelicSmartWearType_RelicSmartWearUpdatePinRelicScRsp = 8264;
	CmdRelicSmartWearType_RelicSmartWearGetPlanCsReq = 8265;
	CmdRelicSmartWearType_RelicSmartWearUpdatePlanCsReq = 8266;
	CmdRelicSmartWearType_RelicSmartWearUpdatePinRelicScNotify = 8268;
	CmdRelicSmartWearType_RelicSmartWearAddPlanScRsp = 8270;
}

enum KCKJILIMNFF {
	KCKJILIMNFF_NLCDGIPGFDJ = 0;
	KCKJILIMNFF_CFPGFAMANFD = 1;
	KCKJILIMNFF_HEHPPOFHLMI = 2;
	KCKJILIMNFF_EBDIOJPDJIH = 3;
}

message ONFLANPGHHL {
	repeated uint32 inside_relic_list = 2;
	repeated uint32 outside_relic_list = 5;
	KCKJILIMNFF ALAEIBDIGHM = 12;
}

message RelicSmartWearAddPlanCsReq {
	RelicSmartWearPlan relic_plan = 5;
}

message RelicSmartWearAddPlanScRsp {
	uint32 retcode = 2;
	RelicSmartWearPlan relic_plan = 15;
}

message RelicSmartWearDeletePinRelicCsReq {
	repeated ONFLANPGHHL AIFAMIFGMCH = 1;
	bool BEAJGCMPOED = 3;
	uint32 avatar_id = 10;
}

message RelicSmartWearDeletePinRelicScRsp {
	uint32 avatar_id = 6;
	repeated ONFLANPGHHL AIFAMIFGMCH = 12;
	uint32 retcode = 15;
}

message RelicSmartWearDeletePlanCsReq {
	uint32 unique_id = 4;
}

message RelicSmartWearDeletePlanScRsp {
	uint32 unique_id = 3;
	uint32 retcode = 12;
}

message RelicSmartWearGetPinRelicCsReq {
	uint32 avatar_id = 2;
}

message RelicSmartWearGetPinRelicScRsp {
	uint32 avatar_id = 4;
	uint32 retcode = 7;
	repeated CABBOOKAODO OJNCAOKPKIB = 8;
}

message RelicSmartWearGetPlanCsReq {
	uint32 avatar_id = 7;
}

message RelicSmartWearGetPlanScRsp {
	uint32 retcode = 6;
	repeated RelicSmartWearPlan relic_plan_list = 9;
	uint32 avatar_id = 10;
}

message RelicSmartWearPlan {
	repeated uint32 inside_relic_list = 3;
	uint32 unique_id = 5;
	uint32 avatar_id = 9;
	repeated uint32 outside_relic_list = 13;
}

message RelicSmartWearUpdatePinRelicCsReq {
	CABBOOKAODO DNNKBPBFPBK = 14;
}

message RelicSmartWearUpdatePinRelicScNotify {
	uint32 relic_unique_id = 4;
	repeated CABBOOKAODO PLNCNCNIPKN = 9;
	repeated CABBOOKAODO ANCHGOGNLFP = 10;
}

message RelicSmartWearUpdatePinRelicScRsp {
	uint32 retcode = 9;
	CABBOOKAODO DNNKBPBFPBK = 15;
}

message RelicSmartWearUpdatePlanCsReq {
	RelicSmartWearPlan relic_plan = 2;
}

message RelicSmartWearUpdatePlanScRsp {
	uint32 retcode = 4;
	RelicSmartWearPlan relic_plan = 12;
}
