syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdRogueArcadeType {
	CmdRogueArcadeType_NLCDGIPGFDJ = 0;
	CmdRogueArcadeType_RogueArcadeRestartCsReq = 7663;
	CmdRogueArcadeType_RogueArcadeLeaveScRsp = 7667;
	CmdRogueArcadeType_RogueArcadeGetInfoCsReq = 7675;
	CmdRogueArcadeType_RogueArcadeStartScRsp = 7684;
	CmdRogueArcadeType_RogueArcadeGetInfoScRsp = 7685;
	CmdRogueArcadeType_RogueArcadeStartCsReq = 7690;
	CmdRogueArcadeType_RogueArcadeLeaveCsReq = 7696;
	CmdRogueArcadeType_RogueArcadeRestartScRsp = 7698;
}

message GCPGBPNGOFF {
	SceneInfo scene = 1;
	FHEGNOPNICH JNKLNLKHGBB = 4;
	LineupInfo lineup = 12;
}

message RogueArcadeGetInfoCsReq {
}

message RogueArcadeGetInfoScRsp {
	uint32 room_id = 3;
	uint32 retcode = 6;
}

message RogueArcadeLeaveCsReq {
}

message RogueArcadeLeaveScRsp {
