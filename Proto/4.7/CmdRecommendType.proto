syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message BMMHJIFCGNO {
	uint32 MIPKOFFGPFA = 3;
	uint32 KAJCFPKEGBP = 10;
}

message BPFDFOJOEMI {
	uint32 percent = 11;
	uint32 LBDLAACOCCN = 13;
}

message BigDataAvatarRelicRecommend {
	repeated JBGPLPCCDBJ sphere_main_property_list = 2;
	repeated BPFDFOJOEMI body_main_property_list = 6;
	repeated BPFDFOJOEMI outer_set_list = 9;
	repeated JBGPLPCCDBJ rope_main_property_list = 10;
	repeated BPFDFOJOEMI foot_main_property_list = 11;
	repeated BPFDFOJOEMI inner_set_list = 13;
	uint32 avatar_id = 14;
}

message BigDataRecommendAvatarRelic {
	repeated BigDataAvatarRelicRecommend recomended_relic_info_list = 12;
}

message BigDataRecommendRelicAvatar {
	repeated RecomendedAvatarInfo recommended_avatar_info_list = 7;
}

enum BigDataRecommendType {
	BIG_DATA_RECOMMEND_TYPE_NONE = 0;
	BIG_DATA_RECOMMEND_TYPE_EQUIPMENT = 1;
	BIG_DATA_RECOMMEND_TYPE_RELIC_SUIT = 2;
	BIG_DATA_RECOMMEND_TYPE_RELIC_AVATAR = 3;
	BIG_DATA_RECOMMEND_TYPE_AVATAR_RELIC = 4;
	BIG_DATA_RECOMMEND_TYPE_LOCAL_LEGEND = 5;
	BIG_DATA_RECOMMEND_TYPE_CHALLENGE_PEAK_MOB = 6;
	BIG_DATA_RECOMMEND_TYPE_CHALLENGE_PEAK_BOSS = 7;
	BIG_DATA_RECOMMEND_TYPE_CHALLENGE = 8;
	BIG_DATA_RECOMMEND_TYPE_HMFFBIANKBF = 9;
	BIG_DATA_RECOMMEND_TYPE_IGDNEOELFKC = 10;
}

enum CmdRecommendType {
	CmdRecommendType_NLCDGIPGFDJ = 0;
	CmdRecommendType_GetBigDataAllRecommendScRsp = 2411;
	CmdRecommendType_GetBigDataRecommendScRsp = 2424;
	CmdRecommendType_GetBigDataRecommendCsReq = 2434;
	CmdRecommendType_GetBigDataAllRecommendCsReq = 2437;
}

message GHAJJBBEHBE {
	uint32 BBGHAFGMMNM = 2;
	uint32 OAOPDHLDFIP = 11;
	uint32 LMHDFOFNFII = 12;
}

message GNBBDMBNNDJ {
	repeated JOLHIMGJGBO lineup_list = 1;
}

message GetBigDataAllRecommendCsReq {
	BigDataRecommendType big_data_recommend_type = 13;
}

message GetBigDataAllRecommendScRsp {
	oneof OODKOEILJCD {
		BigDataRecommendRelicAvatar relic_avatar = 1;
		BigDataRecommendAvatarRelic avatar_relic = 5;
		GNBBDMBNNDJ KHCMLINMGEN = 13;
	}
	BigDataRecommendType big_data_recommend_type = 8;
	uint32 retcode = 11;
}

message GetBigDataRecommendCsReq {
	uint32 equip_avatar = 2;
	BigDataRecommendType big_data_recommend_type = 3;
}

message GetBigDataRecommendScRsp {
	uint32 equip_avatar = 1;
	BigDataRecommendType big_data_recommend_type = 2;
	oneof OODKOEILJCD {
		RelicRecommend relic_recommend = 3;
		HCIIHNAFNAB equipment_recommend = 7;
		GNBBDMBNNDJ KHCMLINMGEN = 11;
	}
	bool has_recommand = 5;
	uint32 retcode = 10;
}

message HCIIHNAFNAB {
	repeated BMMHJIFCGNO update_equipments_list = 8;
}

message JBGPLPCCDBJ {
	uint32 GBJPBAHGBPO = 9;
	uint32 NMFGIBMHNKI = 11;
	uint32 percent = 15;
}

message RecomendedAvatarInfo {
	uint32 relic_set_id = 2;
	uint32 recommend_avatar_id = 3;
	repeated uint32 avatar_id_list = 6;
}

message RelicRecommend {
	repeated GHAJJBBEHBE GMCNPKAJMHC = 5;
}
