syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdOfferingType {
	CmdOfferingType_NLCDGIPGFDJ = 0;
	CmdOfferingType_SubmitOfferingItemCsReq = 6924;
	CmdOfferingType_OfferingInfoScNotify = 6927;
	CmdOfferingType_GetOfferingInfoScRsp = 6928;
	CmdOfferingType_TakeOfferingRewardScRsp = 6929;
	CmdOfferingType_GetOfferingInfoCsReq = 6935;
	CmdOfferingType_TakeOfferingRewardCsReq = 6936;
	CmdOfferingType_SubmitOfferingItemScRsp = 6940;
}

message GetOfferingInfoCsReq {
	repeated uint32 offering_id_list = 6;
}

message GetOfferingInfoScRsp {
	repeated OfferingInfo offering_info_list = 3;
	uint32 retcode = 10;
}

message OfferingInfo {
	uint32 offering_id = 1;
	uint32 total_exp = 5;
	uint32 offering_level = 9;
	uint32 level_exp = 10;
	repeated uint32 has_taken_reward_id_list = 12;
	OfferingState offering_state = 14;
}

message OfferingInfoScNotify {
	OfferingInfo offering_info = 11;
}

enum OfferingState {
	OFFERING_STATE_NONE = 0;
	OFFERING_STATE_LOCK = 1;
	OFFERING_STATE_OPEN = 2;
}

message SubmitOfferingItemCsReq {
	uint32 offering_id = 4;
	uint32 interacted_prop_entity_id = 10;
}

message SubmitOfferingItemScRsp {
	uint32 retcode = 7;
	OfferingInfo offering_info = 14;
}

message TakeOfferingRewardCsReq {
	uint32 interacted_prop_entity_id = 8;
	uint32 offering_id = 10;
	repeated uint32 take_reward_level_list = 14;
}

message TakeOfferingRewardScRsp {
	uint32 retcode = 6;
	ItemList reward = 10;
	OfferingInfo offering_info = 15;
}
