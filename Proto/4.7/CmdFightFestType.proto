syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum BGLIMCBGLAJ {
	BGLIMCBGLAJ_PICLIGEAJFN = 0;
	BGLIMCBGLAJ_OGPNODHENKN = 1;
	BGLIMCBGLAJ_JPDBDLEEHGK = 2;
	BGLIMCBGLAJ_BMHMMIMOAIJ = 3;
	BGLIMCBGLAJ_DCGAPNGCCEH = 4;
}

enum CmdFightFestType {
	CmdFightFestType_NLCDGIPGFDJ = 0;
	CmdFightFestType_FightFestUpdateCoinNotify = 7274;
	CmdFightFestType_FightFestScoreUpdateNotify = 7280;
	CmdFightFestType_FightFestUpdateChallengeRecordNotify = 7284;
	CmdFightFestType_FightFestUnlockSkillNotify = 7285;
	CmdFightFestType_GetFightFestDataScRsp = 7288;
	CmdFightFestType_GetFightFestDataCsReq = 7292;
	CmdFightFestType_StartFightFestCsReq = 7298;
	CmdFightFestType_StartFightFestScRsp = 7300;
}

message EPCNGNEEMBI {
	uint32 id = 4;
	AvatarType avatar_type = 6;
}

message FightFestScoreUpdateNotify {
	uint32 JODNMFEFPFD = 8;
	uint32 score_id = 15;
}

enum FightFestType {
	FightFestType_None = 0;
	FightFestType_Main = 1;
	FightFestType_Score = 2;
	FightFestType_Challenge = 3;
	FightFestType_Teach = 4;
}

message FightFestUnlockSkillNotify {
	uint32 AMAGKDCBFGL = 3;
}

message FightFestUpdateChallengeRecordNotify {
	uint32 turn_left = 1;
	BGLIMCBGLAJ rank = 3;
	uint32 DJFGDMIDEHJ = 7;
	BGLIMCBGLAJ HMBBBNKAILD = 13;
	uint32 challenge_id = 14;
}

message FightFestUpdateCoinNotify {
	uint32 coin = 11;
}

message GetFightFestDataCsReq {
}

message GetFightFestDataScRsp {
	uint32 retcode = 3;
	repeated uint32 GILJLEOAOMA = 5;
	repeated LPJOINCGBBP challenge_list = 7;
	uint32 score_id = 10;
	uint32 item_value = 15;
}

message LPJOINCGBBP {
	uint32 challenge_id = 1;
	uint32 DJFGDMIDEHJ = 5;
	BGLIMCBGLAJ OINGNAJMFNL = 9;
}

message StartFightFestCsReq {
	uint32 event_id = 8;
	uint32 id = 9;
	FightFestType type = 10;
	repeated EPCNGNEEMBI avatar_list = 12;
	repeated uint32 GILJLEOAOMA = 15;
}

message StartFightFestScRsp {
	uint32 retcode = 2;
	uint32 event_id = 4;
	FightFestType type = 6;
	SceneBattleInfo battle_info = 9;
	uint32 id = 13;
}
