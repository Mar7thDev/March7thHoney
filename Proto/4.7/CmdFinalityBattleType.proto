syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdFinalityBattleType {
	CmdFinalityBattleType_NLCDGIPGFDJ = 0;
	CmdFinalityBattleType_FinalityBattleGetDataCsReq = 10023;
	CmdFinalityBattleType_FinalityBattleGetDataScRsp = 10026;
	CmdFinalityBattleType_StartFinalityBattleLevelCsReq = 10027;
	CmdFinalityBattleType_FinalityBattleSettleScNotify = 10028;
	CmdFinalityBattleType_StartFinalityBattleLevelScRsp = 10030;
}

message FinalityBattleGetDataCsReq {
}

message FinalityBattleGetDataScRsp {
	repeated FinalityBattleLevelRecord level_record_list = 2;
	uint32 retcode = 5;
}

message FinalityBattleLevelRecord {
	repeated uint32 finished_battle_target_id_list = 5;
	uint32 remaining_round = 6;
	uint32 level_id = 7;
	uint32 finished_wave = 14;
}

message FinalityBattleSettleScNotify {
	FinalityBattleLevelRecord level_record = 1;
	bool is_new_record = 9;
	BattleEndStatus end_status = 13;
}

message StartFinalityBattleLevelCsReq {
	uint32 level_id = 8;
	repeated KPNHGDGLICN avatar_list = 9;
	uint32 leading_role_id = 11;
}

message StartFinalityBattleLevelScRsp {
	uint32 retcode = 7;
	SceneBattleInfo battle_info = 8;
	uint32 level_id = 10;
}
