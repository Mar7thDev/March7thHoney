syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdPlayerBoardType {
	CmdPlayerBoardType_NLCDGIPGFDJ = 0;
	CmdPlayerBoardType_SetDisplayAvatarCsReq = 2805;
	CmdPlayerBoardType_OJKCPGJLCDI = 2806;
	CmdPlayerBoardType_SetIsDisplayAvatarInfoScRsp = 2818;
	CmdPlayerBoardType_GetPlayerBoardDataScRsp = 2819;
	CmdPlayerBoardType_SetSignatureScRsp = 2827;
	CmdPlayerBoardType_SetHeadIconCsReq = 2831;
	CmdPlayerBoardType_SetAssistAvatarScRsp = 2835;
	CmdPlayerBoardType_SetPersonalCardScRsp = 2847;
	CmdPlayerBoardType_SetAssistAvatarCsReq = 2852;
	CmdPlayerBoardType_SetIsDisplayAvatarInfoCsReq = 2859;
	CmdPlayerBoardType_SetSignatureCsReq = 2870;
	CmdPlayerBoardType_SetDisplayAvatarScRsp = 2871;
	CmdPlayerBoardType_GetPlayerBoardDataCsReq = 2874;
	CmdPlayerBoardType_SetHeadIconScRsp = 2887;
	CmdPlayerBoardType_SetPersonalCardCsReq = 2898;
}

message DisplayAvatarData {
	uint32 avatar_id = 5;
	uint32 pos = 11;
}

message DisplayAvatarVec {
	repeated DisplayAvatarData display_avatar_list = 6;
	bool is_display = 11;
}

message GetPlayerBoardDataCsReq {
}

message GetPlayerBoardDataScRsp {
	HeadFrameInfo head_frame_info = 2;
	uint32 current_head_icon_id = 3;
	repeated uint32 unlocked_personal_card_list = 4;
	DisplayAvatarVec display_avatar_vec = 7;
	repeated HeadIconData unlocked_head_icon_list = 8;
	repeated uint32 assist_avatar_id_list = 9;
	uint32 retcode = 12;
	string signature = 14;
	uint32 current_personal_card_id = 15;
}

message SetAssistAvatarCsReq {
	repeated uint32 avatar_id_list = 1;
	uint32 avatar_id = 6;
}

message SetAssistAvatarScRsp {
	uint32 retcode = 5;
	repeated uint32 avatar_id_list = 6;
	uint32 avatar_id = 13;
}

message SetDisplayAvatarCsReq {
	repeated DisplayAvatarData display_avatar_list = 6;
}

message SetDisplayAvatarScRsp {
	uint32 retcode = 2;
	repeated DisplayAvatarData display_avatar_list = 6;
}

message SetHeadIconCsReq {
	uint32 id = 8;
}

message SetHeadIconScRsp {
	uint32 retcode = 7;
	uint32 current_head_icon_id = 8;
}

message SetIsDisplayAvatarInfoCsReq {
	bool is_display = 7;
}

message SetIsDisplayAvatarInfoScRsp {
	uint32 retcode = 7;
	bool is_display = 15;
}

message SetPersonalCardCsReq {
	uint32 id = 4;
}

message SetPersonalCardScRsp {
	uint32 retcode = 4;
	uint32 current_personal_card_id = 12;
}

message SetSignatureCsReq {
	string signature = 8;
}

message SetSignatureScRsp {
	uint32 retcode = 2;
	string signature = 3;
}
