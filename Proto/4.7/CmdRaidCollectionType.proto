syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message BOPOBHGDIKN {
	uint32 OBLCIENDLED = 10;
}

enum CmdRaidCollectionType {
	CmdRaidCollectionType_NLCDGIPGFDJ = 0;
	CmdRaidCollectionType_RaidCollectionDataScRsp = 6948;
	CmdRaidCollectionType_RaidCollectionDataCsReq = 6955;
	CmdRaidCollectionType_RaidCollectionEnterNextRaidScRsp = 6956;
	CmdRaidCollectionType_RaidCollectionEnterNextRaidCsReq = 6960;
}

message RaidCollectionDataCsReq {
}

message RaidCollectionDataScRsp {
	uint32 retcode = 3;
	repeated BOPOBHGDIKN challenge_list = 13;
}

message RaidCollectionEnterNextRaidCsReq {
	uint32 world_level = 2;
	uint32 raid_id = 5;
	repeated uint32 avatar_list = 10;
	uint32 is_save = 14;
}

message RaidCollectionEnterNextRaidScRsp {
	RaidSceneData scene = 4;
	uint32 retcode = 11;
}
