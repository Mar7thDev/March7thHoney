syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdRollShopType {
	CmdRollShopType_NLCDGIPGFDJ = 0;
	CmdRollShopType_DoGachaInRollShopCsReq = 6904;
	CmdRollShopType_GetRollShopInfoScRsp = 6908;
	CmdRollShopType_TakeRollShopRewardScRsp = 6909;
	CmdRollShopType_GetRollShopInfoCsReq = 6915;
	CmdRollShopType_TakeRollShopRewardCsReq = 6916;
	CmdRollShopType_DoGachaInRollShopScRsp = 6920;
}

message DoGachaInRollShopCsReq {
	uint32 roll_shop_id = 5;
	uint32 gacha_count = 6;
	uint32 gacha_random = 10;
}

message DoGachaInRollShopScRsp {
	ItemList reward = 1;
	uint32 roll_shop_id = 2;
	uint32 reward_display_type = 3;
	uint32 retcode = 5;
	uint32 LDBCKJIPDHF = 15;
}

message GetRollShopInfoCsReq {
	uint32 roll_shop_id = 12;
}

message GetRollShopInfoScRsp {
	uint32 roll_shop_id = 4;
	uint32 gacha_random = 11;
	repeated uint32 shop_group_id_list = 13;
	uint32 retcode = 14;
}

message TakeRollShopRewardCsReq {
	uint32 FGFLIEADBLH = 6;
}

message TakeRollShopRewardScRsp {
	uint32 retcode = 2;
	uint32 group_type = 3;
	ItemList reward = 7;
	uint32 roll_shop_id = 11;
}
