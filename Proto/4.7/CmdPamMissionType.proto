syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message AcceptedPamMissionExpireCsReq {
	uint32 EBIIKKFIHNG = 4;
}

message AcceptedPamMissionExpireScRsp {
	uint32 retcode = 13;
}

enum CmdPamMissionType {
	CmdPamMissionType_NLCDGIPGFDJ = 0;
	CmdPamMissionType_AcceptedPamMissionExpireScRsp = 4019;
	CmdPamMissionType_SyncAcceptedPamMissionNotify = 4031;
	CmdPamMissionType_AcceptedPamMissionExpireCsReq = 4074;
}

message SyncAcceptedPamMissionNotify {
	uint32 main_mission_id = 10;
	uint64 expire_time = 12;
}
