syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdTalkEventType {
	CmdTalkEventType_MNPGFLPBDLK = 0;
	CmdTalkEventType_GetFirstTalkNpcCsReq = 2105;
	CmdTalkEventType_SelectInclinationTextCsReq = 2106;
	CmdTalkEventType_FinishFirstTalkNpcScRsp = 2118;
	CmdTalkEventType_GetNpcTakenRewardScRsp = 2119;
	CmdTalkEventType_GetFirstTalkByPerformanceNpcCsReq = 2127;
	CmdTalkEventType_TakeTalkRewardCsReq = 2131;
	CmdTalkEventType_FinishFirstTalkByPerformanceNpcCsReq = 2135;
	CmdTalkEventType_GetFirstTalkByPerformanceNpcScRsp = 2152;
	CmdTalkEventType_FinishFirstTalkNpcCsReq = 2159;
	CmdTalkEventType_SelectInclinationTextScRsp = 2170;
	CmdTalkEventType_GetFirstTalkNpcScRsp = 2171;
	CmdTalkEventType_GetNpcTakenRewardCsReq = 2174;
	CmdTalkEventType_TakeTalkRewardScRsp = 2187;
	CmdTalkEventType_FinishFirstTalkByPerformanceNpcScRsp = 2198;
}

message FinishFirstTalkByPerformanceNpcCsReq {
	uint32 performance_id = 3;
}

message FinishFirstTalkByPerformanceNpcScRsp {
	ItemList reward = 1;
	uint32 retcode = 13;
	uint32 performance_id = 15;
}

message FinishFirstTalkNpcCsReq {
	uint32 npc_id = 15;
}

message FinishFirstTalkNpcScRsp {
	uint32 retcode = 5;
	uint32 npc_id = 12;
}

message FirstNpcTalkInfo {
	uint32 npc_id = 11;
	bool is_meet = 15;
}

message GetFirstTalkByPerformanceNpcCsReq {
	repeated uint32 performance_id_list = 9;
}

message GetFirstTalkByPerformanceNpcScRsp {
	uint32 retcode = 10;
	repeated NpcMeetByPerformanceStatus npc_meet_status_list = 13;
}

message GetFirstTalkNpcCsReq {
	repeated uint32 npc_id_list = 13;
}

message GetFirstTalkNpcScRsp {
	repeated FirstNpcTalkInfo npc_meet_status_list = 1;
	uint32 retcode = 8;
}

message GetNpcTakenRewardCsReq {
	uint32 npc_id = 10;
}

message GetNpcTakenRewardScRsp {
	uint32 npc_id = 1;
	uint32 retcode = 4;
	repeated uint32 talk_event_list = 5;
}

message NpcMeetByPerformanceStatus {
	uint32 performance_id = 5;
	bool is_meet = 6;
}

message SelectInclinationTextCsReq {
	uint32 talk_sentence_id = 5;
}

message SelectInclinationTextScRsp {
	uint32 talk_sentence_id = 3;
	uint32 retcode = 15;
}

message TakeTalkRewardCsReq {
	uint32 MJALBOEAKME = 1;
	Vector JAKEBEGAJNA = 5;
}

message TakeTalkRewardScRsp {
	uint32 MJALBOEAKME = 3;
	ItemList reward = 9;
	uint32 retcode = 10;
}
