syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message ACIHMMBKMIM {
	AvatarType avatar_type = 8;
	uint32 avatar_id = 15;
}

enum CmdLocalLegendType {
	CmdLocalLegendType_NLCDGIPGFDJ = 0;
	CmdLocalLegendType_GetLocalLegendDataScRsp = 6579;
	CmdLocalLegendType_EnterLocalLegendLevelCsReq = 6586;
	CmdLocalLegendType_GetLocalLegendDataCsReq = 6587;
	CmdLocalLegendType_EnterLocalLegendLevelScRsp = 6590;
	CmdLocalLegendType_LocalLegendDataChangeNotify = 6591;
}

message EnterLocalLegendLevelCsReq {
	uint32 group_id = 3;
	uint32 DBKHHCGGKNN = 11;
	repeated ACIHMMBKMIM avatar_list = 14;
}

message EnterLocalLegendLevelScRsp {
	uint32 retcode = 3;
	uint32 DBKHHCGGKNN = 6;
	SceneBattleInfo battle_info = 7;
	uint32 group_id = 9;
}

message GetLocalLegendDataCsReq {
}

message GetLocalLegendDataScRsp {
	repeated JJEFLBCLBFN level_data_list = 4;
	uint32 retcode = 12;
}

message JJEFLBCLBFN {
	uint32 DBKHHCGGKNN = 3;
	uint32 FFGFINDLMCF = 9;
	uint32 group_id = 15;
}

message LocalLegendDataChangeNotify {
	JJEFLBCLBFN level_data = 6;
}
