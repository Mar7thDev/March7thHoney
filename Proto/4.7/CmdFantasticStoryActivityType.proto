syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdFantasticStoryActivityType {
	CmdFantasticStoryActivityType_NLCDGIPGFDJ = 0;
	CmdFantasticStoryActivityType_EnterFantasticStoryActivityStageScRsp = 4905;
	CmdFantasticStoryActivityType_GetFantasticStoryActivityDataScRsp = 4919;
	CmdFantasticStoryActivityType_FinishChapterScNotify = 4931;
	CmdFantasticStoryActivityType_FantasticStoryActivityBattleEndScNotify = 4971;
	CmdFantasticStoryActivityType_GetFantasticStoryActivityDataCsReq = 4974;
	CmdFantasticStoryActivityType_EnterFantasticStoryActivityStageCsReq = 4987;
}

message EnterFantasticStoryActivityStageCsReq {
	uint32 battle_id = 3;
	uint32 OFHBPNGDEGO = 4;
	repeated uint32 buff_list = 13;
	repeated PKCIPJBKAFO avatar_list = 15;
}

message EnterFantasticStoryActivityStageScRsp {
	uint32 retcode = 2;
	uint32 battle_id = 7;
	uint32 OFHBPNGDEGO = 9;
	SceneBattleInfo battle_info = 14;
}

message FGGCEKHFPLH {
	repeated uint32 buff_list = 1;
	repeated PKCIPJBKAFO avatar_list = 7;
}

message FantasticStoryActivityBattleEndScNotify {
	uint32 FHBNGHINHOG = 3;
	uint32 OFHBPNGDEGO = 7;
	uint32 battle_id = 9;
}

message FinishChapterScNotify {
	GCFDJCPFOGG ONIEMLICONB = 4;
}

message GCFDJCPFOGG {
	repeated uint32 DJJKDGEFOIP = 2;
	repeated uint32 HPLNHIFHBMA = 3;
	map<uint32, FGGCEKHFPLH> DALPAKHCKLI = 6;
	repeated uint32 FIBFIKOBDPG = 7;
	repeated uint32 JJOBBOHHOMG = 8;
	map<uint32, uint32> DLBOJCCDCFI = 11;
	uint32 OFHBPNGDEGO = 13;
}

message GetFantasticStoryActivityDataCsReq {
	uint32 OFHBPNGDEGO = 8;
}

message GetFantasticStoryActivityDataScRsp {
	GCFDJCPFOGG ONIEMLICONB = 1;
	uint32 retcode = 11;
}

message PKCIPJBKAFO {
	uint32 avatar_id = 13;
	AvatarType avatar_type = 15;
}
