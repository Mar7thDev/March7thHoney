syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message AcceptMultipleExpeditionCsReq {
	repeated ExpeditionInfo expedition = 9;
}

message AcceptMultipleExpeditionScRsp {
	int64 BJMGDBCHEAN = 1;
	uint32 retcode = 6;
	repeated ExpeditionInfo accept_multi_expedition = 11;
	repeated ItemList DJOBNPIAEJP = 13;
}

enum CmdExpeditionType {
	CmdExpeditionType_NLCDGIPGFDJ = 0;
	CmdExpeditionType_TakeMultipleExpeditionRewardScRsp = 2515;
	CmdExpeditionType_TakeMultipleExpeditionRewardCsReq = 2516;
	CmdExpeditionType_AcceptMultipleExpeditionCsReq = 2525;
	CmdExpeditionType_DFJDNLNFKLG = 2537;
	CmdExpeditionType_GetExpeditionDataScRsp = 2538;
	CmdExpeditionType_GetExpeditionDataCsReq = 2542;
	CmdExpeditionType_AcceptMultipleExpeditionScRsp = 2544;
}

message ExpeditionInfo {
	uint32 id = 15;
}

message GetExpeditionDataCsReq {
}

message GetExpeditionDataScRsp {
	int64 BJMGDBCHEAN = 4;
	uint32 total_expedition_count = 9;
	repeated ExpeditionInfo expedition_info = 11;
	uint32 retcode = 12;
	repeated uint32 CAALNNFJIAH = 14;
}

message HKCILGGEEFM {
	repeated ExpeditionInfo expedition_info = 2;
	int64 BJMGDBCHEAN = 13;
	repeated uint32 CAALNNFJIAH = 14;
	uint32 total_expedition_count = 15;
}

message TakeMultipleExpeditionRewardCsReq {
}

message TakeMultipleExpeditionRewardScRsp {
	repeated ItemList DJOBNPIAEJP = 1;
	uint32 retcode = 8;
	int64 BJMGDBCHEAN = 9;
	repeated uint32 NPCMKBNJABA = 15;
}
