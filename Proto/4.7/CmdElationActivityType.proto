syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdElationActivityType {
	CmdElationActivityType_NLCDGIPGFDJ = 0;
	CmdElationActivityType_GetElationActivityDataCsReq = 9103;
	CmdElationActivityType_GetElationActivityDataScRsp = 9106;
	CmdElationActivityType_EnterElationActivityStageCsReq = 9107;
	CmdElationActivityType_ElationActivityBattleEndScNotify = 9108;
	CmdElationActivityType_EnterElationActivityStageScRsp = 9110;
}

message ElationActivityAvatar {
	AvatarType avatar_type = 4;
	uint32 avatar_id = 5;
}

message ElationActivityBattleEndScNotify {
	uint32 level_id = 1;
	ElationActivityLevelData level_data = 3;
	uint32 JCFMCEPKEHA = 6;
	uint32 perfect_wave = 11;
	uint32 JIGFPIOBAHB = 12;
}

message ElationActivityLevelData {
	uint32 FFGFINDLMCF = 2;
	bool is_perfect = 6;
	uint32 level_id = 7;
	uint32 BOEINFJIILE = 13;
	uint32 CHPCJIBGKFK = 14;
}

message EnterElationActivityStageCsReq {
	repeated ElationActivityAvatar fixed_avatar_list = 2;
	repeated ElationActivityAvatar player_selected_avatar_list = 4;
	uint32 level_id = 12;
}

message EnterElationActivityStageScRsp {
	uint32 level_id = 2;
	SceneBattleInfo battle_info = 12;
	uint32 retcode = 13;
}

message GetElationActivityDataCsReq {
}

message GetElationActivityDataScRsp {
	repeated ElationActivityLevelData level_data_list = 1;
	uint32 retcode = 4;
}
