}

message StartChallengeTierceCsReq {
	bool is_single_stage = 2;
	uint32 challenge_id = 3;
	uint32 stage_index = 5;
	repeated ChallengeTierceStageLineupInfo stage_info_list = 9;
}

message StartChallengeTierceScRsp {
	uint32 retcode = 3;
	SceneInfo scene = 9;
	ChallengeTierceChallengeInfo challenge_tierce_info = 15;
}

message StartNextChallengeTierceCsReq {
}

message StartNextChallengeTierceScRsp {
	SceneInfo scene = 1;
