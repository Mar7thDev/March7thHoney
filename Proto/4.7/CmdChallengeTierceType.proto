syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message CLDOIEGCNLD {
	uint32 avatar_id = 1;
	uint32 avatar_type = 2;
	uint32 slot = 3;
	uint32 level = 4;
	uint32 skin_id = 5;
	ChallengeBossEquipmentInfo equipment = 6;
	ChallengeBossAvatarRelicInfo OKCGHKDMFAM = 7;
}

message ChallengeTierceChallengeInfo {
	repeated LineupInfo lineup_list = 2;
	ChallengeTiercePendingStageSettle IIHFEDLHOPI = 3;
	bool is_single_stage = 7;
	uint32 challenge_id = 9;
	uint32 stage_index = 13;
}

message ChallengeTierceData {
	bool is_passed = 3;
	uint32 challenge_id = 8;
	repeated ChallengeTierceStageInfo stage_info_list = 9;
	repeated uint32 finished_target_list = 11;
	repeated ChallengeTierceStageData result_list = 13;
	ChallengeTierceRecord record = 15;
}

message ChallengeTierceMedal {
	uint32 group_id = 9;
}

message ChallengeTiercePendingStageSettle {
	uint32 NEDGGMGMLGO = 1;
	uint32 OPNPMBJDKNB = 4;
	uint32 MMCPICGKOGD = 11;
	uint32 BIEPFFBBJHG = 319;
	uint32 DPDNPCBNENI = 597;
	uint32 EKKLCBKNAED = 833;
}

message ChallengeTierceRecord {
	uint32 total_score = 7;
	uint32 used_cycle_count = 15;
}

message ChallengeTierceRecordInfo {
	uint32 challenge_id = 4;
	repeated ChallengeTierceStageRecord result_list = 9;
	bool is_passed = 12;
	repeated uint32 finished_target_list = 15;
}

message ChallengeTierceReward {
	uint32 HEJANCCDGAP = 4;
	ItemList reward = 15;
}

message ChallengeTierceStageClear {
	repeated uint32 LICPEKHDJGK = 3;
	uint32 challenge_id = 5;
}

message ChallengeTierceStageData {
	repeated BattleTarget battle_target_list = 2;
	uint32 INLLMKEDGLC = 3;
	uint32 IBECKONIICF = 5;
	uint32 score_id = 6;
	uint32 stage_index = 8;
	BattleEndStatus end_status = 9;
	GLLFJFJBIBC lineup = 15;
}

message ChallengeTierceStageInfo {
	repeated uint32 peak_avatar_id_list = 4;
	uint32 stage_index = 5;
	repeated AvatarIdentifier lineup = 6;
	uint32 buff_id = 13;
}

message ChallengeTierceStageLineupInfo {
	repeated AvatarIdentifier lineup = 9;
	uint32 buff_id = 10;
}

message ChallengeTierceStageRecord {
	uint32 score_id = 3;
	uint32 stage_index = 4;
	uint32 INLLMKEDGLC = 6;
	uint32 IBECKONIICF = 10;
}

message ChallengeTierceSyncAllStage {
	repeated ChallengeTierceReward DJOBNPIAEJP = 1;
	uint32 challenge_id = 7;
	ChallengeTierceRecord EGEHLOPFELK = 11;
	repeated ChallengeTierceStageData GBMBAHHDONN = 14;
	repeated uint32 finished_target_list = 65;
	bool is_passed = 260;
}

message ChallengeTierceSyncNotify {
	oneof MMCGBGDJIPN {
		ChallengeTiercePendingStageSettle IIHFEDLHOPI = 3;
		ChallengeTierceSyncAllStage DFNNKENBOEN = 7;
		ChallengeTierceMedal medal = 8;
		ChallengeTierceSyncSingleStage IANBCDJPDJF = 9;
		ChallengeTierceStageClear IBFHHKHNEFL = 14;
	}
}

message ChallengeTierceSyncSingleStage {
	ChallengeTierceStageData stage_data = 3;
	repeated uint32 finished_target_list = 112;
	bool is_passed = 1266;
}

enum CmdChallengeTierceType {
	CmdChallengeTierceType_NLCDGIPGFDJ = 0;
	CmdChallengeTierceType_ChallengeTierceSyncNotify = 8975;
	CmdChallengeTierceType_StartNextChallengeTierceScRsp = 8977;
	CmdChallengeTierceType_StartNextChallengeTierceCsReq = 8978;
	CmdChallengeTierceType_SetChallengeTierceLineupScRsp = 8979;
	CmdChallengeTierceType_GetChallengeTierceControllerScRsp = 8981;
	CmdChallengeTierceType_ConfirmChallengeTierceStageSettleCsReq = 8982;
	CmdChallengeTierceType_LeaveChallengeTierceScRsp = 8983;
	CmdChallengeTierceType_RestartChallengeTierceCsReq = 8985;
	CmdChallengeTierceType_StartChallengeTierceCsReq = 8986;
	CmdChallengeTierceType_LeaveChallengeTierceCsReq = 8989;
	CmdChallengeTierceType_SetChallengeTierceLineupCsReq = 8992;
	CmdChallengeTierceType_GetChallengeTierceControllerCsReq = 8993;
	CmdChallengeTierceType_ConfirmChallengeTierceStageSettleScRsp = 8994;
	CmdChallengeTierceType_GetChallengeTierceDataCsReq = 8995;
	CmdChallengeTierceType_GetChallengeTierceDataScRsp = 8996;
	CmdChallengeTierceType_StartChallengeTierceScRsp = 8998;
	CmdChallengeTierceType_RestartChallengeTierceScRsp = 9000;
}

message ConfirmChallengeTierceStageSettleCsReq {
	bool IOBCIMIPEOM = 4;
}

message ConfirmChallengeTierceStageSettleScRsp {
	uint32 retcode = 6;
}

message GLLFJFJBIBC {
	repeated CLDOIEGCNLD MNABNJOEHLF = 1;
}

message GetChallengeTierceControllerCsReq {
}

message GetChallengeTierceControllerScRsp {
	ChallengeTierceRecordInfo OHPGEHKFABM = 5;
	ChallengeTierceChallengeInfo challenge_tierce_info = 7;
	uint32 retcode = 12;
}

message GetChallengeTierceDataCsReq {
}

message GetChallengeTierceDataScRsp {
	repeated ChallengeTierceData challenge_info_list = 1;
	uint32 retcode = 11;
}

message LeaveChallengeTierceCsReq {
}

message LeaveChallengeTierceScRsp {
	uint32 retcode = 13;
