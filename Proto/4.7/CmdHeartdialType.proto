syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message ChangeScriptEmotionCsReq {
	HeartDialEmotionType target_emotion_type = 6;
	uint32 BLKFCFGMMBD = 12;
	uint32 script_id = 13;
}

message ChangeScriptEmotionScRsp {
	uint32 retcode = 5;
	uint32 script_id = 7;
	HeartDialEmotionType emotion_type = 14;
}

enum CmdHeartdialType {
	CmdHeartdialType_NLCDGIPGFDJ = 0;
	CmdHeartdialType_SubmitEmotionItemCsReq = 6305;
	CmdHeartdialType_HeartDialScriptChangeScNotify = 6306;
	CmdHeartdialType_FinishEmotionDialoguePerformanceScRsp = 6318;
	CmdHeartdialType_GetHeartDialInfoScRsp = 6319;
	CmdHeartdialType_HeartDialTraceScriptScRsp = 6327;
	CmdHeartdialType_ChangeScriptEmotionCsReq = 6331;
	CmdHeartdialType_FinishEmotionDialoguePerformanceCsReq = 6359;
	CmdHeartdialType_HeartDialTraceScriptCsReq = 6370;
	CmdHeartdialType_SubmitEmotionItemScRsp = 6371;
	CmdHeartdialType_GetHeartDialInfoCsReq = 6374;
	CmdHeartdialType_ChangeScriptEmotionScRsp = 6387;
}

message EAJEMNNNEBM {
	uint32 CNHLAAHDPGA = 7;
	uint32 LLIOEMOBFGD = 13;
}

message FinishEmotionDialoguePerformanceCsReq {
	uint32 script_id = 4;
	uint32 dialogue_id = 12;
	uint32 BLKFCFGMMBD = 13;
}

message FinishEmotionDialoguePerformanceScRsp {
	ItemList reward_list = 1;
	uint32 dialogue_id = 3;
	uint32 retcode = 6;
	uint32 script_id = 8;
}

message GetHeartDialInfoCsReq {
}

message GetHeartDialInfoScRsp {
	repeated HeartDialScriptInfo script_info_list = 1;
	uint32 retcode = 4;
	repeated HeartDialDialogueInfo dialogue_info_list = 11;
	repeated EAJEMNNNEBM EBLMNLBBFNL = 12;
	HeartDialUnlockStatus unlock_status = 13;
}

message HeartDialDialogueInfo {
	uint32 dialogue_id = 7;
	bool GDPHOIMONLN = 10;
}

enum HeartDialEmotionType {
	HEART_DIAL_EMOTION_TYPE_PEACE = 0;
	HEART_DIAL_EMOTION_TYPE_ANGER = 1;
	HEART_DIAL_EMOTION_TYPE_HAPPY = 2;
	HEART_DIAL_EMOTION_TYPE_SAD = 3;
}

message HeartDialScriptChangeScNotify {
	repeated HeartDialScriptInfo changed_script_info_list = 1;
	repeated EAJEMNNNEBM EBLMNLBBFNL = 2;
	repeated HeartDialDialogueInfo changed_dialogue_info_list = 9;
	HeartDialUnlockStatus unlock_status = 15;
}

message HeartDialScriptInfo {
	HeartDialEmotionType cur_emotion_type = 1;
	HeartDialStepType step = 5;
	bool EEKCKFGHGEH = 10;
	bool LHCOJIEBFFM = 11;
	uint32 script_id = 12;
}

enum HeartDialStepType {
	HeartDialStepType_COEEJALELPF = 0;
	HeartDialStepType_BADPBGFJPNN = 1;
	HeartDialStepType_game_lock_info = 2;
	HeartDialStepType_CCJMKNNHKKE = 3;
	HeartDialStepType_BEJEBBNFGPM = 4;
	HeartDialStepType_NGNFOIHNLMJ = 5;
}

message HeartDialTraceScriptCsReq {
	EAJEMNNNEBM NDPMEMLJGCK = 8;
}

message HeartDialTraceScriptScRsp {
	EAJEMNNNEBM NDPMEMLJGCK = 7;
	uint32 retcode = 15;
}

enum HeartDialUnlockStatus {
	HEART_DIAL_UNLOCK_STATUS_LOCK = 0;
	HEART_DIAL_UNLOCK_STATUS_UNLOCK_SINGLE = 1;
	HEART_DIAL_UNLOCK_STATUS_UNLOCK_ALL = 2;
}

message SubmitEmotionItemCsReq {
	ItemList item_list = 7;
	uint32 script_id = 8;
}

message SubmitEmotionItemScRsp {
	uint32 script_id = 5;
	uint32 retcode = 10;
}
