syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

enum CmdServerPrefsType {
	CmdServerPrefsType_NLCDGIPGFDJ = 0;
	CmdServerPrefsType_UpdateServerPrefsCsReq = 6105;
	CmdServerPrefsType_GetAllServerPrefsDataScRsp = 6119;
	CmdServerPrefsType_BIOLLCIKFFD = 6131;
	CmdServerPrefsType_UpdateServerPrefsDataScRsp = 6171;
	CmdServerPrefsType_GetAllServerPrefsDataCsReq = 6174;
	CmdServerPrefsType_GetServerPrefsDataScRsp = 6187;
}

message GetAllServerPrefsDataCsReq {
}

message GetAllServerPrefsDataScRsp {
	uint32 retcode = 2;
	repeated ServerPrefs server_prefs_list = 10;
}

message GetServerPrefsDataScRsp {
