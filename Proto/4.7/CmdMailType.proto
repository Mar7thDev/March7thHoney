syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message ClientMail {
	string sender = 2;
	uint32 id = 3;
	string content = 5;
	bool is_read = 6;
	int64 time = 7;
	uint32 template_id = 8;
	int64 expire_time = 10;
	ItemList attachment = 11;
	string title = 12;
	MailType mail_type = 14;
	repeated string para_list = 15;
}

enum CmdMailType {
	CmdMailType_NLCDGIPGFDJ = 0;
	CmdMailType_DelMailCsReq = 805;
	CmdMailType_NewMailScNotify = 806;
	CmdMailType_TakeMailAttachmentScRsp = 818;
	CmdMailType_GetMailScRsp = 819;
	CmdMailType_MarkReadMailCsReq = 831;
	CmdMailType_TakeMailAttachmentCsReq = 859;
	CmdMailType_DelMailScRsp = 871;
	CmdMailType_GetMailCsReq = 874;
	CmdMailType_MarkReadMailScRsp = 887;
}

message DelMailCsReq {
	repeated uint32 id_list = 10;
}

message DelMailScRsp {
	uint32 retcode = 1;
	repeated uint32 id_list = 13;
}

message GetMailCsReq {
	uint32 HFKFNFKIEON = 7;
	uint32 start = 13;
}

message GetMailScRsp {
	repeated ClientMail notice_mail_list = 5;
	bool is_end = 6;
	uint32 total_num = 7;
	uint32 retcode = 8;
	uint32 start = 12;
	repeated ClientMail mail_list = 15;
}

message KNPNAHPHNJK {
	uint32 item_id = 3;
	uint32 IODBGABPNOP = 5;
}

enum MailType {
	MailType_Normal = 0;
	MailType_Star = 1;
}

message MarkReadMailCsReq {
	uint32 id = 8;
}

message MarkReadMailScRsp {
	uint32 retcode = 1;
	uint32 id = 10;
}

message NewMailScNotify {
	repeated uint32 mail_id_list = 7;
}

message TakeMailAttachmentCsReq {
	repeated uint32 mail_id_list = 5;
	uint32 optional_reward_id = 15;
}

message TakeMailAttachmentScRsp {
	repeated KNPNAHPHNJK fail_mail_list = 5;
	ItemList attachment = 6;
	uint32 retcode = 8;
	repeated uint32 succ_mail_id_list = 9;
}
