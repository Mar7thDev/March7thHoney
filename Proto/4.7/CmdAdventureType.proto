syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdAdventureType {
	CmdAdventureType_NLCDGIPGFDJ = 0;
	CmdAdventureType_QuickStartCocoonStageCsReq = 1305;
	CmdAdventureType_CocoonSweepCsReq = 1306;
	CmdAdventureType_QuickStartFarmElementScRsp = 1318;
	CmdAdventureType_FarmElementSweepCsReq = 1327;
	CmdAdventureType_GetFarmStageGachaInfoCsReq = 1331;
	CmdAdventureType_FarmElementSweepScRsp = 1352;
	CmdAdventureType_QuickStartFarmElementCsReq = 1359;
	CmdAdventureType_CocoonSweepScRsp = 1370;
	CmdAdventureType_QuickStartCocoonStageScRsp = 1371;
	CmdAdventureType_GetFarmStageGachaInfoScRsp = 1387;
}

message CocoonSweepCsReq {
	uint32 world_level = 2;
	uint32 cocoon_id = 4;
}

message CocoonSweepScRsp {
	ItemList drop_data = 7;
	uint32 retcode = 8;
	uint32 NCEFJFOHGBI = 11;
	uint32 cocoon_id = 13;
	ItemList multiple_drop_data = 15;
}

message FarmElementSweepCsReq {
	uint32 world_level = 4;
	uint32 PAOFHFLFFHD = 12;
}

message FarmElementSweepScRsp {
	uint32 retcode = 2;
	uint32 PAOFHFLFFHD = 9;
	ItemList multiple_drop_data = 12;
}

message FarmStageGachaInfo {
	int64 begin_time = 5;
	uint32 gacha_id = 8;
	int64 end_time = 9;
}

message GetFarmStageGachaInfoCsReq {
	repeated uint32 farm_stage_gacha_id_list = 10;
}

message GetFarmStageGachaInfoScRsp {
	repeated FarmStageGachaInfo farm_stage_gacha_info_list = 1;
	uint32 retcode = 3;
}

message QuickStartCocoonStageCsReq {
	uint32 wave = 1;
	uint32 HECCOBFBJFI = 2;
	NAJKNJLJPEP CBJCKEIGGNL = 3;
	uint32 world_level = 8;
	uint32 cocoon_id = 15;
}

message QuickStartCocoonStageScRsp {
	uint32 retcode = 1;
	SceneBattleInfo battle_info = 5;
	uint32 wave = 8;
	uint32 cocoon_id = 11;
}

message QuickStartFarmElementCsReq {
	uint32 world_level = 3;
	uint32 PAOFHFLFFHD = 5;
	uint32 HECCOBFBJFI = 15;
}

message QuickStartFarmElementScRsp {
	uint32 PAOFHFLFFHD = 3;
	SceneBattleInfo battle_info = 6;
	uint32 world_level = 8;
	uint32 retcode = 11;
}
