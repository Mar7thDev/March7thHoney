syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message BOMPFHOMMBH {
	uint32 num = 1;
	uint32 target = 2;
	uint32 item_id = 6;
}

enum CmdActivityRewardStatType {
	CmdActivityRewardStatType_HBPEDDCOJDB = 0;
	CmdActivityRewardStatType_GetActivityHotDataCsReq = 9113;
	CmdActivityRewardStatType_GetActivityRewardCountDataScRsp = 9114;
	CmdActivityRewardStatType_GetActivityHotDataScRsp = 9116;
	CmdActivityRewardStatType_GetAllActivityRewardCountDataCsReq = 9117;
	CmdActivityRewardStatType_GetActivityRewardCountDataCsReq = 9118;
	CmdActivityRewardStatType_GetAllActivityRewardCountDataScRsp = 9120;
}

message EFGIHHJGCFA {
	repeated BOMPFHOMMBH PGMDGPEKDGB = 4;
	uint32 panel_id = 14;
}

message GetActivityHotDataCsReq {
}

message GetActivityHotDataScRsp {
	uint32 retcode = 2;
	repeated EFGIHHJGCFA content_package_list = 6;
	repeated NEGCAHDLGMI LMGCFHBPAGO = 12;
}

message GetActivityRewardCountDataCsReq {
	repeated uint32 DDMEHPDHPLM = 4;
}

message GetActivityRewardCountDataScRsp {
	uint32 retcode = 6;
	repeated EFGIHHJGCFA content_package_list = 8;
}

message GetAllActivityRewardCountDataCsReq {
}

message GetAllActivityRewardCountDataScRsp {
	repeated EFGIHHJGCFA content_package_list = 13;
	uint32 retcode = 14;
}

message NEGCAHDLGMI {
	uint32 id = 12;
	repeated BOMPFHOMMBH PGMDGPEKDGB = 13;
}
