syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdMapRotationType {
	CmdMapRotationType_NLCDGIPGFDJ = 0;
	CmdMapRotationType_UpdateRotaterScNotify = 6804;
	CmdMapRotationType_DeployRotatorCsReq = 6805;
	CmdMapRotationType_LeaveMapRotationRegionCsReq = 6806;
	CmdMapRotationType_RemoveRotatorCsReq = 6808;
	CmdMapRotationType_RotateMapScRsp = 6818;
	CmdMapRotationType_EnterMapRotationRegionScRsp = 6819;
