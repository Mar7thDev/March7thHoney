syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

enum CmdMechCraftType {
	CmdMechCraftType_NLCDGIPGFDJ = 0;
	CmdMechCraftType_MechCraftSubmitOrderCsReq = 10004;
	CmdMechCraftType_MechCraftSaveDiyScRsp = 10005;
	CmdMechCraftType_MechCraftActivateTalentPointCsReq = 10006;
	CmdMechCraftType_MechCraftUnlockScNotify = 10007;
	CmdMechCraftType_MechCraftGetDataScRsp = 10008;
	CmdMechCraftType_MechCraftSubmitExamScRsp = 10009;
	CmdMechCraftType_MechCraftFinishReportScRsp = 10010;
	CmdMechCraftType_MechCraftReportGameStateCsReq = 10011;
	CmdMechCraftType_MechCraftSaveDiyCsReq = 10012;
	CmdMechCraftType_MechCraftActivateTalentPointScRsp = 10013;
	CmdMechCraftType_MechCraftGetDataCsReq = 10015;
	CmdMechCraftType_MechCraftSubmitExamCsReq = 10016;
	CmdMechCraftType_MechCraftReportGameStateScRsp = 10018;
	CmdMechCraftType_MechCraftFinishReportCsReq = 10019;
	CmdMechCraftType_MechCraftSubmitOrderScRsp = 10020;
}

message MechCraftActivateTalentPointCsReq {
	uint32 talent_point_id = 14;
}

message MechCraftActivateTalentPointScRsp {
	uint32 retcode = 8;
	uint32 coin = 14;
}

message MechCraftChipPiece {
	uint32 x = 4;
	uint32 chip_id = 6;
	uint32 y = 7;
	bool is_locked = 9;
	uint32 rotation = 10;
}

message MechCraftChipUnlockUpdate {
	repeated uint32 available_chip_id_list = 12;
}

message MechCraftDiyMechatron {
	uint32 mechatron_id = 4;
	uint32 paint_color_id = 7;
	uint32 pose_id = 10;
	uint32 effect_color_id = 15;
}

message MechCraftFinishReportCsReq {
	uint32 report_id = 8;
}

message MechCraftFinishReportScRsp {
	uint32 retcode = 11;
}

message MechCraftGameBeginInfo {
	uint32 order_id = 5;
	uint32 exam_id = 6;
}

message MechCraftGameEndInfo {
	uint32 status = 1;
	repeated MechCraftChipPiece chip_piece_list = 6;
	uint32 order_id = 9;
	uint32 exam_id = 15;
}

message MechCraftGetDataCsReq {
}

message MechCraftGetDataScRsp {
	uint32 revenue = 1;
	repeated MechCraftDiyMechatron diy_mechatron_list = 2;
	repeated uint32 activated_talent_point_id_list = 3;
	repeated uint32 finished_report_id_list = 4;
	repeated uint32 available_chip_id_list = 5;
	repeated uint32 available_mechatron_id_list = 6;
	uint32 design_level = 7;
	repeated uint32 available_order_id_list = 8;
	uint32 total_design_exp = 9;
	uint32 retcode = 10;
	uint32 coin = 11;
	uint32 workshop_level = 13;
	uint32 selected_mechatron_id = 14;
	uint32 running_exam_id = 15;
}

message MechCraftMechatronUnlockUpdate {
	repeated uint32 available_mechatron_id_list = 8;
}

message MechCraftOrderUnlockUpdate {
	repeated uint32 available_order_id_list = 2;
}

message MechCraftReportGameStateCsReq {
	oneof game_state {
		MechCraftGameBeginInfo begin_info = 7;
		MechCraftGameEndInfo end_info = 11;
	}
}

message MechCraftReportGameStateScRsp {
	uint32 retcode = 10;
}

message MechCraftSaveDiyCsReq {
	repeated MechCraftDiyMechatron diy_mechatron_list = 5;
	uint32 selected_mechatron_id = 8;
}

message MechCraftSaveDiyScRsp {
	uint32 retcode = 15;
}

message MechCraftSubmitExamCsReq {
	uint32 exam_id = 1;
	repeated MechCraftChipPiece chip_piece_list = 4;
}

message MechCraftSubmitExamScRsp {
	uint32 workshop_level = 2;
	uint32 retcode = 9;
}

message MechCraftSubmitOrderCsReq {
	uint32 order_id = 5;
	repeated MechCraftChipPiece chip_piece_list = 15;
}

message MechCraftSubmitOrderScRsp {
	repeated uint32 gain_bonus_coin_list = 1;
	uint32 gain_integration_coin = 2;
	uint32 gain_extra_coin = 5;
	uint32 gain_basic_coin = 7;
	uint32 running_exam_id = 8;
	uint32 gain_design_exp = 10;
	uint32 design_level = 11;
	uint32 gain_total_coin = 14;
	uint32 retcode = 15;
}

message MechCraftTalentPointUnlockUpdate {
	repeated uint32 activated_talent_point_id_list = 8;
}

message MechCraftUnlockScNotify {
	repeated MechCraftUnlockUpdate unlock_update_list = 3;
}

message MechCraftUnlockUpdate {
	oneof unlock_update {
		MechCraftOrderUnlockUpdate order_update = 3;
		MechCraftTalentPointUnlockUpdate talent_point_update = 4;
		MechCraftChipUnlockUpdate chip_update = 12;
		MechCraftMechatronUnlockUpdate mechatron_update = 14;
	}
}
