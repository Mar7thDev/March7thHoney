syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message ArchiveData {
	repeated uint32 archive_equipment_id_list = 4;
	repeated MonsterList kill_monster_list = 7;
	repeated RelicList relic_list = 9;
	repeated uint32 archive_avatar_id_list = 12;
	repeated uint32 archive_missing_equipment_id_list = 13;
}

enum CmdArchiveType {
	CmdArchiveType_NLCDGIPGFDJ = 0;
	CmdArchiveType_GetArchiveDataScRsp = 2319;
	CmdArchiveType_GetUpdatedArchiveDataCsReq = 2331;
	CmdArchiveType_GetArchiveDataCsReq = 2374;
	CmdArchiveType_GetUpdatedArchiveDataScRsp = 2387;
}

message GetArchiveDataCsReq {
}

message GetArchiveDataScRsp {
	ArchiveData archive_data = 1;
	uint32 retcode = 10;
}

message GetUpdatedArchiveDataCsReq {
}

message GetUpdatedArchiveDataScRsp {
	uint32 retcode = 8;
	ArchiveData archive_data = 12;
}

message MonsterList {
	uint32 num = 9;
	uint32 monster_id = 14;
}

message RelicList {
	uint32 set_id = 6;
	uint32 type = 15;
}
