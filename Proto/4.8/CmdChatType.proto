syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message BatchMarkChatEmojiCsReq {
	repeated uint32 GGNABOANAPC = 14;
}

message BatchMarkChatEmojiScRsp {
	uint32 retcode = 1;
	repeated uint32 marked_emoji_id_list = 11;
}

enum ChatType {
	ChatType_None = 0;
	ChatType_Private = 1;
	ChatType_Group = 2;
}

enum CmdChatType {
	CmdChatType_NLCDGIPGFDJ = 0;
	CmdChatType_GetLoginChatInfoScRsp = 3904;
	CmdChatType_GetChatFriendHistoryCsReq = 3907;
	CmdChatType_MarkChatEmojiCsReq = 3908;
	CmdChatType_BatchMarkChatEmojiScRsp = 3912;
	CmdChatType_GetChatEmojiListCsReq = 3926;
	CmdChatType_GetPrivateChatHistoryScRsp = 3933;
	CmdChatType_BatchMarkChatEmojiCsReq = 3943;
	CmdChatType_SendMsgScRsp = 3954;
	CmdChatType_GetLoginChatInfoCsReq = 3969;
	CmdChatType_GetPrivateChatHistoryCsReq = 3973;
	CmdChatType_GetChatEmojiListScRsp = 3978;
	CmdChatType_MarkChatEmojiScRsp = 3981;
	CmdChatType_SendMsgCsReq = 3983;
	CmdChatType_GetChatFriendHistoryScRsp = 3991;
	CmdChatType_RevcMsgScNotify = 3996;
}

message FriendHistoryInfo {
	int64 last_send_time = 2;
	uint32 contact_side = 12;
}

message GetChatEmojiListCsReq {
}

message GetChatEmojiListScRsp {
	repeated uint32 chat_emoji_list = 6;
	uint32 retcode = 9;
}

message GetChatFriendHistoryCsReq {
}

message GetChatFriendHistoryScRsp {
	repeated FriendHistoryInfo friend_history_info = 7;
	uint32 retcode = 10;
}

message GetLoginChatInfoCsReq {
}

message GetLoginChatInfoScRsp {
	repeated uint32 contact_id_list = 4;
	uint32 retcode = 11;
}

message GetPrivateChatHistoryCsReq {
	uint32 target_side = 1;
	uint32 contact_side = 9;
}

message GetPrivateChatHistoryScRsp {
	uint32 retcode = 6;
	repeated ChatMessageData chat_message_list = 11;
	uint32 contact_side = 12;
	uint32 target_side = 14;
}

message MarkChatEmojiCsReq {
	bool is_remove_id = 7;
	uint32 emoji_id = 10;
}

message MarkChatEmojiScRsp {
	bool is_remove_id = 3;
	uint32 retcode = 8;
	uint32 emoji_id = 12;
}

message RevcMsgScNotify {
	uint32 source_uid = 6;
	ChatMessageData recv_message_data = 8;
	ChatType chat_type = 9;
}

message SendMsgCsReq {
	repeated uint32 target_list = 3;
	ChatType chat_type = 11;
	MessageChatData message_datas = 15;
}

message SendMsgScRsp {
	uint32 retcode = 4;
	uint64 end_time = 12;
}
