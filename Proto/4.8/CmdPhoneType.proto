syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

enum CmdPhoneType {
	CmdPhoneType_NLCDGIPGFDJ = 0;
	CmdPhoneType_SelectPhoneThemeScRsp = 5107;
	CmdPhoneType_UnlockPhoneCaseScNotify = 5108;
	CmdPhoneType_SelectPhoneCaseCsReq = 5126;
	CmdPhoneType_SelectPhoneThemeCsReq = 5133;
	CmdPhoneType_SelectChatBubbleScRsp = 5142;
	CmdPhoneType_GetPhoneDataScRsp = 5154;
	CmdPhoneType_UnlockChatBubbleScNotify = 5173;
	CmdPhoneType_SelectPhoneCaseScRsp = 5178;
	CmdPhoneType_GetPhoneDataCsReq = 5183;
	CmdPhoneType_UnlockPhoneThemeScNotify = 5191;
	CmdPhoneType_SelectChatBubbleCsReq = 5196;
}

message GetPhoneDataCsReq {
}

message GetPhoneDataScRsp {
	uint32 retcode = 1;
	uint32 cur_chat_bubble = 2;
	uint32 cur_phone_theme = 5;
	repeated uint32 owned_phone_cases = 6;
	repeated uint32 owned_phone_themes = 7;
	uint32 cur_phone_case = 9;
	repeated uint32 owned_chat_bubbles = 15;
}

message SelectChatBubbleCsReq {
	uint32 bubble_id = 2;
}

message SelectChatBubbleScRsp {
	uint32 NGJMMMBJFHD = 8;
	uint32 cur_chat_bubble = 9;
	uint32 retcode = 10;
}

message SelectPhoneCaseCsReq {
	uint32 phone_case_id = 6;
}

message SelectPhoneCaseScRsp {
	uint32 cur_phone_case = 2;
	uint32 NAMPHKPIOBA = 7;
	uint32 retcode = 14;
}

message SelectPhoneThemeCsReq {
	uint32 theme_id = 11;
}

message SelectPhoneThemeScRsp {
	uint32 retcode = 5;
	uint32 NNOHELHPJOM = 7;
	uint32 cur_phone_theme = 12;
}

message UnlockChatBubbleScNotify {
	uint32 bubble_id = 1;
}

message UnlockPhoneCaseScNotify {
	uint32 phone_case_id = 10;
}

message UnlockPhoneThemeScNotify {
	uint32 theme_id = 8;
}
