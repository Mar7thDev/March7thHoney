syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message ArchiveData {
	repeated uint32 archive_avatar_id_list = 1;
	repeated MonsterList kill_monster_list = 2;
	repeated uint32 archive_equipment_id_list = 4;
	repeated RelicList relic_list = 7;
	repeated uint32 archive_missing_equipment_id_list = 10;
}

enum CmdArchiveType {
	CmdArchiveType_NLCDGIPGFDJ = 0;
	CmdArchiveType_GetUpdatedArchiveDataScRsp = 2342;
	CmdArchiveType_GetArchiveDataScRsp = 2354;
	CmdArchiveType_GetArchiveDataCsReq = 2383;
	CmdArchiveType_GetUpdatedArchiveDataCsReq = 2396;
}

message GetArchiveDataCsReq {
}

message GetArchiveDataScRsp {
	uint32 retcode = 4;
	ArchiveData archive_data = 10;
}

message GetUpdatedArchiveDataCsReq {
}

message GetUpdatedArchiveDataScRsp {
	uint32 retcode = 4;
	ArchiveData archive_data = 11;
}

message MonsterList {
	uint32 monster_id = 1;
	uint32 num = 9;
}

message RelicList {
	uint32 set_id = 3;
	uint32 type = 4;
}
