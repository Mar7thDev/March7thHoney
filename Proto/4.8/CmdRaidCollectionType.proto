syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message BOPOBHGDIKN {
	uint32 OBLCIENDLED = 11;
}

enum CmdRaidCollectionType {
	CmdRaidCollectionType_NLCDGIPGFDJ = 0;
	CmdRaidCollectionType_RaidCollectionDataCsReq = 6946;
	CmdRaidCollectionType_RaidCollectionEnterNextRaidCsReq = 6952;
	CmdRaidCollectionType_RaidCollectionEnterNextRaidScRsp = 6954;
	CmdRaidCollectionType_RaidCollectionDataScRsp = 6959;
}

message RaidCollectionDataCsReq {
}

message RaidCollectionDataScRsp {
	uint32 retcode = 4;
	repeated BOPOBHGDIKN challenge_list = 5;
}

message RaidCollectionEnterNextRaidCsReq {
	repeated uint32 avatar_list = 2;
	uint32 is_save = 6;
	uint32 raid_id = 10;
	uint32 world_level = 11;
}

message RaidCollectionEnterNextRaidScRsp {
	uint32 retcode = 2;
	RaidSceneData scene = 4;
}
