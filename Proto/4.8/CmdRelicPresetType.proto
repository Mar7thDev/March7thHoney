syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

enum CmdRelicPresetType {
	CmdRelicPresetType_NLCDGIPGFDJ = 0;
	CmdRelicPresetType_PKLFCJBCOLE = 9845;
	CmdRelicPresetType_RelicPresetGetPlanCsReq = 9846;
	CmdRelicPresetType_BJGKLFMLMAF = 9851;
	CmdRelicPresetType_RelicPresetAddPlanScRsp = 9852;
	CmdRelicPresetType_RelicPresetDeletePlanCsReq = 9854;
	CmdRelicPresetType_RelicPresetDeletePlanScRsp = 9855;
	CmdRelicPresetType_RelicPresetUpdatePlanScRsp = 9856;
	CmdRelicPresetType_RelicPresetUpdatePlanCsReq = 9857;
	CmdRelicPresetType_RelicPresetAddPlanCsReq = 9858;
	CmdRelicPresetType_RelicPresetGetPlanScRsp = 9859;
}

message EGGOCLKIAME {
	uint32 unique_id = 11;
}

message EJILGJGLKIO {
	PFCKBFLDHNI relic_plan = 10;
}

enum FDJKLJGDCID {
	FDJKLJGDCID_NLCDGIPGFDJ = 0;
	FDJKLJGDCID_DCGAPNGCCEH = 1;
	FDJKLJGDCID_BMHMMIMOAIJ = 2;
	FDJKLJGDCID_JPDBDLEEHGK = 3;
	FDJKLJGDCID_OGPNODHENKN = 4;
	FDJKLJGDCID_PICLIGEAJFN = 5;
	FDJKLJGDCID_FHCEFAOHJJJ = 6;
}

message HPPOINFLEPJ {
	repeated uint32 relic_ids = 4;
	RelicPresetPlanSourceType source_type = 8;
	FDJKLJGDCID LLJJCOOKANH = 11;
}

message PFCKBFLDHNI {
	string name = 1;
	RelicPresetPlanSourceType source_type = 3;
	uint32 avatar_id = 9;
	uint32 unique_id = 14;
	repeated uint32 relic_ids = 15;
}

message RelicPresetAddPlanCsReq {
	uint32 avatar_id = 3;
	string name = 5;
	FDJKLJGDCID LLJJCOOKANH = 7;
	RelicPresetPlanSourceType source_type = 12;
	repeated uint32 relic_ids = 15;
}

message RelicPresetAddPlanScRsp {
	PFCKBFLDHNI relic_plan = 11;
	uint32 retcode = 12;
}

message RelicPresetDeletePlanCsReq {
	uint32 ONIAFLNBNPN = 2;
}

message RelicPresetDeletePlanScRsp {
	uint32 retcode = 9;
	uint32 unique_id = 10;
}

message RelicPresetGetPlanCsReq {
	uint32 avatar_id = 7;
}

message RelicPresetGetPlanScRsp {
	uint32 avatar_id = 3;
	repeated PFCKBFLDHNI relic_plan_list = 5;
	uint32 retcode = 9;
}

enum RelicPresetPlanSourceType {
	RelicPresetPlanSourceType_None = 0;
	RelicPresetPlanSourceType_Mine = 1;
	RelicPresetPlanSourceType_SmartCustom = 2;
	RelicPresetPlanSourceType_SmartBigData = 3;
	RelicPresetPlanSourceType_SmartSystem = 4;
	RelicPresetPlanSourceType_FromScratch = 5;
	RelicPresetPlanSourceType_Platform = 6;
}

message RelicPresetUpdatePlanCsReq {
	oneof KKNBOACNCON {
		HPPOINFLEPJ relic_list = 1;
		string name = 2;
	}
	uint32 unique_id = 11;
}

message RelicPresetUpdatePlanScRsp {
	uint32 unique_id = 11;
	oneof KKNBOACNCON {
		string name = 12;
		HPPOINFLEPJ relic_list = 15;
	}
	uint32 retcode = 14;
}
