syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message BOMPFHOMMBH {
	uint32 num = 6;
	uint32 target = 10;
	uint32 item_id = 12;
}

enum CmdActivityRewardStatType {
	CmdActivityRewardStatType_HBPEDDCOJDB = 0;
	CmdActivityRewardStatType_GetActivityRewardCountDataCsReq = 9111;
	CmdActivityRewardStatType_GetActivityHotDataScRsp = 9114;
	CmdActivityRewardStatType_GetAllActivityRewardCountDataScRsp = 9115;
	CmdActivityRewardStatType_GetActivityHotDataCsReq = 9116;
	CmdActivityRewardStatType_GetAllActivityRewardCountDataCsReq = 9118;
	CmdActivityRewardStatType_GetActivityRewardCountDataScRsp = 9119;
}

message EFGIHHJGCFA {
	repeated BOMPFHOMMBH PGMDGPEKDGB = 8;
	uint32 panel_id = 15;
}

message GetActivityHotDataCsReq {
}

message GetActivityHotDataScRsp {
	repeated NEGCAHDLGMI LMGCFHBPAGO = 1;
	repeated EFGIHHJGCFA content_package_list = 12;
	uint32 retcode = 15;
}

message GetActivityRewardCountDataCsReq {
	repeated uint32 DDMEHPDHPLM = 10;
}

message GetActivityRewardCountDataScRsp {
	repeated EFGIHHJGCFA content_package_list = 6;
	uint32 retcode = 11;
}

message GetAllActivityRewardCountDataCsReq {
}

message GetAllActivityRewardCountDataScRsp {
	repeated EFGIHHJGCFA content_package_list = 2;
	uint32 retcode = 8;
}

message NEGCAHDLGMI {
	repeated BOMPFHOMMBH PGMDGPEKDGB = 11;
	uint32 id = 14;
}
