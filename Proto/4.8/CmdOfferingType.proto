syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdOfferingType {
	CmdOfferingType_NLCDGIPGFDJ = 0;
	CmdOfferingType_GetOfferingInfoCsReq = 6926;
	CmdOfferingType_SubmitOfferingItemScRsp = 6932;
	CmdOfferingType_TakeOfferingRewardCsReq = 6934;
	CmdOfferingType_TakeOfferingRewardScRsp = 6935;
	CmdOfferingType_OfferingInfoScNotify = 6937;
	CmdOfferingType_SubmitOfferingItemCsReq = 6938;
	CmdOfferingType_GetOfferingInfoScRsp = 6939;
}

message GetOfferingInfoCsReq {
	repeated uint32 offering_id_list = 1;
}

message GetOfferingInfoScRsp {
	uint32 retcode = 8;
	repeated OfferingInfo offering_info_list = 14;
}

message OfferingInfo {
	uint32 level_exp = 3;
	uint32 offering_id = 5;
	uint32 offering_level = 6;
	OfferingState offering_state = 13;
	repeated uint32 has_taken_reward_id_list = 14;
	uint32 total_exp = 15;
}

message OfferingInfoScNotify {
	OfferingInfo offering_info = 4;
}

enum OfferingState {
	OFFERING_STATE_NONE = 0;
	OFFERING_STATE_LOCK = 1;
	OFFERING_STATE_OPEN = 2;
}

message SubmitOfferingItemCsReq {
	uint32 offering_id = 9;
	uint32 interacted_prop_entity_id = 10;
}

message SubmitOfferingItemScRsp {
	uint32 retcode = 3;
	OfferingInfo offering_info = 9;
}

message TakeOfferingRewardCsReq {
	uint32 interacted_prop_entity_id = 6;
	uint32 offering_id = 14;
	repeated uint32 take_reward_level_list = 15;
}

message TakeOfferingRewardScRsp {
	uint32 retcode = 6;
	OfferingInfo offering_info = 12;
	ItemList reward = 15;
}
