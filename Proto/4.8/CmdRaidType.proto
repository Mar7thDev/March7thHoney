	CmdRaidType_GDJCOFKGJCG = 2215;
	CmdRaidType_StartRaidCsReq = 2216;
	CmdRaidType_TakeChallengeRaidRewardScRsp = 2222;
	CmdRaidType_GetSaveRaidCsReq = 2223;
	CmdRaidType_TakeChallengeRaidRewardCsReq = 2227;
	CmdRaidType_GetAllSaveRaidScRsp = 2228;
