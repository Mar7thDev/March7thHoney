	uint32 raid_id = 6;
}

message FinishedRaidInfo {
	uint32 world_level = 3;
	uint32 raid_id = 10;
	repeated uint32 NGKBFPFOOPK = 15;
}

enum GMFMPPKAEHE {
	GMFMPPKAEHE_NLCDGIPGFDJ = 0;
	GMFMPPKAEHE_HNADCAHHKIJ = 1;
}

message GetAllSaveRaidCsReq {
}

message GetAllSaveRaidScRsp {
	repeated RaidData raid_data_list = 7;
	uint32 retcode = 9;
}

message GetChallengeRaidInfoScRsp {
	uint32 retcode = 9;
	repeated uint32 ICCCHCCDKND = 13;
	repeated KBONOPFLPDJ DBOADIFANMH = 15;
}

message GetRaidInfoCsReq {
}

message GetRaidInfoScRsp {
	repeated uint32 challenge_taken_reward_id_list = 5;
	repeated FinishedRaidInfo finished_raid_info_list = 6;
	uint32 retcode = 13;
	repeated KBONOPFLPDJ challenge_raid_list = 14;
}

message GetSaveRaidCsReq {
	uint32 raid_id = 1;
	uint32 world_level = 7;
}

message GetSaveRaidScRsp {
	bool is_save = 2;
	uint32 raid_id = 6;
	uint32 retcode = 8;
	uint32 world_level = 11;
	repeated RaidTargetInfo raid_target_info = 12;
}

message KBONOPFLPDJ {
	uint32 max_score = 12;
	uint32 raid_id = 15;
}

message LeaveRaidCsReq {
	bool is_save = 3;
	uint32 raid_id = 10;
}

message LeaveRaidScRsp {
	uint32 raid_id = 10;
	uint32 retcode = 11;
	uint32 world_level = 15;
}

enum MJPGDJIGLKO {
	MJPGDJIGLKO_NLCDGIPGFDJ = 0;
	MJPGDJIGLKO_BMOOGBNPEAA = 1;
	MJPGDJIGLKO_CIHFGJDCHIA = 2;
}

message OICLHALJIEH {
}

message RaidData {
	repeated RaidTargetInfo raid_target_info = 6;
	uint32 raid_id = 7;
	uint32 world_level = 10;
}

message RaidInfoNotify {
	RaidStatus status = 1;
	repeated RaidTargetInfo raid_target_info = 2;
	uint32 raid_id = 3;
	ItemList item_list = 5;
	uint32 world_level = 9;
	uint64 raid_finish_time = 13;
}

message RaidKickByServer {
	SceneInfo scene = 1;
	uint32 raid_id = 5;
	LineupInfo lineup = 11;
	uint32 world_level = 13;
	GMFMPPKAEHE reason = 15;
}

enum RaidStatus {
	RAID_STATUS_NONE = 0;
	RAID_STATUS_DOING = 1;
	RAID_STATUS_FINISH = 2;
	RAID_STATUS_FAILED = 3;
}

message RaidTargetInfo {
	MJPGDJIGLKO KCEEHIOCBPC = 1;
	uint32 LCILPGIDEAC = 5;
	uint32 KKCKMCDGCGK = 12;
}

message SetClientRaidTargetCountCsReq {
	uint32 progress = 4;
	uint32 KJKGHIEKNID = 13;
}

message SetClientRaidTargetCountScRsp {
	uint32 KJKGHIEKNID = 5;
	uint32 retcode = 6;
	uint32 progress = 7;
}

message StartRaidCsReq {
	repeated uint32 avatar_list = 1;
	uint32 raid_id = 2;
	uint32 is_save = 6;
	uint32 world_level = 9;
	repeated AvatarIdentifier avatar_identifier_list = 12;
	uint32 prop_entity_id = 14;
}

message StartRaidScRsp {
	uint32 retcode = 1;
	RaidSceneData scene = 15;
}

message TakeChallengeRaidRewardCsReq {
	uint32 HEJANCCDGAP = 9;
}

message TakeChallengeRaidRewardScRsp {
