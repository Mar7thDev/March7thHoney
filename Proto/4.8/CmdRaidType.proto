	CmdRaidType_StartRaidScRsp = 2201;
	CmdRaidType_ChallengeRaidNotify = 2204;
	CmdRaidType_RaidInfoNotify = 2207;
	CmdRaidType_SetClientRaidTargetCountCsReq = 2209;
	CmdRaidType_LeaveRaidCsReq = 2211;
