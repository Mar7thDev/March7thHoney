syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message BCAJNMLLIED {
	uint32 id = 5;
	uint32 progress = 6;
	repeated DOLMCHMNEIL EIKKALADEHM = 9;
	repeated uint32 OLHODIFNABL = 10;
	uint32 panel_id = 12;
}

enum CmdRechargeGiftType {
	CmdRechargeGiftType_NLCDGIPGFDJ = 0;
	CmdRechargeGiftType_TakeRechargeBenefitRewardScRsp = 8365;
	CmdRechargeGiftType_GetRechargeGiftInfoCsReq = 8366;
	CmdRechargeGiftType_TakeRechargeGiftRewardScRsp = 8372;
	CmdRechargeGiftType_GetRechargeBenefitInfoCsReq = 8374;
	CmdRechargeGiftType_GetRechargeBenefitInfoScRsp = 8375;
	CmdRechargeGiftType_TakeRechargeBenefitRewardCsReq = 8376;
	CmdRechargeGiftType_SyncRechargeBenefitInfoScNotify = 8377;
	CmdRechargeGiftType_TakeRechargeGiftRewardCsReq = 8378;
	CmdRechargeGiftType_GetRechargeGiftInfoScRsp = 8379;
}

message DOLMCHMNEIL {
	uint32 GMDBHJKEAEI = 14;
	uint32 EEPDDGPEPKO = 15;
}

message GetRechargeBenefitInfoCsReq {
}

message GetRechargeBenefitInfoScRsp {
	uint32 retcode = 1;
	repeated BCAJNMLLIED OABBABNPPOO = 7;
}

message GetRechargeGiftInfoCsReq {
}

message GetRechargeGiftInfoScRsp {
	repeated JBNGCJJDLHL OFIHOCCHNCN = 5;
	uint32 retcode = 15;
}

message IJHPILBBHDI {
	uint32 index = 11;
	JLAKKHPOLAM status = 14;
}

message JBNGCJJDLHL {
	uint32 gift_type = 2;
	int64 end_time = 3;
	int64 start_time = 11;
	repeated IJHPILBBHDI status_list = 14;
}

enum JLAKKHPOLAM {
	JLAKKHPOLAM_EDHBOMMOKGM = 0;
	JLAKKHPOLAM_ACBHGLIBJBG = 1;
	JLAKKHPOLAM_LJLKNDIACEO = 2;
}

message SyncRechargeBenefitInfoScNotify {
	BCAJNMLLIED KLCGBJIEMPO = 4;
}

message TakeRechargeBenefitRewardCsReq {
	uint32 id = 10;
	repeated DOLMCHMNEIL EIKKALADEHM = 14;
}

message TakeRechargeBenefitRewardScRsp {
	ItemList reward = 2;
	BCAJNMLLIED KLCGBJIEMPO = 10;
	uint32 retcode = 15;
}

message TakeRechargeGiftRewardCsReq {
	uint32 gift_type = 9;
}

message TakeRechargeGiftRewardScRsp {
	JBNGCJJDLHL KJBDNIIBGNE = 1;
	ItemList reward = 11;
	uint32 retcode = 12;
}
