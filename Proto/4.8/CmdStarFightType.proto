syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdStarFightType {
	CmdStarFightType_NLCDGIPGFDJ = 0;
	CmdStarFightType_StarFightDataChangeNotify = 7161;
	CmdStarFightType_GetStarFightDataScRsp = 7164;
	CmdStarFightType_StartStarFightLevelScRsp = 7165;
	CmdStarFightType_GetStarFightDataCsReq = 7166;
	CmdStarFightType_StartStarFightLevelCsReq = 7168;
}

message EBGJAKBKPAN {
	uint32 avatar_id = 2;
	AvatarType avatar_type = 8;
}

message GetStarFightDataCsReq {
}

message GetStarFightDataScRsp {
	uint32 retcode = 5;
	repeated JFGCABMMKAB JJIDNKDKMLE = 12;
}

message JFGCABMMKAB {
	uint32 KDNBADEGDNK = 4;
	bool NDBGPGODBPH = 5;
	uint32 EBDDDCBKPAC = 13;
	uint32 group_id = 14;
	uint32 CEOEOEBOLNN = 15;
}

message StarFightDataChangeNotify {
	uint32 group_id = 7;
	JFGCABMMKAB KDKKNFGPNAB = 15;
}

message StartStarFightLevelCsReq {
	uint32 DBKHHCGGKNN = 3;
	repeated EBGJAKBKPAN avatar_list = 7;
	uint32 group_id = 8;
}

message StartStarFightLevelScRsp {
	uint32 retcode = 4;
	uint32 group_id = 6;
	SceneBattleInfo battle_info = 14;
	uint32 DBKHHCGGKNN = 15;
}
