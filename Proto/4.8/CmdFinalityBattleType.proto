syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdFinalityBattleType {
	CmdFinalityBattleType_NLCDGIPGFDJ = 0;
	CmdFinalityBattleType_FinalityBattleSettleScNotify = 10021;
	CmdFinalityBattleType_FinalityBattleGetDataScRsp = 10024;
	CmdFinalityBattleType_StartFinalityBattleLevelScRsp = 10025;
	CmdFinalityBattleType_FinalityBattleGetDataCsReq = 10026;
	CmdFinalityBattleType_StartFinalityBattleLevelCsReq = 10028;
}

message FinalityBattleGetDataCsReq {
}

message FinalityBattleGetDataScRsp {
	repeated FinalityBattleLevelRecord level_record_list = 2;
	uint32 retcode = 3;
}

message FinalityBattleLevelRecord {
	uint32 level_id = 1;
	repeated uint32 finished_battle_target_id_list = 2;
	uint32 remaining_round = 4;
	uint32 finished_wave = 7;
}

message FinalityBattleSettleScNotify {
	bool is_new_record = 2;
	BattleEndStatus end_status = 8;
	FinalityBattleLevelRecord level_record = 10;
}

message StartFinalityBattleLevelCsReq {
	uint32 leading_role_id = 9;
	repeated KPNHGDGLICN avatar_list = 10;
	uint32 level_id = 11;
}

message StartFinalityBattleLevelScRsp {
	uint32 level_id = 1;
	SceneBattleInfo battle_info = 3;
	uint32 retcode = 10;
}
