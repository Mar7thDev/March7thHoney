syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdFeverTimeActivityType {
	CmdFeverTimeActivityType_NLCDGIPGFDJ = 0;
	CmdFeverTimeActivityType_GetFeverTimeActivityDataScRsp = 7151;
	CmdFeverTimeActivityType_EnterFeverTimeActivityStageScRsp = 7154;
	CmdFeverTimeActivityType_GetFeverTimeActivityDataCsReq = 7155;
	CmdFeverTimeActivityType_EnterFeverTimeActivityStageCsReq = 7156;
	CmdFeverTimeActivityType_FeverTimeActivityBattleEndScNotify = 7158;
}

message EnterFeverTimeActivityStageCsReq {
	uint32 CJHDABDKGHP = 3;
	uint32 MFLAIMHFABP = 4;
	repeated KPNHGDGLICN avatar_list = 6;
	uint32 id = 11;
}

message EnterFeverTimeActivityStageScRsp {
	uint32 id = 3;
	SceneBattleInfo battle_info = 4;
	uint32 retcode = 8;
}

message FeverTimeActivityBattleEndScNotify {
	uint32 id = 5;
	uint32 FAJDFFHODIP = 8;
	uint32 turn_left = 9;
	FeverTimeBattleRank LDDHCPLNKKA = 13;
}

enum FeverTimeBattleRank {
	FeverTimeBattleRank_C = 0;
	FeverTimeBattleRank_B = 1;
	FeverTimeBattleRank_A = 2;
	FeverTimeBattleRank_S = 3;
	FeverTimeBattleRank_Ss = 4;
}

message GetFeverTimeActivityDataCsReq {
}

message GetFeverTimeActivityDataScRsp {
	uint32 retcode = 1;
	repeated JBMJOIPJPLH GNDEFEAEDNJ = 6;
}

message JBMJOIPJPLH {
	FeverTimeBattleRank OINGNAJMFNL = 2;
	uint32 OFBEDJIAEOA = 3;
	uint32 DJFGDMIDEHJ = 8;
}
