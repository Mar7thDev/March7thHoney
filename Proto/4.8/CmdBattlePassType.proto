	uint64 CBLNJDCICBC = 2;
	uint32 level = 3;
	uint64 OKPOHIHPOKI = 4;
	uint64 ICPCCGPEJMP = 5;
	uint32 POJDILFNJAH = 7;
	BpTierType DELEGHOCLMO = 9;
	uint64 PDODOAOHMAC = 10;
	uint64 NJDCMGOJOLE = 11;
	uint64 DAFMMPKFOEA = 12;
	uint64 AIMGGFNLIEK = 13;
