syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message B51RacingChallengeEndMatchCsReq {
	uint32 finish_time_ms = 1;
	uint32 track_id = 2;
	uint32 rank = 4;
	B51RacingMatchResultType result_type = 5;
	uint32 match_id = 8;
	uint32 session_id = 9;
	B51RacingMatchStats stats = 12;
}

message B51RacingChallengeEndMatchScRsp {
	uint32 retcode = 1;
	uint32 match_id = 6;
	uint32 best_time_ms = 14;
	uint32 track_id = 15;
}

message B51RacingChallengeStartMatchCsReq {
	uint32 driver_id = 5;
	uint32 match_id = 6;
	uint32 track_id = 8;
}

message B51RacingChallengeStartMatchScRsp {
	uint32 session_id = 5;
	uint32 retcode = 11;
	uint32 driver_id = 14;
}

message B51RacingChallengeUpdateCarCsReq {
	uint32 car_id = 2;
	repeated uint32 equipped_part_id_list = 7;
	B51RacingCarLivery livery = 9;
}

message B51RacingChallengeUpdateCarScRsp {
	B51RacingChallengeCarData car = 9;
	uint32 retcode = 10;
}

enum CmdB51RacingChallengeType {
	CmdB51RacingChallengeType_NLCDGIPGFDJ = 0;
	CmdB51RacingChallengeType_B51RacingChallengeUpdateCarCsReq = 10106;
	CmdB51RacingChallengeType_B51RacingChallengeStartMatchScRsp = 10112;
	CmdB51RacingChallengeType_B51RacingChallengeEndMatchCsReq = 10114;
	CmdB51RacingChallengeType_B51RacingChallengeEndMatchScRsp = 10115;
	CmdB51RacingChallengeType_B51RacingChallengeStartMatchCsReq = 10118;
	CmdB51RacingChallengeType_B51RacingChallengeUpdateCarScRsp = 10119;
}
