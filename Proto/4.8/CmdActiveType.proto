syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message ActiveActivityData {
	uint32 panel_id = 1;
	uint32 id = 4;
	uint32 FODLNKPNION = 5;
	repeated uint32 taken_star_rewards = 6;
	uint32 CDMIKICANEP = 12;
	uint32 DBIFEEDMAOF = 15;
}

message ActiveActivityDataChangeScNotify {
	ActiveActivityData ANFFLNDCGLG = 12;
}

enum CmdActiveType {
	CmdActiveType_NLCDGIPGFDJ = 0;
	CmdActiveType_GetActiveActivityDataCsReq = 9556;
	CmdActiveType_TakeActiveActivityRewardScRsp = 9562;
	CmdActiveType_ActiveActivityDataChangeScNotify = 9564;
	CmdActiveType_TakeActiveActivityRewardCsReq = 9568;
	CmdActiveType_GetActiveActivityDataScRsp = 9569;
}

message GetActiveActivityDataCsReq {
}

message GetActiveActivityDataScRsp {
	uint32 retcode = 10;
	repeated ActiveActivityData HCLGPDFBDNP = 15;
}

message TakeActiveActivityRewardCsReq {
	uint32 id = 2;
}

message TakeActiveActivityRewardScRsp {
	ActiveActivityData ANFFLNDCGLG = 8;
	ItemList reward = 10;
	uint32 retcode = 13;
}
