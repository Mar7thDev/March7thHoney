syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdAdventureType {
	CmdAdventureType_NLCDGIPGFDJ = 0;
	CmdAdventureType_QuickStartFarmElementCsReq = 1307;
	CmdAdventureType_FarmElementSweepCsReq = 1308;
	CmdAdventureType_CocoonSweepCsReq = 1326;
	CmdAdventureType_QuickStartCocoonStageScRsp = 1333;
	CmdAdventureType_GetFarmStageGachaInfoScRsp = 1342;
	CmdAdventureType_QuickStartCocoonStageCsReq = 1373;
	CmdAdventureType_CocoonSweepScRsp = 1378;
	CmdAdventureType_FarmElementSweepScRsp = 1381;
	CmdAdventureType_QuickStartFarmElementScRsp = 1391;
	CmdAdventureType_GetFarmStageGachaInfoCsReq = 1396;
}

message CocoonSweepCsReq {
	uint32 world_level = 7;
	uint32 cocoon_id = 12;
}

message CocoonSweepScRsp {
	uint32 retcode = 1;
	uint32 cocoon_id = 5;
	uint32 NCEFJFOHGBI = 6;
	ItemList drop_data = 7;
	ItemList multiple_drop_data = 15;
}

message FarmElementSweepCsReq {
	uint32 PAOFHFLFFHD = 1;
	uint32 world_level = 3;
}

message FarmElementSweepScRsp {
	ItemList multiple_drop_data = 1;
	uint32 PAOFHFLFFHD = 6;
	uint32 retcode = 13;
}

message FarmStageGachaInfo {
	uint32 gacha_id = 2;
	int64 end_time = 6;
	int64 begin_time = 13;
}

message GetFarmStageGachaInfoCsReq {
	repeated uint32 farm_stage_gacha_id_list = 10;
}

message GetFarmStageGachaInfoScRsp {
	repeated FarmStageGachaInfo farm_stage_gacha_info_list = 5;
	uint32 retcode = 10;
}

message QuickStartCocoonStageCsReq {
	NAJKNJLJPEP CBJCKEIGGNL = 1;
	uint32 HECCOBFBJFI = 2;
	uint32 world_level = 8;
	uint32 wave = 11;
	uint32 cocoon_id = 13;
}

message QuickStartCocoonStageScRsp {
	uint32 cocoon_id = 1;
	SceneBattleInfo battle_info = 2;
	uint32 retcode = 3;
	uint32 wave = 10;
}

message QuickStartFarmElementCsReq {
	uint32 PAOFHFLFFHD = 5;
	uint32 world_level = 12;
	uint32 HECCOBFBJFI = 14;
}

message QuickStartFarmElementScRsp {
	uint32 world_level = 7;
	uint32 PAOFHFLFFHD = 10;
	uint32 retcode = 13;
	SceneBattleInfo battle_info = 15;
}
