syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum BGLIMCBGLAJ {
	BGLIMCBGLAJ_PICLIGEAJFN = 0;
	BGLIMCBGLAJ_OGPNODHENKN = 1;
	BGLIMCBGLAJ_JPDBDLEEHGK = 2;
	BGLIMCBGLAJ_BMHMMIMOAIJ = 3;
	BGLIMCBGLAJ_DCGAPNGCCEH = 4;
}

enum CmdFightFestType {
	CmdFightFestType_NLCDGIPGFDJ = 0;
	CmdFightFestType_GetFightFestDataScRsp = 7251;
	CmdFightFestType_FightFestScoreUpdateNotify = 7257;
	CmdFightFestType_StartFightFestCsReq = 7261;
	CmdFightFestType_FightFestUpdateChallengeRecordNotify = 7263;
	CmdFightFestType_FightFestUnlockSkillNotify = 7265;
	CmdFightFestType_GetFightFestDataCsReq = 7266;
	CmdFightFestType_FightFestUpdateCoinNotify = 7277;
	CmdFightFestType_StartFightFestScRsp = 7294;
}

message EPCNGNEEMBI {
	uint32 id = 2;
	AvatarType avatar_type = 7;
}

message FightFestScoreUpdateNotify {
	uint32 score_id = 3;
	uint32 JODNMFEFPFD = 13;
}

enum FightFestType {
	FightFestType_None = 0;
	FightFestType_Main = 1;
	FightFestType_Score = 2;
	FightFestType_Challenge = 3;
	FightFestType_Teach = 4;
}

message FightFestUnlockSkillNotify {
	uint32 AMAGKDCBFGL = 3;
}

message FightFestUpdateChallengeRecordNotify {
	uint32 challenge_id = 2;
	BGLIMCBGLAJ HMBBBNKAILD = 5;
	BGLIMCBGLAJ rank = 6;
	uint32 DJFGDMIDEHJ = 10;
	uint32 turn_left = 14;
}

message FightFestUpdateCoinNotify {
	uint32 coin = 9;
}

message GetFightFestDataCsReq {
}

message GetFightFestDataScRsp {
	uint32 item_value = 2;
	repeated LPJOINCGBBP challenge_list = 3;
	uint32 retcode = 5;
	uint32 score_id = 9;
	repeated uint32 GILJLEOAOMA = 10;
}

message LPJOINCGBBP {
	uint32 DJFGDMIDEHJ = 5;
	uint32 challenge_id = 6;
	BGLIMCBGLAJ OINGNAJMFNL = 7;
}

message StartFightFestCsReq {
	repeated uint32 GILJLEOAOMA = 4;
	uint32 id = 5;
	FightFestType type = 7;
	uint32 event_id = 11;
	repeated EPCNGNEEMBI avatar_list = 15;
}

message StartFightFestScRsp {
	FightFestType type = 4;
	SceneBattleInfo battle_info = 8;
	uint32 event_id = 10;
	uint32 retcode = 12;
	uint32 id = 15;
}
