syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdRollShopType {
	CmdRollShopType_NLCDGIPGFDJ = 0;
	CmdRollShopType_GetRollShopInfoCsReq = 6906;
	CmdRollShopType_DoGachaInRollShopScRsp = 6912;
	CmdRollShopType_TakeRollShopRewardCsReq = 6914;
	CmdRollShopType_TakeRollShopRewardScRsp = 6915;
	CmdRollShopType_DoGachaInRollShopCsReq = 6918;
	CmdRollShopType_GetRollShopInfoScRsp = 6919;
}

message DoGachaInRollShopCsReq {
	uint32 gacha_count = 10;
	uint32 gacha_random = 11;
	uint32 roll_shop_id = 14;
}

message DoGachaInRollShopScRsp {
	ItemList reward = 1;
	uint32 LDBCKJIPDHF = 6;
	uint32 retcode = 10;
	uint32 roll_shop_id = 11;
	uint32 reward_display_type = 13;
}

message GetRollShopInfoCsReq {
	uint32 roll_shop_id = 9;
}

message GetRollShopInfoScRsp {
	repeated uint32 shop_group_id_list = 1;
	uint32 gacha_random = 3;
	uint32 retcode = 8;
	uint32 roll_shop_id = 13;
}

message TakeRollShopRewardCsReq {
	uint32 FGFLIEADBLH = 10;
}

message TakeRollShopRewardScRsp {
	uint32 group_type = 2;
	uint32 roll_shop_id = 5;
	ItemList reward = 9;
	uint32 retcode = 10;
}
