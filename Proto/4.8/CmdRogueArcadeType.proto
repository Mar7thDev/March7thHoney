	CmdRogueArcadeType_RogueArcadeLeaveCsReq = 7661;
	CmdRogueArcadeType_RogueArcadeGetInfoCsReq = 7663;
	CmdRogueArcadeType_RogueArcadeRestartScRsp = 7665;
	CmdRogueArcadeType_RogueArcadeStartCsReq = 7666;
	CmdRogueArcadeType_RogueArcadeGetInfoScRsp = 7686;
	CmdRogueArcadeType_RogueArcadeLeaveScRsp = 7692;
