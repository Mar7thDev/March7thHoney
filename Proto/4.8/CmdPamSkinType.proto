syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

enum CmdPamSkinType {
	CmdPamSkinType_NLCDGIPGFDJ = 0;
	CmdPamSkinType_GetPamSkinDataCsReq = 8126;
	CmdPamSkinType_SelectPamSkinScRsp = 8132;
	CmdPamSkinType_UnlockPamSkinScNotify = 8134;
	CmdPamSkinType_SelectPamSkinCsReq = 8138;
	CmdPamSkinType_GetPamSkinDataScRsp = 8139;
}

message GetPamSkinDataCsReq {
}

message GetPamSkinDataScRsp {
	uint32 cur_skin = 5;
	uint32 retcode = 8;
	repeated uint32 unlock_skin_list = 11;
}

message SelectPamSkinCsReq {
	uint32 pam_skin = 5;
}

message SelectPamSkinScRsp {
	uint32 cur_skin = 2;
	uint32 set_skin = 6;
	uint32 retcode = 8;
}

message UnlockPamSkinScNotify {
	uint32 pam_skin = 14;
}
