syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

enum CmdServerPrefsType {
	CmdServerPrefsType_NLCDGIPGFDJ = 0;
	CmdServerPrefsType_UpdateServerPrefsDataScRsp = 6133;
	CmdServerPrefsType_GetServerPrefsDataScRsp = 6142;
	CmdServerPrefsType_GetAllServerPrefsDataScRsp = 6154;
	CmdServerPrefsType_UpdateServerPrefsCsReq = 6173;
	CmdServerPrefsType_GetAllServerPrefsDataCsReq = 6183;
	CmdServerPrefsType_BIOLLCIKFFD = 6196;
}

message GetAllServerPrefsDataCsReq {
}

message GetAllServerPrefsDataScRsp {
	uint32 retcode = 8;
	repeated ServerPrefs server_prefs_list = 11;
}

message GetServerPrefsDataScRsp {
	uint32 retcode = 3;
	ServerPrefs server_prefs = 14;
}

message IANCKAHGKMI {
	uint32 CFBDEAHMPKF = 3;
}

message ServerPrefs {
	bytes data = 7;
	uint32 server_prefs_id = 12;
}

message UpdateServerPrefsCsReq {
	ServerPrefs server_prefs = 11;
}

message UpdateServerPrefsDataScRsp {
	uint32 server_prefs_id = 9;
	uint32 retcode = 15;
}
