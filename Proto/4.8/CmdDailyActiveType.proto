syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdDailyActiveType {
	CmdDailyActiveType_NLCDGIPGFDJ = 0;
	CmdDailyActiveType_TakeAllApRewardScRsp = 3307;
	CmdDailyActiveType_TakeAllApRewardCsReq = 3333;
	CmdDailyActiveType_GetDailyActiveInfoScRsp = 3342;
	CmdDailyActiveType_TakeApRewardScRsp = 3354;
	CmdDailyActiveType_DailyActiveInfoNotify = 3373;
	CmdDailyActiveType_TakeApRewardCsReq = 3383;
	CmdDailyActiveType_GetDailyActiveInfoCsReq = 3396;
}

message DailyActiveInfoNotify {
	repeated uint32 daily_active_quest_id_list = 6;
	repeated DailyActivityInfo daily_active_level_list = 7;
	uint32 daily_active_point = 12;
}

message DailyActivityInfo {
	uint32 daily_active_point = 3;
	uint32 level = 5;
	uint32 world_level = 8;
	bool is_has_taken = 14;
}

message GetDailyActiveInfoCsReq {
}

message GetDailyActiveInfoScRsp {
	uint32 daily_active_point = 3;
	repeated DailyActivityInfo daily_active_level_list = 5;
	repeated uint32 daily_active_quest_id_list = 10;
	uint32 retcode = 12;
}

message TakeAllApRewardCsReq {
}

message TakeAllApRewardScRsp {
	repeated uint32 take_reward_level_list = 4;
	ItemList reward = 7;
	uint32 retcode = 15;
}

message TakeApRewardCsReq {
	uint32 level = 7;
}

message TakeApRewardScRsp {
	uint32 retcode = 7;
	ItemList reward = 12;
	uint32 level = 15;
}
