syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdFantasticStoryActivityType {
	CmdFantasticStoryActivityType_NLCDGIPGFDJ = 0;
	CmdFantasticStoryActivityType_FantasticStoryActivityBattleEndScNotify = 4933;
	CmdFantasticStoryActivityType_EnterFantasticStoryActivityStageCsReq = 4942;
	CmdFantasticStoryActivityType_GetFantasticStoryActivityDataScRsp = 4954;
	CmdFantasticStoryActivityType_EnterFantasticStoryActivityStageScRsp = 4973;
	CmdFantasticStoryActivityType_GetFantasticStoryActivityDataCsReq = 4983;
	CmdFantasticStoryActivityType_FinishChapterScNotify = 4996;
}

message EnterFantasticStoryActivityStageCsReq {
	repeated PKCIPJBKAFO avatar_list = 6;
	repeated uint32 buff_list = 7;
	uint32 OFHBPNGDEGO = 11;
	uint32 battle_id = 15;
}

message EnterFantasticStoryActivityStageScRsp {
	uint32 OFHBPNGDEGO = 4;
	SceneBattleInfo battle_info = 6;
	uint32 retcode = 8;
	uint32 battle_id = 13;
}

message FGGCEKHFPLH {
	repeated uint32 buff_list = 7;
	repeated PKCIPJBKAFO avatar_list = 10;
}

message FantasticStoryActivityBattleEndScNotify {
	uint32 battle_id = 4;
	uint32 FHBNGHINHOG = 9;
	uint32 OFHBPNGDEGO = 15;
}

message FinishChapterScNotify {
	GCFDJCPFOGG ONIEMLICONB = 11;
}

message GCFDJCPFOGG {
	repeated uint32 DJJKDGEFOIP = 1;
	map<uint32, FGGCEKHFPLH> DALPAKHCKLI = 2;
	repeated uint32 HPLNHIFHBMA = 4;
	repeated uint32 JJOBBOHHOMG = 5;
	repeated uint32 FIBFIKOBDPG = 6;
	uint32 OFHBPNGDEGO = 10;
	map<uint32, uint32> DLBOJCCDCFI = 13;
}

message GetFantasticStoryActivityDataCsReq {
	uint32 OFHBPNGDEGO = 11;
}

message GetFantasticStoryActivityDataScRsp {
	GCFDJCPFOGG ONIEMLICONB = 6;
	uint32 retcode = 11;
}

message PKCIPJBKAFO {
	AvatarType avatar_type = 8;
	uint32 avatar_id = 9;
}
