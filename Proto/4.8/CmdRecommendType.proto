syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message BMMHJIFCGNO {
	uint32 KAJCFPKEGBP = 3;
	uint32 MIPKOFFGPFA = 14;
}

message BPFDFOJOEMI {
	uint32 LBDLAACOCCN = 6;
	uint32 percent = 11;
}

message BigDataAvatarRelicRecommend {
	repeated BPFDFOJOEMI outer_set_list = 1;
	repeated BPFDFOJOEMI body_main_property_list = 2;
	uint32 avatar_id = 7;
	repeated JBGPLPCCDBJ sphere_main_property_list = 8;
	repeated BPFDFOJOEMI inner_set_list = 10;
	repeated BPFDFOJOEMI foot_main_property_list = 11;
	repeated JBGPLPCCDBJ rope_main_property_list = 12;
}

message BigDataRecommendAvatarRelic {
	repeated BigDataAvatarRelicRecommend recomended_relic_info_list = 12;
}

message BigDataRecommendRelicAvatar {
	repeated RecomendedAvatarInfo recommended_avatar_info_list = 1;
}

enum BigDataRecommendType {
	BIG_DATA_RECOMMEND_TYPE_NONE = 0;
	BIG_DATA_RECOMMEND_TYPE_EQUIPMENT = 1;
	BIG_DATA_RECOMMEND_TYPE_RELIC_SUIT = 2;
	BIG_DATA_RECOMMEND_TYPE_RELIC_AVATAR = 3;
	BIG_DATA_RECOMMEND_TYPE_AVATAR_RELIC = 4;
	BIG_DATA_RECOMMEND_TYPE_LOCAL_LEGEND = 5;
	BIG_DATA_RECOMMEND_TYPE_CHALLENGE_PEAK_MOB = 6;
	BIG_DATA_RECOMMEND_TYPE_CHALLENGE_PEAK_BOSS = 7;
	BIG_DATA_RECOMMEND_TYPE_CHALLENGE = 8;
	BIG_DATA_RECOMMEND_TYPE_HMFFBIANKBF = 9;
	BIG_DATA_RECOMMEND_TYPE_IGDNEOELFKC = 10;
}

enum CmdRecommendType {
	CmdRecommendType_NLCDGIPGFDJ = 0;
	CmdRecommendType_GetBigDataAllRecommendScRsp = 2404;
	CmdRecommendType_GetBigDataRecommendCsReq = 2413;
	CmdRecommendType_GetBigDataAllRecommendCsReq = 2422;
	CmdRecommendType_GetBigDataRecommendScRsp = 2427;
}

message GHAJJBBEHBE {
	uint32 LMHDFOFNFII = 3;
	uint32 BBGHAFGMMNM = 6;
	uint32 OAOPDHLDFIP = 13;
}

message GNBBDMBNNDJ {
	repeated JOLHIMGJGBO lineup_list = 1;
}

message GetBigDataAllRecommendCsReq {
	BigDataRecommendType big_data_recommend_type = 2;
}

message GetBigDataAllRecommendScRsp {
	oneof OODKOEILJCD {
		BigDataRecommendAvatarRelic avatar_relic = 2;
		GNBBDMBNNDJ KHCMLINMGEN = 12;
		BigDataRecommendRelicAvatar relic_avatar = 13;
	}
	BigDataRecommendType big_data_recommend_type = 6;
	uint32 retcode = 15;
}

message GetBigDataRecommendCsReq {
	BigDataRecommendType big_data_recommend_type = 14;
	uint32 equip_avatar = 15;
}

message GetBigDataRecommendScRsp {
	bool has_recommand = 2;
	oneof OODKOEILJCD {
		GNBBDMBNNDJ KHCMLINMGEN = 3;
		HCIIHNAFNAB equipment_recommend = 4;
		RelicRecommend relic_recommend = 12;
	}
	uint32 retcode = 6;
	BigDataRecommendType big_data_recommend_type = 9;
	uint32 equip_avatar = 15;
}

message HCIIHNAFNAB {
	repeated BMMHJIFCGNO update_equipments_list = 14;
}

message JBGPLPCCDBJ {
	uint32 GBJPBAHGBPO = 1;
	uint32 NMFGIBMHNKI = 8;
	uint32 percent = 9;
}

message RecomendedAvatarInfo {
	repeated uint32 avatar_id_list = 1;
	uint32 recommend_avatar_id = 2;
	uint32 relic_set_id = 7;
}

message RelicRecommend {
	repeated GHAJJBBEHBE GMCNPKAJMHC = 11;
}
