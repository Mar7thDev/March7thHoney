syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message B51RacingAgendaInfo {
	uint32 day = 1;
	B51RacingDevelopmentInfo development = 12;
	B51RacingMatchInfo match = 13;
}

message B51RacingCarDisplay {
	uint32 driver_id = 1;
	repeated uint32 equipped_part_id_list = 6;
	uint32 paint_id = 8;
	uint32 car_num = 13;
}

message B51RacingCarLiveryCsReq {
	B51RacingCarLivery livery = 8;
}

message B51RacingCarLiveryScRsp {
	uint32 retcode = 2;
	B51RacingCarLivery livery = 13;
}

message B51RacingChallengeData {
	B51RacingChallengeCarData car = 1;
	repeated KVP track_best_time_list = 10;
	uint32 driver_id = 14;
}

message B51RacingCycleData {
	uint32 finished_match_num = 1;
	B51RacingPartInfo part_info = 2;
	B51RacingAgendaInfo agenda = 4;
	uint32 cycle_id = 6;
	B51RacingCarLivery livery = 7;
	repeated B51RacingPreMatchTrackInfo pre_match_track_info_list = 11;
	B51RacingStatInfo stat_info = 12;
	uint32 car_id = 13;
	uint32 driver_id = 15;
}

message B51RacingDevelopmentInfo {
	repeated uint32 active_part_id_list = 3;
	uint32 finished_action_num = 7;
	repeated uint32 active_action_id_list = 8;
}

message B51RacingDriverUnlockScNotify {
	repeated uint32 driver_id_list = 12;
}

message B51RacingEndMatchCsReq {
	uint32 track_id = 1;
	B51RacingMatchResultType result_type = 3;
	B51RacingMatchStats stats = 6;
	uint32 finish_time_ms = 7;
	uint32 rank = 10;
	uint32 session_id = 11;
}

message B51RacingEndMatchScRsp {
	uint32 finished_match_num = 4;
	bool is_cycle_finished = 5;
	uint32 retcode = 8;
	uint32 added_team_point = 10;
	B51RacingAgendaInfo agenda = 11;
}

message B51RacingGetDataCsReq {
}

message B51RacingGetDataScRsp {
	B51RacingCarDisplay car_display = 1;
	uint32 retcode = 2;
	repeated uint32 unlocked_driver_id_list = 3;
	B51RacingChallengeData challenge = 7;
	B51RacingCycleData cycle = 13;
	uint32 last_cycle_id = 14;
}

message B51RacingMatchInfo {
	uint32 track_id = 10;
	uint32 match_id = 13;
	uint32 session_id = 14;
	uint64 start_time_ms = 15;
}

message B51RacingMissionChangeAgendaScNotify {
	B51RacingAgendaInfo agenda = 8;
	repeated uint32 unlocked_driver_id_list = 10;
}

message B51RacingPartInfo {
	repeated uint32 equipped_part_id_list = 5;
	repeated uint32 developed_part_id_list = 6;
	uint32 equipped_decal_id = 8;
}

message B51RacingPreMatchTrackInfo {
	uint32 day = 1;
	uint32 track_id = 7;
	uint32 match_id = 8;
}

message B51RacingReplacePartScRsp {
	B51RacingPartInfo part_info = 3;
	uint32 retcode = 10;
}

message B51RacingSelectDevelopActionCsReq {
	uint32 action_id = 2;
}

message B51RacingSelectDevelopActionScRsp {
	B51RacingStatInfo stat_info = 1;
	uint32 remaining_action_count = 3;
	B51RacingAgendaInfo agenda = 4;
	uint32 retcode = 7;
	B51RacingPartInfo part_info = 8;
	bool is_development_finished = 13;
}

message B51RacingSelectDevelopPartCsReq {
	uint32 part_id = 6;
}

message B51RacingSelectDevelopPartScRsp {
	uint32 retcode = 1;
	uint32 remaining_select_count = 3;
	B51RacingStatInfo stat_info = 12;
	B51RacingAgendaInfo agenda = 14;
	B51RacingPartInfo part_info = 15;
}

message B51RacingSetDriverCsReq {
	uint32 driver_id = 7;
}

message B51RacingSetDriverScRsp {
	uint32 retcode = 7;
	uint32 driver_id = 10;
}

message B51RacingStartCycleCsReq {
	B51RacingCarLivery livery = 2;
	uint32 car_id = 4;
	uint32 cycle_id = 13;
}

message B51RacingStartCycleScRsp {
	uint32 retcode = 1;
	B51RacingCycleData cycle = 5;
}

message B51RacingStartMatchCsReq {
	uint32 track_id = 1;
	uint32 match_id = 8;
}

message B51RacingStartMatchScRsp {
	uint32 retcode = 2;
	B51RacingMatchInfo match = 4;
}

message B51RacingStatInfo {
	repeated KVP target_stat_tier_list = 10;
	repeated KVP stat_value_list = 15;
}

enum CmdB51RacingType {
	CmdB51RacingType_NLCDGIPGFDJ = 0;
	CmdB51RacingType_B51RacingDriverUnlockScNotify = 9981;
	CmdB51RacingType_B51RacingSelectDevelopActionScRsp = 9982;
	CmdB51RacingType_B51RacingSelectDevelopPartScRsp = 9983;
	CmdB51RacingType_B51RacingSetDriverCsReq = 9984;
	CmdB51RacingType_B51RacingEndMatchCsReq = 9985;
	CmdB51RacingType_B51RacingGetDataCsReq = 9986;
	CmdB51RacingType_B51RacingReplacePartScRsp = 9987;
	CmdB51RacingType_B51RacingSelectDevelopPartCsReq = 9988;
	CmdB51RacingType_B51RacingMissionChangeAgendaScNotify = 9989;
	CmdB51RacingType_B51RacingSelectDevelopActionCsReq = 9990;
	CmdB51RacingType_B51RacingEndMatchScRsp = 9991;
	CmdB51RacingType_B51RacingStartCycleScRsp = 9992;
	CmdB51RacingType_B51RacingSetDriverScRsp = 9993;
	CmdB51RacingType_B51RacingCarLiveryCsReq = 9994;
	CmdB51RacingType_B51RacingCarLiveryScRsp = 9995;
	CmdB51RacingType_B51RacingStartMatchScRsp = 9996;
	CmdB51RacingType_B51RacingStartMatchCsReq = 9997;
	CmdB51RacingType_B51RacingStartCycleCsReq = 9998;
	CmdB51RacingType_B51RacingGetDataScRsp = 9999;
}
