syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message BuyGoodsCsReq {
	uint32 goods_id = 1;
	uint32 interacted_prop_entity_id = 5;
	uint32 goods_num = 6;
	repeated uint32 ALHBEKKLJKK = 10;
	uint32 item_id = 11;
	uint32 shop_id = 14;
}

message BuyGoodsScRsp {
	uint32 goods_buy_times = 3;
	uint32 retcode = 4;
	uint32 shop_id = 6;
	uint32 goods_id = 8;
	ItemList return_item_list = 15;
}

message CityShopInfoScNotify {
	uint64 taken_level_reward = 1;
	uint32 exp = 3;
	uint32 shop_id = 11;
	uint32 level = 13;
}

enum CmdShopType {
	CmdShopType_NLCDGIPGFDJ = 0;
	CmdShopType_CityShopInfoScNotify = 1507;
	CmdShopType_TakeCityShopRewardScRsp = 1533;
	CmdShopType_BuyGoodsScRsp = 1542;
	CmdShopType_GetShopListScRsp = 1554;
	CmdShopType_TakeCityShopRewardCsReq = 1573;
	CmdShopType_GetShopListCsReq = 1583;
	CmdShopType_BuyGoodsCsReq = 1596;
}

message GetShopListCsReq {
	uint32 shop_type = 3;
}

message GetShopListScRsp {
	repeated Shop shop_list = 11;
	uint32 retcode = 12;
	uint32 shop_type = 14;
}

message Goods {
	int64 begin_time = 2;
	uint32 item_id = 4;
	int64 end_time = 8;
	uint32 buy_times = 9;
	uint32 goods_id = 10;
}

message Shop {
	uint32 city_exp = 2;
	uint32 city_level = 3;
	uint32 shop_id = 6;
	int64 begin_time = 7;
	int64 end_time = 8;
	repeated Goods goods_list = 12;
	uint64 city_taken_level_reward = 15;
}

message TakeCityShopRewardCsReq {
	uint32 level = 12;
	uint32 shop_id = 13;
}

message TakeCityShopRewardScRsp {
	uint32 retcode = 1;
	uint32 shop_id = 6;
	uint32 level = 10;
	ItemList reward = 15;
}
