syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message ChallengePeak {
	bool has_passed = 1;
	repeated ChallengePeakBuild peak_build_list = 5;
	repeated uint32 finished_target_list = 10;
	uint32 peak_id = 11;
	repeated uint32 peak_avatar_id_list = 12;
	uint32 cycles_used = 14;
}

message ChallengePeakBestRecord {
	uint32 peak_id = 3;
	repeated uint32 finished_target_list = 9;
	uint32 cycles_used = 10;
	repeated ChallengePeakRecordAvatar peak_avatar_id_list = 12;
}

message ChallengePeakBestRecordList {
	repeated ChallengePeakBestRecord peaks = 13;
}

message ChallengePeakBoss {
	repeated uint32 finished_target_list = 1;
	ChallengePeakBossClearance easy_mode = 7;
	bool hard_mode_has_passed = 11;
	uint32 BFBHCKEJDIG = 14;
	ChallengePeakBossClearance hard_mode = 15;
}

message ChallengePeakBossClearance {
	uint32 best_cycle_count = 1;
	repeated uint32 peak_avatar_id_list = 2;
	uint32 best_record_buff_id = 3;
	uint32 buff_id = 4;
	bool has_passed = 5;
	uint32 max_left_turn = 7;
	repeated uint32 LAMPCACOCHP = 10;
	repeated ChallengePeakRecordAvatar best_record_avatar_list = 13;
}

message ChallengePeakBuild {
	uint32 skin_id = 3;
	uint32 avatar_id = 4;
	uint32 equipment_unique_id = 10;
	repeated EquipRelic relic_list = 15;
}

message ChallengePeakGroup {
	WaitConfirmData wait_confirm_data = 4;
	repeated ChallengePeak peaks = 5;
	ChallengePeakBestRecordList best_record_list = 8;
	ChallengePeakBoss peak_boss = 9;
	repeated uint32 taken_star_rewards = 11;
	uint32 count_of_peaks = 12;
	uint32 obtained_stars = 13;
	uint32 peak_group_id = 14;
	bool disable_hard_mode = 15;
}

message ChallengePeakGroupDataUpdateScNotify {
	ChallengePeakGroup challenge_peak_group = 6;
}

message ChallengePeakLineup {
	uint32 peak_id = 11;
	repeated uint32 peak_avatar_id_list = 14;
}

message ChallengePeakRecordAvatar {
	uint32 avatar_id = 3;
	uint32 skin_id = 13;
}

message ChallengePeakRewardGroup {
	uint32 reward_id = 4;
	ItemList reward = 7;
}

message ChallengePeakSettleScNotify {
	repeated ChallengePeakRewardGroup peak_reward_group_list = 1;
	bool is_first_pass = 2;
	bool is_boss_target_better = 3;
	repeated uint32 finished_target_list = 4;
	bool is_unlock_easy_boss = 5;
	uint32 peak_id = 8;
	uint32 turn_left = 9;
	bool hard_mode_has_passed = 10;
	uint32 cycles_used = 11;
	bool is_wait_confirm = 12;
	bool is_win = 15;
}

enum CmdChallengePeakType {
	CmdChallengePeakType_NLCDGIPGFDJ = 0;
	CmdChallengePeakType_GetChallengePeakDataScRsp = 8901;
	CmdChallengePeakType_TakeChallengePeakRewardScRsp = 8904;
	CmdChallengePeakType_LeaveChallengePeakCsReq = 8907;
	CmdChallengePeakType_SetChallengePeakBossHardModeCsReq = 8909;
	CmdChallengePeakType_StartChallengePeakCsReq = 8911;
	CmdChallengePeakType_ChallengePeakSettleScNotify = 8913;
	CmdChallengePeakType_LeaveChallengePeakScRsp = 8915;
	CmdChallengePeakType_GetChallengePeakDataCsReq = 8916;
	CmdChallengePeakType_TakeChallengePeakRewardCsReq = 8922;
	CmdChallengePeakType_ReStartChallengePeakCsReq = 8923;
	CmdChallengePeakType_ChallengePeakGroupDataUpdateScNotify = 8927;
	CmdChallengePeakType_GetCurChallengePeakScRsp = 8930;
	CmdChallengePeakType_SetChallengePeakMobLineupAvatarScRsp = 8932;
	CmdChallengePeakType_GetCurChallengePeakCsReq = 8936;
	CmdChallengePeakType_ConfirmChallengePeakSettleCsReq = 8940;
	CmdChallengePeakType_ReStartChallengePeakScRsp = 8941;
	CmdChallengePeakType_SetChallengePeakBossHardModeScRsp = 8943;
	CmdChallengePeakType_StartChallengePeakScRsp = 8944;
	CmdChallengePeakType_ConfirmChallengePeakSettleScRsp = 8945;
	CmdChallengePeakType_SetChallengePeakMobLineupAvatarCsReq = 8947;
}

message ConfirmChallengePeakSettleCsReq {
	uint32 peak_id = 2;
	bool IOBCIMIPEOM = 4;
}

message ConfirmChallengePeakSettleScRsp {
	bool IOBCIMIPEOM = 1;
	uint32 retcode = 8;
	uint32 peak_id = 11;
}

message GetChallengePeakDataCsReq {
}

message GetChallengePeakDataScRsp {
	uint32 retcode = 8;
	repeated ChallengePeakGroup challenge_peak_groups = 12;
	uint32 current_peak_group_id = 13;
}

message GetCurChallengePeakCsReq {
}

message GetCurChallengePeakScRsp {
	uint32 boss_buff_id = 1;
	uint32 peak_id = 3;
	bool has_passed = 9;
	uint32 retcode = 10;
}

message LeaveChallengePeakCsReq {
}

message LeaveChallengePeakScRsp {
	uint32 retcode = 13;
}

message ReStartChallengePeakCsReq {
}

message ReStartChallengePeakScRsp {
	uint32 retcode = 5;
}

message SetChallengePeakBossHardModeCsReq {
	uint32 peak_group_id = 8;
	bool is_hard_mode = 11;
}

message SetChallengePeakBossHardModeScRsp {
	uint32 peak_group_id = 2;
	bool is_hard_mode = 4;
	uint32 retcode = 8;
}

message SetChallengePeakMobLineupAvatarCsReq {
	uint32 peak_group_id = 5;
	repeated ChallengePeakLineup lineup_list = 12;
}

message SetChallengePeakMobLineupAvatarScRsp {
	uint32 retcode = 6;
}

message StartChallengePeakCsReq {
	uint32 boss_buff_id = 12;
	uint32 peak_id = 13;
	repeated uint32 peak_avatar_id_list = 14;
}

message StartChallengePeakScRsp {
	uint32 retcode = 11;
}

message TakeChallengePeakRewardCsReq {
	uint32 peak_group_id = 4;
	repeated uint32 normal_reward_id_list = 11;
}

message TakeChallengePeakRewardScRsp {
	uint32 peak_group_id = 6;
	uint32 retcode = 11;
	repeated ChallengePeakRewardGroup peak_reward_group_list = 13;
}

message WaitConfirmData {
	bool is_wait_confirm = 5;
	uint32 cycles_used = 6;
	repeated uint32 finished_target_list = 10;
	uint32 peak_id = 14;
}
