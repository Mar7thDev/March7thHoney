syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message ClientMail {
	MailType mail_type = 1;
	ItemList attachment = 2;
	string content = 3;
	int64 time = 8;
	string title = 9;
	int64 expire_time = 10;
	repeated string para_list = 11;
	bool is_read = 12;
	uint32 id = 13;
	uint32 template_id = 14;
	string sender = 15;
}

enum CmdMailType {
	CmdMailType_NLCDGIPGFDJ = 0;
	CmdMailType_TakeMailAttachmentCsReq = 807;
	CmdMailType_NewMailScNotify = 826;
	CmdMailType_DelMailScRsp = 833;
	CmdMailType_MarkReadMailScRsp = 842;
	CmdMailType_GetMailScRsp = 854;
	CmdMailType_DelMailCsReq = 873;
	CmdMailType_GetMailCsReq = 883;
	CmdMailType_TakeMailAttachmentScRsp = 891;
	CmdMailType_MarkReadMailCsReq = 896;
}

message DelMailCsReq {
	repeated uint32 id_list = 13;
}

message DelMailScRsp {
	uint32 retcode = 3;
	repeated uint32 id_list = 12;
}

message GetMailCsReq {
	uint32 HFKFNFKIEON = 11;
	uint32 start = 13;
}

message GetMailScRsp {
	uint32 start = 1;
	uint32 total_num = 3;
	bool is_end = 4;
	repeated ClientMail notice_mail_list = 8;
	uint32 retcode = 10;
	repeated ClientMail mail_list = 12;
}

message KNPNAHPHNJK {
	uint32 IODBGABPNOP = 9;
	uint32 item_id = 11;
}

enum MailType {
	MailType_Normal = 0;
	MailType_Star = 1;
}

message MarkReadMailCsReq {
	uint32 id = 4;
}

message MarkReadMailScRsp {
	uint32 id = 5;
	uint32 retcode = 10;
}

message NewMailScNotify {
	repeated uint32 mail_id_list = 12;
}

message TakeMailAttachmentCsReq {
	uint32 optional_reward_id = 1;
	repeated uint32 mail_id_list = 15;
}

message TakeMailAttachmentScRsp {
	repeated KNPNAHPHNJK fail_mail_list = 1;
	repeated uint32 succ_mail_id_list = 2;
	uint32 retcode = 9;
	ItemList attachment = 10;
}
