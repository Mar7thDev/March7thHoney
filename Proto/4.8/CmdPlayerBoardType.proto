syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdPlayerBoardType {
	CmdPlayerBoardType_NLCDGIPGFDJ = 0;
	CmdPlayerBoardType_SetIsDisplayAvatarInfoCsReq = 2807;
	CmdPlayerBoardType_SetSignatureScRsp = 2808;
	CmdPlayerBoardType_SetPersonalCardCsReq = 2812;
	CmdPlayerBoardType_OJKCPGJLCDI = 2826;
	CmdPlayerBoardType_SetDisplayAvatarScRsp = 2833;
	CmdPlayerBoardType_SetHeadIconScRsp = 2842;
	CmdPlayerBoardType_SetAssistAvatarScRsp = 2843;
	CmdPlayerBoardType_GetPlayerBoardDataScRsp = 2854;
	CmdPlayerBoardType_SetPersonalCardScRsp = 2869;
	CmdPlayerBoardType_SetDisplayAvatarCsReq = 2873;
	CmdPlayerBoardType_SetSignatureCsReq = 2878;
	CmdPlayerBoardType_SetAssistAvatarCsReq = 2881;
	CmdPlayerBoardType_GetPlayerBoardDataCsReq = 2883;
	CmdPlayerBoardType_SetIsDisplayAvatarInfoScRsp = 2891;
	CmdPlayerBoardType_SetHeadIconCsReq = 2896;
}

message DisplayAvatarData {
	uint32 avatar_id = 3;
	uint32 pos = 13;
}

message DisplayAvatarVec {
	repeated DisplayAvatarData display_avatar_list = 2;
	bool is_display = 11;
}

message GetPlayerBoardDataCsReq {
}

message GetPlayerBoardDataScRsp {
	uint32 current_personal_card_id = 2;
	repeated uint32 assist_avatar_id_list = 3;
	repeated HeadIconData unlocked_head_icon_list = 5;
	DisplayAvatarVec display_avatar_vec = 8;
	uint32 retcode = 9;
	string signature = 10;
	uint32 current_head_icon_id = 11;
	HeadFrameInfo head_frame_info = 13;
	repeated uint32 unlocked_personal_card_list = 14;
}

message SetAssistAvatarCsReq {
	repeated uint32 avatar_id_list = 6;
	uint32 avatar_id = 8;
}

message SetAssistAvatarScRsp {
	uint32 retcode = 3;
	uint32 avatar_id = 6;
	repeated uint32 avatar_id_list = 9;
}

message SetDisplayAvatarCsReq {
	repeated DisplayAvatarData display_avatar_list = 15;
}

message SetDisplayAvatarScRsp {
	uint32 retcode = 1;
	repeated DisplayAvatarData display_avatar_list = 5;
}

message SetHeadIconCsReq {
	uint32 id = 8;
}

message SetHeadIconScRsp {
	uint32 current_head_icon_id = 5;
	uint32 retcode = 14;
}

message SetIsDisplayAvatarInfoCsReq {
	bool is_display = 13;
}

message SetIsDisplayAvatarInfoScRsp {
	uint32 retcode = 9;
	bool is_display = 12;
}

message SetPersonalCardCsReq {
	uint32 id = 1;
}

message SetPersonalCardScRsp {
	uint32 retcode = 1;
	uint32 current_personal_card_id = 14;
}

message SetSignatureCsReq {
	string signature = 3;
}

message SetSignatureScRsp {
	uint32 retcode = 9;
	string signature = 10;
}
