syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message AcceptedPamMissionExpireCsReq {
	uint32 EBIIKKFIHNG = 5;
}

message AcceptedPamMissionExpireScRsp {
	uint32 retcode = 13;
}

enum CmdPamMissionType {
	CmdPamMissionType_NLCDGIPGFDJ = 0;
	CmdPamMissionType_AcceptedPamMissionExpireScRsp = 4054;
	CmdPamMissionType_AcceptedPamMissionExpireCsReq = 4083;
	CmdPamMissionType_SyncAcceptedPamMissionNotify = 4096;
}

message SyncAcceptedPamMissionNotify {
	uint32 main_mission_id = 7;
	uint64 expire_time = 11;
}
