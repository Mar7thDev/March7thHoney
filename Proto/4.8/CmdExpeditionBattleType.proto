syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdExpeditionBattleType {
	CmdExpeditionBattleType_NLCDGIPGFDJ = 0;
	CmdExpeditionBattleType_GetExpeditionBattleDataScRsp = 9328;
	CmdExpeditionBattleType_ExpeditionBattleEndScNotify = 9330;
	CmdExpeditionBattleType_ExpeditionBattleSettleScNotify = 9331;
	CmdExpeditionBattleType_LHGMLLLJFEA = 9334;
	CmdExpeditionBattleType_ExpeditionBattleStartScRsp = 9338;
	CmdExpeditionBattleType_ExpeditionBattleStartCsReq = 9340;
	CmdExpeditionBattleType_GetExpeditionBattleDataCsReq = 9341;
	CmdExpeditionBattleType_ExpeditionBattleSetLineupCsReq = 9343;
	CmdExpeditionBattleType_ExpeditionBattleSetLineupScRsp = 9344;
}

message ExpeditionBattleAvatarDamage {
	uint64 damage = 8;
	uint32 avatar_id = 11;
}

message ExpeditionBattleAvatarInfo {
	AvatarType avatar_type = 2;
	uint32 avatar_id = 3;
}

message ExpeditionBattleEndScNotify {
	ExpeditionBattleMapData map_data = 5;
	bool is_new_record = 9;
}

message ExpeditionBattleFunRecord {
	uint32 avatar_id = 5;
	uint64 fun_count = 6;
	uint32 fun_id = 15;
}

message ExpeditionBattleLevelRecord {
	repeated ExpeditionBattleAvatarDamage avatar_damage_list = 7;
	uint32 level_id = 9;
	repeated uint32 dead_avatar_id_list = 13;
}

message ExpeditionBattleLineup {
	repeated ExpeditionBattleAvatarInfo avatar_list = 10;
	uint32 route_id = 11;
}

message ExpeditionBattleMapData {
	uint32 remaining_challenge_count = 1;
	uint32 map_id = 6;
	repeated ExpeditionBattleRouteRecord route_record_list = 8;
}

message ExpeditionBattleRouteRecord {
	repeated ExpeditionBattleAvatarInfo avatar_list = 1;
	uint64 buff_value = 2;
	uint32 battle_round_count = 3;
	repeated ExpeditionBattleFunRecord fun_list = 4;
	uint32 passed_level = 5;
	uint32 route_id = 6;
	uint32 last_level_percent = 8;
	bool is_new_record = 9;
	repeated ExpeditionBattleLevelRecord level_record_list = 13;
}

message ExpeditionBattleRouteSettleInfo {
	uint64 buff_value = 4;
	uint32 battle_round_count = 5;
	uint32 last_level_percent = 9;
	bool is_passed = 11;
	uint32 route_id = 12;
	repeated ExpeditionBattleAvatarDamage avatar_damage_list = 13;
	repeated uint32 dead_avatar_id_list = 14;
}

message ExpeditionBattleSetLineupCsReq {
	uint32 map_id = 5;
	repeated ExpeditionBattleLineup lineup_list = 7;
}

message ExpeditionBattleSetLineupScRsp {
	uint32 map_id = 1;
	uint32 retcode = 2;
	repeated ExpeditionBattleLineup lineup_list = 14;
}

message ExpeditionBattleSettleScNotify {
	uint32 level_turn = 1;
	repeated ExpeditionBattleRouteSettleInfo route_settle_list = 3;
	repeated ExpeditionBattleFunRecord fun_list = 4;
	uint32 map_id = 15;
}

message ExpeditionBattleStartCsReq {
	uint32 map_id = 2;
}

message ExpeditionBattleStartScRsp {
	uint32 retcode = 7;
}

message FJKEGMEPLDI {
	repeated HKHKEMHCHEB CPPBNJLABGE = 14;
}

message GetExpeditionBattleDataCsReq {
}

message GetExpeditionBattleDataScRsp {
	uint32 retcode = 1;
	repeated ExpeditionBattleMapData map_data_list = 4;
}

message HKHKEMHCHEB {
	uint32 NECCJMBJNEN = 2;
	uint32 HECCOBFBJFI = 4;
}
