syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message AcceptMultipleExpeditionCsReq {
	repeated ExpeditionInfo expedition = 10;
}

message AcceptMultipleExpeditionScRsp {
	repeated ItemList DJOBNPIAEJP = 1;
	int64 BJMGDBCHEAN = 5;
	uint32 retcode = 7;
	repeated ExpeditionInfo accept_multi_expedition = 10;
}

enum CmdExpeditionType {
	CmdExpeditionType_NLCDGIPGFDJ = 0;
	CmdExpeditionType_GetExpeditionDataScRsp = 2501;
	CmdExpeditionType_GetExpeditionDataCsReq = 2516;
	CmdExpeditionType_DFJDNLNFKLG = 2522;
	CmdExpeditionType_TakeMultipleExpeditionRewardCsReq = 2528;
	CmdExpeditionType_AcceptMultipleExpeditionCsReq = 2541;
	CmdExpeditionType_AcceptMultipleExpeditionScRsp = 2542;
	CmdExpeditionType_TakeMultipleExpeditionRewardScRsp = 2547;
}

message ExpeditionInfo {
	uint32 id = 8;
}

message GetExpeditionDataCsReq {
}

message GetExpeditionDataScRsp {
	uint32 total_expedition_count = 2;
	uint32 retcode = 6;
	repeated ExpeditionInfo expedition_info = 7;
	int64 BJMGDBCHEAN = 10;
	repeated uint32 CAALNNFJIAH = 14;
}

message HKCILGGEEFM {
	int64 BJMGDBCHEAN = 5;
	uint32 total_expedition_count = 8;
	repeated ExpeditionInfo expedition_info = 12;
	repeated uint32 CAALNNFJIAH = 13;
}

message TakeMultipleExpeditionRewardCsReq {
}

message TakeMultipleExpeditionRewardScRsp {
	uint32 retcode = 2;
	int64 BJMGDBCHEAN = 3;
	repeated uint32 NPCMKBNJABA = 12;
	repeated ItemList DJOBNPIAEJP = 14;
}
