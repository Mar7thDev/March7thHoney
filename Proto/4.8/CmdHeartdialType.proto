syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message ChangeScriptEmotionCsReq {
	HeartDialEmotionType target_emotion_type = 1;
	uint32 script_id = 7;
	uint32 BLKFCFGMMBD = 9;
}

message ChangeScriptEmotionScRsp {
	uint32 script_id = 11;
	HeartDialEmotionType emotion_type = 12;
	uint32 retcode = 13;
}

enum CmdHeartdialType {
	CmdHeartdialType_NLCDGIPGFDJ = 0;
	CmdHeartdialType_FinishEmotionDialoguePerformanceCsReq = 6307;
	CmdHeartdialType_HeartDialTraceScriptScRsp = 6308;
	CmdHeartdialType_HeartDialScriptChangeScNotify = 6326;
	CmdHeartdialType_SubmitEmotionItemScRsp = 6333;
	CmdHeartdialType_ChangeScriptEmotionScRsp = 6342;
	CmdHeartdialType_GetHeartDialInfoScRsp = 6354;
	CmdHeartdialType_SubmitEmotionItemCsReq = 6373;
	CmdHeartdialType_HeartDialTraceScriptCsReq = 6378;
	CmdHeartdialType_GetHeartDialInfoCsReq = 6383;
	CmdHeartdialType_FinishEmotionDialoguePerformanceScRsp = 6391;
	CmdHeartdialType_ChangeScriptEmotionCsReq = 6396;
}

message EAJEMNNNEBM {
	uint32 LLIOEMOBFGD = 3;
	uint32 CNHLAAHDPGA = 14;
}

message FinishEmotionDialoguePerformanceCsReq {
	uint32 script_id = 2;
	uint32 dialogue_id = 7;
	uint32 BLKFCFGMMBD = 8;
}

message FinishEmotionDialoguePerformanceScRsp {
	ItemList reward_list = 4;
	uint32 script_id = 9;
	uint32 retcode = 13;
	uint32 dialogue_id = 14;
}

message GetHeartDialInfoCsReq {
}

message GetHeartDialInfoScRsp {
	uint32 retcode = 5;
	repeated HeartDialDialogueInfo dialogue_info_list = 6;
	repeated EAJEMNNNEBM EBLMNLBBFNL = 9;
	repeated HeartDialScriptInfo script_info_list = 12;
	HeartDialUnlockStatus unlock_status = 13;
}

message HeartDialDialogueInfo {
	bool GDPHOIMONLN = 4;
	uint32 dialogue_id = 11;
}

enum HeartDialEmotionType {
	HEART_DIAL_EMOTION_TYPE_PEACE = 0;
	HEART_DIAL_EMOTION_TYPE_ANGER = 1;
	HEART_DIAL_EMOTION_TYPE_HAPPY = 2;
	HEART_DIAL_EMOTION_TYPE_SAD = 3;
}

message HeartDialScriptChangeScNotify {
	repeated EAJEMNNNEBM EBLMNLBBFNL = 2;
	repeated HeartDialDialogueInfo changed_dialogue_info_list = 5;
	repeated HeartDialScriptInfo changed_script_info_list = 9;
	HeartDialUnlockStatus unlock_status = 12;
}

message HeartDialScriptInfo {
	bool LHCOJIEBFFM = 3;
	uint32 script_id = 5;
	bool EEKCKFGHGEH = 8;
	HeartDialEmotionType cur_emotion_type = 12;
	HeartDialStepType step = 15;
}

enum HeartDialStepType {
	HeartDialStepType_COEEJALELPF = 0;
	HeartDialStepType_BADPBGFJPNN = 1;
	HeartDialStepType_game_lock_info = 2;
	HeartDialStepType_CCJMKNNHKKE = 3;
	HeartDialStepType_BEJEBBNFGPM = 4;
	HeartDialStepType_NGNFOIHNLMJ = 5;
}

message HeartDialTraceScriptCsReq {
	EAJEMNNNEBM NDPMEMLJGCK = 14;
}

message HeartDialTraceScriptScRsp {
	uint32 retcode = 1;
	EAJEMNNNEBM NDPMEMLJGCK = 3;
}

enum HeartDialUnlockStatus {
	HEART_DIAL_UNLOCK_STATUS_LOCK = 0;
	HEART_DIAL_UNLOCK_STATUS_UNLOCK_SINGLE = 1;
	HEART_DIAL_UNLOCK_STATUS_UNLOCK_ALL = 2;
}

message SubmitEmotionItemCsReq {
	uint32 script_id = 5;
	ItemList item_list = 13;
}

message SubmitEmotionItemScRsp {
	uint32 retcode = 8;
	uint32 script_id = 9;
}
