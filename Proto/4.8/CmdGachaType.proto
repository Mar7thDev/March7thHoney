syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdGachaType {
	CmdGachaType_NLCDGIPGFDJ = 0;
	CmdGachaType_ExchangeGachaCeilingCsReq = 1907;
	CmdGachaType_PDCIIFCCBEH = 1908;
	CmdGachaType_SetGachaDecideItemCsReq = 1926;
	CmdGachaType_GetGachaCeilingScRsp = 1933;
	CmdGachaType_DoGachaScRsp = 1942;
	CmdGachaType_GetGachaInfoScRsp = 1954;
	CmdGachaType_GetGachaCeilingCsReq = 1973;
	CmdGachaType_SetGachaDecideItemScRsp = 1978;
	CmdGachaType_GetGachaInfoCsReq = 1983;
	CmdGachaType_ExchangeGachaCeilingScRsp = 1991;
	CmdGachaType_DoGachaCsReq = 1996;
}

message DoGachaCsReq {
	uint32 simulate_magic = 2;
	uint32 gacha_random = 6;
	uint32 gacha_num = 7;
	uint32 gacha_id = 13;
}

message DoGachaScRsp {
	uint32 LDBCKJIPDHF = 2;
	uint32 GPNLDDLBOLM = 3;
	repeated GachaItem gacha_item_list = 4;
	uint32 NHBBHEMPJJM = 7;
	uint32 GLLJFPENLHD = 8;
	uint32 gacha_id = 9;
	uint32 NCBEDGBOJLC = 12;
	uint32 gacha_num = 13;
	uint32 retcode = 14;
}

message ExchangeGachaCeilingCsReq {
	uint32 avatar_id = 6;
	uint32 gacha_type = 10;
}

message ExchangeGachaCeilingScRsp {
	GachaCeiling gacha_ceiling = 2;
	ItemList transfer_item_list = 3;
	uint32 gacha_type = 6;
	uint32 avatar_id = 8;
	uint32 retcode = 14;
}

message GachaCeiling {
	uint32 ceiling_num = 2;
	bool is_claimed = 4;
	repeated GachaCeilingAvatar avatar_list = 11;
}

message GachaCeilingAvatar {
	uint32 avatar_id = 10;
	uint32 repeated_cnt = 12;
}

message GachaInfo {
	int64 end_time = 1;
	repeated uint32 prize_item_list = 2;
	repeated uint32 ONIHOMCELJK = 3;
	string history_url = 4;
	GachaCeiling gacha_ceiling = 5;
	uint32 GLLJFPENLHD = 6;
	int64 begin_time = 7;
	uint32 NHBBHEMPJJM = 8;
	string detail_url = 11;
	uint32 MMELNCHIDNC = 12;
	repeated uint32 item_detail_list = 13;
	uint32 gacha_id = 14;
}

message GachaItem {
	ItemList token_item = 8;
	ItemList transfer_item_list = 9;
	bool is_new = 10;
	Item gacha_item = 12;
}

message GetGachaCeilingCsReq {
	uint32 DDMCNOJFGON = 6;
}

message GetGachaCeilingScRsp {
	GachaCeiling gacha_ceiling = 4;
	uint32 retcode = 7;
	uint32 gacha_type = 14;
}

message GetGachaInfoCsReq {
}

message GetGachaInfoScRsp {
	uint32 KKKNJDBNJPM = 3;
	repeated GachaInfo gacha_info_list = 4;
	uint32 gacha_random = 5;
	repeated NEIMLKNMDBM AKMDBPNEHDE = 7;
	uint32 retcode = 10;
	uint32 OGMPKDHKPAJ = 12;
	uint32 GPNLDDLBOLM = 14;
}

message NEIMLKNMDBM {
	uint32 GFANBHAEKOK = 8;
	uint32 MMELNCHIDNC = 9;
	repeated uint32 EJGNMCAMELA = 13;
	repeated uint32 OJNEFBJHCCK = 15;
}

message SetGachaDecideItemCsReq {
	repeated uint32 OJNEFBJHCCK = 5;
	uint32 gacha_id = 6;
	uint32 GFANBHAEKOK = 11;
}

message SetGachaDecideItemScRsp {
	uint32 retcode = 3;
	NEIMLKNMDBM NBLOJLDLBEB = 14;
}
