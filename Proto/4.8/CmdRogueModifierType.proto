syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdRogueModifierType {
	CmdRogueModifierType_NLCDGIPGFDJ = 0;
	CmdRogueModifierType_RogueModifierDelNotify = 5326;
	CmdRogueModifierType_RogueModifierSelectCellCsReq = 5342;
	CmdRogueModifierType_RogueModifierSelectCellScRsp = 5373;
	CmdRogueModifierType_RogueModifierStageStartNotify = 5378;
	CmdRogueModifierType_RogueModifierUpdateNotify = 5391;
	CmdRogueModifierType_RogueModifierAddNotify = 5396;
}

message RogueModifierAddNotify {
	BMCNDLNONMO modifier = 2;
}

message RogueModifierDelNotify {
	uint64 FCHLCANJIGL = 14;
}

message RogueModifierSelectCellCsReq {
	uint32 IHAOMLEPHOM = 10;
}

message RogueModifierSelectCellScRsp {
	ItemList NMJGHEACCMC = 1;
	uint32 retcode = 9;
}

message RogueModifierStageStartNotify {
	RogueModifierSourceType source_type = 3;
}

message RogueModifierUpdateNotify {
	BMCNDLNONMO modifier = 10;
}
