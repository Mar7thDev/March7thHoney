syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message ArchiveWolfBroGameCsReq {
	MotionInfo motion = 4;
	uint32 id = 8;
}

message ArchiveWolfBroGameScRsp {
	GGHOBPBFFOB game_data = 6;
	uint32 retcode = 13;
}

enum CmdWolfBroType {
	CmdWolfBroType_NLCDGIPGFDJ = 0;
	CmdWolfBroType_StartWolfBroGameScRsp = 6501;
	CmdWolfBroType_GetWolfBroGameDataScRsp = 6504;
	CmdWolfBroType_RestoreWolfBroGameArchiveCsReq = 6507;
	CmdWolfBroType_WolfBroGameUseBulletScRsp = 6509;
	CmdWolfBroType_ArchiveWolfBroGameCsReq = 6511;
	CmdWolfBroType_QuitWolfBroGameCsReq = 6513;
	CmdWolfBroType_RestoreWolfBroGameArchiveScRsp = 6515;
	CmdWolfBroType_StartWolfBroGameCsReq = 6516;
	CmdWolfBroType_GetWolfBroGameDataCsReq = 6522;
	CmdWolfBroType_WolfBroGamePickupBulletScRsp = 6523;
	CmdWolfBroType_QuitWolfBroGameScRsp = 6527;
	CmdWolfBroType_NCJOMMAINOC = 6528;
	CmdWolfBroType_HPHNFDIPEIE = 6530;
	CmdWolfBroType_WolfBroGameDataChangeScNotify = 6536;
	CmdWolfBroType_WolfBroGameActivateBulletCsReq = 6541;
	CmdWolfBroType_WolfBroGameActivateBulletScRsp = 6542;
	CmdWolfBroType_WolfBroGamePickupBulletCsReq = 6543;
	CmdWolfBroType_ArchiveWolfBroGameScRsp = 6544;
	CmdWolfBroType_WolfBroGameExplodeMonsterScRsp = 6547;
}

message GGHOBPBFFOB {
	string uuid = 3;
	uint32 id = 6;
	uint32 CHCOPKAKBNO = 7;
	bool is_bullet_activated = 9;
	KDFPANILFOH BBEMIGELGJC = 12;
	repeated Vector PAOEJKABFEP = 15;
}

message GetWolfBroGameDataCsReq {
	uint32 id = 4;
}

message GetWolfBroGameDataScRsp {
	uint32 retcode = 5;
	GGHOBPBFFOB game_data = 12;
}

message KDFPANILFOH {
	repeated Vector PAOEJKABFEP = 1;
	uint32 CHCOPKAKBNO = 4;
	MotionInfo motion = 6;
	bool is_bullet_activated = 11;
}

message LBMFCJLHNAA {
	repeated uint32 assist_monster_entity_id_list = 9;
}

message OKEFGCNNEKI {
	repeated uint32 assist_monster_entity_id_list = 3;
	Vector GGDCDJDBCCN = 12;
}

message QuitWolfBroGameCsReq {
	uint32 id = 10;
}

message QuitWolfBroGameScRsp {
	GGHOBPBFFOB game_data = 3;
	uint32 retcode = 15;
}

message RestoreWolfBroGameArchiveCsReq {
	uint32 id = 5;
}

message RestoreWolfBroGameArchiveScRsp {
	uint32 retcode = 6;
	GGHOBPBFFOB game_data = 15;
}

message StartWolfBroGameCsReq {
	uint32 id = 3;
	MotionInfo motion = 8;
	GroupStateInfo IDANCEPOOEI = 10;
}

message StartWolfBroGameScRsp {
	GGHOBPBFFOB game_data = 2;
	uint32 retcode = 8;
}

message WolfBroGameActivateBulletCsReq {
	uint32 DAKENPDMDDJ = 4;
	uint32 group_id = 6;
}

message WolfBroGameActivateBulletScRsp {
	uint32 retcode = 12;
}

message WolfBroGameDataChangeScNotify {
	GGHOBPBFFOB game_data = 10;
}

message WolfBroGameExplodeMonsterScRsp {
	uint32 retcode = 8;
}

message WolfBroGamePickupBulletCsReq {
	Vector GGDCDJDBCCN = 15;
}

message WolfBroGamePickupBulletScRsp {
	uint32 retcode = 2;
	GGHOBPBFFOB game_data = 9;
}

message WolfBroGameUseBulletScRsp {
	GGHOBPBFFOB game_data = 5;
	uint32 retcode = 11;
}
