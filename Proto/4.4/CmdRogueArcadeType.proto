syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdRogueArcadeType {
    NNHBAOKEBJI_NLCDGIPGFDJ = 0;
    NNHBAOKEBJI_OCKANPAJIMJ = 7659;
    NNHBAOKEBJI_OCEMBBBNAGJ = 7664;
    NNHBAOKEBJI_DCHBPOBFJJK = 7669;
    NNHBAOKEBJI_FNAMLLEMAOK = 7690;
    NNHBAOKEBJI_PJDFLECDOAA = 7679;
    NNHBAOKEBJI_ENDFCJDJHEJ = 7656;
    NNHBAOKEBJI_GFECMCBCMDM = 7683;
    NNHBAOKEBJI_IFPCDBMEIAK = 7685;
}

message GCPGBPNGOFF {
    FHEGNOPNICH JNKLNLKHGBB = 8;
    LineupInfo lineup = 11;
    SceneInfo scene = 13;
}

message RogueArcadeGetInfoScRsp {
    uint32 retcode = 3;
    uint32 room_id = 15;
}

message RogueArcadeLeaveScRsp {
    GCPGBPNGOFF IDCMACCPCBH = 11;
