syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

enum CmdPetType {
    MAMMDADNGLP_NLCDGIPGFDJ = 0;
    MAMMDADNGLP_BCJECGLBFMD = 7612;
    MAMMDADNGLP_HOFFDKBENKE = 7607;
    MAMMDADNGLP_KLNPCNHGBOL = 7621;
    MAMMDADNGLP_NDBDDBICHPP = 7608;
    MAMMDADNGLP_BCKIBFHMGOF = 7619;
    MAMMDADNGLP_LKIKIOEFJEC = 7609;
    MAMMDADNGLP_KHHMEFCDMIF = 7605;
}

message GetPetDataCsReq {
}

message GetPetDataScRsp {
    repeated uint32 unlocked_pet_id = 3;
    uint32 cur_pet_id = 4;
    uint32 retcode = 5;
}

message RecallPetScRsp {
    uint32 retcode = 4;
    uint32 cur_pet_id = 8;
    uint32 select_pet_id = 14;
}

message SummonPetScRsp {
    uint32 cur_pet_id = 6;
    uint32 select_pet_id = 7;
    uint32 retcode = 15;
}
