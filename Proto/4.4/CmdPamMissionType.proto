}

enum CmdPamMissionType {
    KMGNIGGHMBM_NLCDGIPGFDJ = 0;
    KMGNIGGHMBM_MCKELFANPPI = 4093;
    KMGNIGGHMBM_HNHCOMDJGJI = 4025;
    KMGNIGGHMBM_GOFMDEDHENA = 4078;
