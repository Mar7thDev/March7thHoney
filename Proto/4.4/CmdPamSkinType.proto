syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

enum CmdPamSkinType {
    LIKMDKALNNI_NLCDGIPGFDJ = 0;
    LIKMDKALNNI_BEGEEPLAAPL = 8122;
    LIKMDKALNNI_NJMBOIMIKOD = 8123;
    LIKMDKALNNI_JBGKHBDHFDD = 8128;
    LIKMDKALNNI_ACDGHHDMCAL = 8132;
    LIKMDKALNNI_ADPIFEFKCAD = 8138;
}

message GetPamSkinDataCsReq {
}

message GetPamSkinDataScRsp {
    uint32 retcode = 3;
    repeated uint32 unlock_skin_list = 6;
    uint32 cur_skin = 8;
}

message SelectPamSkinScRsp {
    uint32 retcode = 2;
    uint32 set_skin = 3;
    uint32 cur_skin = 5;
}

message UnlockPamSkinScNotify {
    uint32 pam_skin = 3;
}
