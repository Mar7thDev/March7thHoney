syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

message NFABIIBMNPB {
    uint32 pos = 1;
    uint32 role_id = 2;
    uint32 role_star = 3;
    repeated uint32 grid_fight_item_list = 4;
    map<string, uint32> grid_fight_value_init_component = 5;
}
