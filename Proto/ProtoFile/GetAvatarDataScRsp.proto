syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Avatar.proto";
import "AvatarPathData.proto";
import "CFMDKNCDDAL.proto";
import "CJLCPMDGIBO.proto";
import "KVP.proto";

message GetAvatarDataScRsp {
    uint32 JFAADMONJNF = 1;
    bool is_get_all = 2;
    repeated AvatarPathData avatar_path_data_info_list = 4;
    repeated Avatar avatar_list = 5;
    repeated KVP JBFBEOLOHJN = 6;
    CJLCPMDGIBO DHKFCDAGHDM = 9;
    repeated CFMDKNCDDAL PILOAFIMCGK = 11;
    uint32 retcode = 12;
    repeated uint32 skin_list = 13;
    repeated uint32 basic_type_id_list = 15;
}
