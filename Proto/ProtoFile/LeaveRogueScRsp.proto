syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "JPFGHCPGHGO.proto";
import "LineupInfo.proto";
import "MADEENABOKE.proto";
import "SceneInfo.proto";

message LeaveRogueScRsp {
    uint32 retcode = 2;
    LineupInfo lineup = 5;
    SceneInfo scene = 8;
    JPFGHCPGHGO rogue_game_info = 9;
    MADEENABOKE ENPAICNLCMK = 10;
}
