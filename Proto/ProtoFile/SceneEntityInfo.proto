syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "MotionInfo.proto";
import "SceneActorInfo.proto";
import "SceneNpcInfo.proto";
import "SceneNpcMonsterInfo.proto";
import "ScenePropInfo.proto";
import "SceneSummonUnitInfo.proto";

message SceneEntityInfo {
    uint32 entity_id = 8;
    uint32 inst_id = 10;
    MotionInfo motion = 12;
    uint32 group_id = 15;
    oneof entity {
        SceneActorInfo actor = 13;
        SceneNpcMonsterInfo npc_monster = 14;
        SceneNpcInfo npc = 6;
        ScenePropInfo prop = 7;
        SceneSummonUnitInfo summon_unit = 1;
    }
}
