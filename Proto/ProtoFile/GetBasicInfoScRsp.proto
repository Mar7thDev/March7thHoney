syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "PlayerSettingInfo.proto";

message GetBasicInfoScRsp {
    PlayerSettingInfo player_setting_info = 7;
    uint32 gender = 6;
    uint32 week_cocoon_finished_count = 8;
    int64 next_recover_time = 9;
    int64 last_set_nickname_time = 2;
    uint32 gameplay_birthday = 5;
    uint32 retcode = 3;
    uint32 exchange_times = 4;
    bool is_gender_set = 11;
    uint32 cur_day = 12;
}
