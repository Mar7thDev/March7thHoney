syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "PlayerSettingInfo.proto";

message GetBasicInfoScRsp {
    uint32 exchange_times = 1;
    uint32 gameplay_birthday = 2;
    bool is_gender_set = 4;
    uint32 week_cocoon_finished_count = 5;
    uint32 gender = 7;
    int64 last_set_nickname_time = 9;
    uint32 retcode = 10;
    uint32 cur_day = 11;
    PlayerSettingInfo player_setting_info = 12;
    int64 next_recover_time = 13;
}
