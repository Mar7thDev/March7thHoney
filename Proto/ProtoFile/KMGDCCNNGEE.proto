    uint64 room_uid = 2;
    uint32 level_id = 3;
    uint32 GNAMNBDIEKG = 4;
    repeated OGHAIFPHMPE BJODJNFGMCB = 5;
    uint32 rank = 6;
    uint64 GAENFKKAKOI = 7;
    repeated OGHAIFPHMPE ALHIONICLCM = 8;
