syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "AetherAvatarInfo.proto";
import "BattleBuff.proto";
import "SceneMonsterWave.proto";

message AetherDivideBattleInfo {
    repeated BattleBuff buff_list = 3;
    repeated AetherAvatarInfo battle_avatar_list = 10;
    repeated SceneMonsterWave monster_wave_list = 14;
    uint32 battle_id = 11;
    uint32 stage_id = 12;
    bool IMEKCMNFLDI = 1;
    uint32 logic_random_seed = 13;
}
