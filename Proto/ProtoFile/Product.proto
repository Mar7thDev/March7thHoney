syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ProductGiftType.proto";

message Product {
    uint32 ENCDABOOIKJ = 1;
    int64 end_time = 2;
    uint32 CLDELMPNAPB = 3;
    string price_tier = 4;
    int64 begin_time = 5;
    string product_id = 7;
    bool double_reward = 8;
    ProductGiftType gift_type = 10;
    uint32 EMIHEDNKBCA = 15;
}
