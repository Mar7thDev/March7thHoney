syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "BAKAELIMIJI.proto";
import "GPPKIMDCPBM.proto";

message MonopolyActionResult {
    GPPKIMDCPBM detail = 15;
    BAKAELIMIJI source_type = 13;
    uint32 trigger_cell_id = 6;
    uint32 click_cell_id = 3;
    uint32 effect_type = 11;
    uint32 click_map_id = 4;
    uint32 trigger_map_id = 12;
}
