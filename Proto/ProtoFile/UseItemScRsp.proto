syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ItemList.proto";

message UseItemScRsp {
    uint32 use_item_id = 2;
    uint32 formula_id = 5;
    uint64 month_card_out_date_time = 10;
    ItemList return_data = 12;
    uint32 use_item_count = 14;
    uint32 retcode = 15;
}
