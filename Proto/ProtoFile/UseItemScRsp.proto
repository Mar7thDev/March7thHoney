syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ItemList.proto";

message UseItemScRsp {
    ItemList return_data = 15;
    uint64 month_card_out_date_time = 7;
    uint32 use_item_count = 9;
    uint32 formula_id = 2;
    uint32 retcode = 14;
    uint32 use_item_id = 1;
}
