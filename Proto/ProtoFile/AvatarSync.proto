syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "Avatar.proto";
import "AvatarPathData.proto";

message AvatarSync {
    repeated Avatar avatar_list = 6;
    repeated AvatarPathData avatar_path_data_info_list = 14;
}
