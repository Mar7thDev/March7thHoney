syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "GachaCeiling.proto";
import "ItemList.proto";

message ExchangeGachaCeiling {
    uint32 retcode = 2;
    ItemList transfer_item_list = 3;
    GachaCeiling gacha_ceiling = 6;
    uint32 gacha_type = 8;
    uint32 avatar_id = 9;
}
