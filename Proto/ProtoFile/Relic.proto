syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "RelicAffix.proto";

message Relic {
    uint32 unique_id = 1;
    repeated RelicAffix sub_affix_list = 2;
    bool is_discarded = 3;
    repeated RelicAffix reforge_sub_affix_list = 4;
    uint32 main_affix_id = 6;
    uint32 level = 7;
    uint32 tid = 8;
    bool is_protected = 10;
    uint32 dress_avatar_id = 11;
    uint32 exp = 13;
    repeated RelicAffix preview_sub_affix_list = 14;
    uint32 reforge_block_sub_affix_id = 15;
}
