syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "RelicAffix.proto";

message Relic {
    repeated RelicAffix reforge_sub_affix_list = 10;
    repeated RelicAffix HGNPLIBNHHG = 2;
    repeated RelicAffix sub_affix_list = 14;
    uint32 tid = 3;
    uint32 unique_id = 15;
    bool is_protected = 9;
    bool is_discarded = 12;
    uint32 dress_avatar_id = 6;
    uint32 main_affix_id = 13;
    uint32 reforge_block_sub_affix_id = 8;
    uint32 level = 7;
    uint32 exp = 1;
}
