syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "AvatarSkillTree.proto";
import "DisplayEquipmentInfo.proto";
import "DisplayRelicInfo.proto";

message DisplayAvatarDetailInfo {
    DisplayEquipmentInfo equipment = 5;
    repeated AvatarSkillTree skilltree_list = 8;
    repeated DisplayRelicInfo relic_list = 1;
    uint32 pos = 3;
    uint32 rank = 4;
    uint32 avatar_type = 11;
    uint32 exp = 15;
    uint32 avatar_id = 14;
    uint32 enhanced_id = 9;
    uint32 level = 6;
    uint32 dressed_skin_id = 7;
    uint32 promotion = 2;
}
