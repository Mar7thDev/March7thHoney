syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "AvatarSkillTree.proto";
import "DisplayEquipmentInfo.proto";
import "DisplayRelicInfo.proto";

message DisplayAvatarDetailInfo {
    uint32 enhanced_id = 1;
    uint32 rank = 2;
    uint32 pos = 3;
    uint32 dressed_skin_id = 5;
    repeated AvatarSkillTree skilltree_list = 6;
    uint32 exp = 7;
    DisplayEquipmentInfo equipment = 8;
    repeated DisplayRelicInfo relic_list = 9;
    uint32 avatar_type = 11;
    uint32 promotion = 12;
    uint32 avatar_id = 13;
    uint32 level = 14;
}
