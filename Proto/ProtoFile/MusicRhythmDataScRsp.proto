syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "MusicRhythmGroup.proto";
import "MusicRhythmLevel.proto";

message MusicRhythmDataScRsp {
    repeated uint32 unlock_track_list = 12;
    repeated MusicRhythmLevel level_data_list = 10;
    repeated uint32 unlock_phase_list = 9;
    repeated MusicRhythmGroup music_group = 13;
    repeated uint32 unlock_song_list = 2;
    uint32 cur_song_id = 14;
    bool show_hint = 15;
    uint32 cur_level_id = 3;
    uint32 retcode = 4;
}
