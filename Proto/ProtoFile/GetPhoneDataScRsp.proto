syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message GetPhoneDataScRsp {
    repeated uint32 owned_phone_cases = 1;
    uint32 retcode = 2;
    uint32 cur_phone_theme = 3;
    repeated uint32 owned_phone_themes = 6;
    uint32 cur_phone_case = 10;
    uint32 cur_chat_bubble = 11;
    repeated uint32 owned_chat_bubbles = 14;
}
