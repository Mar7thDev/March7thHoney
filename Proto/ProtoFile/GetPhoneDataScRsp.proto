syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message GetPhoneDataScRsp {
    repeated uint32 owned_chat_bubbles = 10;
    repeated uint32 owned_phone_cases = 9;
    repeated uint32 owned_phone_themes = 2;
    uint32 cur_phone_case = 12;
    uint32 cur_chat_bubble = 6;
    uint32 cur_phone_theme = 3;
    uint32 retcode = 7;
}
