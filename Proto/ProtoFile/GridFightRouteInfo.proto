syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "GridFightEncounterInfo.proto";

message GridFightRouteInfo {
    uint32 fight_camp_id = 2;
    uint32 elite_branch_id = 7;
    repeated GridFightEncounterInfo route_encounter_list = 12;
}
