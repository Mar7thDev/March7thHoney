syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "AreaDynamicInfo.proto";
import "AreaStepInfo.proto";

message TrainPartyArea {
    repeated uint32 verify_step_id_list = 11;
    repeated AreaDynamicInfo dynamic_info = 8;
    AreaStepInfo area_step_info = 2;
    repeated uint32 step_id_list = 5;
    repeated uint32 static_prop_id_list = 3;
    uint32 area_id = 12;
    uint32 progress = 4;
}
