syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "AreaDynamicInfo.proto";
import "AreaStepInfo.proto";

message TrainPartyArea {
    repeated AreaDynamicInfo dynamic_info = 1;
    AreaStepInfo area_step_info = 3;
    repeated uint32 verify_step_id_list = 8;
    uint32 progress = 11;
    uint32 area_id = 13;
    repeated uint32 step_id_list = 14;
    repeated uint32 static_prop_id_list = 15;
}
