syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "GMFMPPKAEHE.proto";
import "LineupInfo.proto";
import "SceneInfo.proto";

message RaidKickByServer {
    LineupInfo lineup = 3;
    uint32 world_level = 5;
    uint32 raid_id = 7;
    GMFMPPKAEHE reason = 9;
    SceneInfo scene = 15;
}
