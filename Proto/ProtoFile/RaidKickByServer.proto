syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "GMFMPPKAEHE.proto";
import "LineupInfo.proto";
import "SceneInfo.proto";

message RaidKickByServer {
    LineupInfo lineup = 13;
    SceneInfo scene = 3;
    uint32 world_level = 5;
    uint32 raid_id = 10;
    GMFMPPKAEHE reason = 12;
}
