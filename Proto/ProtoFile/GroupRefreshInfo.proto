syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "AKEKCKDIHLA.proto";
import "SceneEntityGroupInfo.proto";
import "SceneEntityRefreshInfo.proto";
import "SceneGroupRefreshType.proto";

message GroupRefreshInfo {
    uint32 group_id = 8;
    SceneGroupRefreshType refresh_type = 10;
    SceneEntityGroupInfo group_info = 11;
    repeated SceneEntityRefreshInfo refresh_entity = 12;
    repeated AKEKCKDIHLA CDMKBCHLPAB = 13;
    uint32 state = 14;
}
