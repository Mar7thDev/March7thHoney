syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "GridFightSyncData.proto";
import "GridFightUpdateSrcType.proto";

message GridFightSyncResultData {
    repeated GridFightSyncData update_dynamic_list = 4;
    repeated uint32 sync_effect_param_list = 7;
    GridFightUpdateSrcType grid_update_src = 13;
}
