syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "BattleAvatar.proto";
import "BattleBuff.proto";
import "BattleGridFightSpecialBattleInfo.proto";
import "BattleMonsterWave.proto";
import "BattleRogueMagicInfo.proto";
import "BattleTargetList.proto";
import "EDCFKACPFNB.proto";
import "KIAICMELIMM.proto";
import "OJCBOMCCPDB.proto";
import "PKPFAHEBJIO.proto";

message DBCBMJKOBPJ {
    OJCBOMCCPDB EIGMKOJOEEI = 16;
    map<uint32, BattleTargetList> battle_target_info = 9;
    repeated BattleAvatar EEIPNLJNJAL = 11;
    repeated BattleBuff buff_list = 3;
    BattleRogueMagicInfo battle_rogue_magic_info = 14;
    repeated BattleAvatar avatar_list = 1;
    BattleGridFightSpecialBattleInfo PMCEKILFBIO = 12;
    PKPFAHEBJIO LDPLAOHNLAP = 15;
    KIAICMELIMM DFABBGKGDEI = 13;
    repeated BattleMonsterWave monster_wave_list = 2;
    EDCFKACPFNB FGOAKDCBIOE = 10;
    uint32 world_level = 7;
}
