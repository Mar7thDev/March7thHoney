syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "PileItem.proto";

message ItemCost {
    oneof item {
        uint32 equipment_unique_id = 8;
        PileItem pile_item = 11;
        uint32 relic_unique_id = 13;
    }
}
