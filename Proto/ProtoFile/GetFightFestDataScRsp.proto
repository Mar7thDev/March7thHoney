syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "NPGGDOLMNIE.proto";

message GetFightFestDataScRsp {
    uint32 item_value = 3;
    repeated uint32 GIGPHJEBDFL = 8;
    uint32 retcode = 10;
    uint32 score_id = 13;
    repeated NPGGDOLMNIE challenge_list = 14;
}
