syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "BigDataRecommendType.proto";
import "EquipmentRecommend.proto";
import "GNBBDMBNNDJ.proto";
import "RelicRecommend.proto";

message GetBigDataRecommendScRsp {
    uint32 retcode = 10;
    BigDataRecommendType big_data_recommend_type = 9;
    bool has_recommand = 1;
    uint32 equip_avatar = 4;
    oneof OODKOEILJCD {
        EquipmentRecommend equipment_recommend = 13;
        RelicRecommend relic_recommend = 5;
        GNBBDMBNNDJ KHCMLINMGEN = 3;
    }
}
