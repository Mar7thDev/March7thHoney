syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ItemCostData.proto";

message ComposeSelectedRelicCsReq {
    ItemCostData wr_item_list = 13;
    repeated uint32 sub_affix_id_list = 6;
    ItemCostData compose_item_list = 15;
    uint32 count = 9;
    uint32 main_affix_id = 3;
    uint32 compose_id = 2;
    uint32 compose_relic_id = 5;
}
