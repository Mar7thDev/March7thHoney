syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ItemCostData.proto";

message ComposeSelectedRelicCsReq {
    ItemCostData wr_item_list = 1;
    uint32 count = 5;
    uint32 compose_id = 6;
    ItemCostData compose_item_list = 7;
    uint32 compose_relic_id = 10;
    repeated uint32 sub_affix_id_list = 11;
    uint32 main_affix_id = 13;
}
