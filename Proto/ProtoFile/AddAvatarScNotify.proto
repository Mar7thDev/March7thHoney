syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "AddAvatarSrcState.proto";
import "ItemList.proto";

message AddAvatarScNotify {
    ItemList reward = 1;
    AddAvatarSrcState src = 6;
    bool is_new = 7;
    uint32 base_avatar_id = 12;
}
