syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "HitMonsterBattleInfo.proto";
import "SceneBattleInfo.proto";

message SceneCastSkillScRsp {
    uint32 retcode = 1;
    repeated HitMonsterBattleInfo monster_battle_info = 6;
    SceneBattleInfo battle_info = 11;
    uint32 cast_entity_id = 14;
}
