syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "ItemList.proto";

message CakeRaceLikeFriendRankingInfoScRsp {
    uint32 teleport_id = 5;
    repeated uint32 HFJNDOAIDOP = 6;
    uint32 retcode = 8;
    ItemList reward_list = 15;
}
