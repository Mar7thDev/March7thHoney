syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message Avatar {
    uint32 promotion = 1;
    uint32 cur_multi_path_avatar_type = 2;
    uint32 level = 6;
    bool is_marked = 8;
    uint32 base_avatar_id = 10;
    repeated uint32 has_taken_promotion_reward_list = 11;
    uint32 equipment_unique_id = 13;
    uint64 first_met_time_stamp = 14;
    uint32 exp = 15;
}
