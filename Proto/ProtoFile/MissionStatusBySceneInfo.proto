syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "MainMissionCustomValue.proto";
import "Mission.proto";

message MissionStatusBySceneInfo {
    repeated Mission sub_mission_status_list = 1;
    repeated uint32 disabled_main_mission_id_list = 2;
    repeated uint32 unfinished_main_mission_id_list = 4;
    repeated MainMissionCustomValue JLMGBADJBKN = 5;
