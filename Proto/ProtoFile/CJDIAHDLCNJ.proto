syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "GOFFDNPBHIK.proto";

message CJDIAHDLCNJ {
    uint32 uid = 1;
    uint32 damage_hp = 2;
    bool is_final_hit = 3;
    uint32 over_kill_damage_hp = 4;
    string battle_replay_key = 5;
    repeated GOFFDNPBHIK avatar_list = 6;
    uint32 assist_score = 7;
    uint32 damage_score = 8;
    uint32 final_hit_score = 9;
}
