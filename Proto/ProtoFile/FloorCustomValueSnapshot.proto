syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "BLLDKABGKLF.proto";

message FloorCustomValueSnapshot {
    string name = 1;
    BLLDKABGKLF type = 2;
    bool bool_val = 3;
    float float_val = 4;
    string str_val = 5;
}
