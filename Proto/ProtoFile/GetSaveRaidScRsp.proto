syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "RaidTargetInfo.proto";

message GetSaveRaidScRsp {
    uint32 world_level = 1;
    repeated RaidTargetInfo raid_target_info = 3;
    bool is_save = 5;
    uint32 retcode = 7;
    uint32 raid_id = 9;
}
