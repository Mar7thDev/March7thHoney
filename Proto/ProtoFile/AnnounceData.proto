syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message AnnounceData {
    uint32 config_id = 2;
    int64 begin_time = 3;
    bool has_recommand = 6;
    uint32 banner_frequency = 8;
    int64 end_time = 10;
    bool BBEBEKFGMAD = 11;
    string emergency_text = 12;
    string banner_text = 15;
}
