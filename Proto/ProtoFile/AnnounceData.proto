syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

message AnnounceData {
    string emergency_text = 2;
    int64 begin_time = 3;
    uint32 MPPDNHNPFEN = 4;
    uint32 config_id = 5;
    int64 end_time = 6;
    string AEDGENKIEPB = 8;
    uint32 banner_frequency = 11;
    string banner_text = 13;
    bool has_recommand = 14;
    bool LHLEAGCJPFC = 15;
}
