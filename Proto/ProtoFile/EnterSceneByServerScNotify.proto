syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "EnterSceneReason.proto";
import "LineupInfo.proto";
import "SceneInfo.proto";

message EnterSceneByServerScNotify {
    LineupInfo lineup = 3;
    SceneInfo scene = 9;
    EnterSceneReason reason = 12;
}
