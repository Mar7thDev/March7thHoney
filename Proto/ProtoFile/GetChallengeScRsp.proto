syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Challenge.proto";
import "ChallengeGroup.proto";
import "ChallengeHistoryMaxLevel.proto";
import "FMDAAIKLAJA.proto";

message GetChallengeScRsp {
    repeated ChallengeGroup challenge_group_list = 1;
    repeated FMDAAIKLAJA KKIAFPFKLGE = 6;
    repeated Challenge challenge_list = 10;
    repeated ChallengeHistoryMaxLevel max_level_list = 11;
