syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "MainMission.proto";
import "Mission.proto";

message GetMissionDataScRsp {
    repeated Mission mission_list = 13;
    repeated uint32 KBDGNGMPFEH = 4;
    repeated MainMission main_mission_list = 5;
    uint32 GKFPKBGJBGN = 10;
    uint32 track_mission_id = 15;
    uint32 retcode = 12;
}
