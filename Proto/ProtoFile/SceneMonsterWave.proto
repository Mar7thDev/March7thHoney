syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ItemList.proto";
import "SceneMonster.proto";
import "SceneMonsterWaveParam.proto";

message SceneMonsterWave {
    repeated ItemList NMGIABHIJJB = 3;
    uint32 battle_wave_id = 8;
    uint32 battle_stage_id = 12;
    repeated SceneMonster monster_list = 13;
    SceneMonsterWaveParam monster_param = 15;
}
