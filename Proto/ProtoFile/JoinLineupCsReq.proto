syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "AvatarType.proto";
import "ExtraLineupType.proto";

message JoinLineupCsReq {
    ExtraLineupType extra_lineup_type = 14;
    uint32 index = 1;
    uint32 plane_id = 9;
    uint32 slot = 4;
    AvatarType avatar_type = 11;
    bool is_virtual = 10;
    uint32 base_avatar_id = 3;
}
