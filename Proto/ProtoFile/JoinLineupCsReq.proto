syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "AvatarType.proto";
import "ExtraLineupType.proto";

message JoinLineupCsReq {
    ExtraLineupType extra_lineup_type = 1;
    uint32 slot = 5;
    uint32 base_avatar_id = 8;
    uint32 index = 10;
    uint32 plane_id = 12;
    AvatarType avatar_type = 13;
}
