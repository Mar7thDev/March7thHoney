syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "RegionInfo.proto";

message Dispatch {
    uint32 retcode = 1;
    string msg = 2;
    string top_sever_region_name = 3;
    repeated RegionInfo region_list = 4;
    string FKCEHMPIAGG = 5;
}
