syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message SceneSummonUnitInfo {
    repeated string trigger_name_list = 14;
    uint32 caster_entity_id = 3;
    uint32 attach_entity_id = 9;
    uint64 create_time_ms = 8;
    int32 life_time_ms = 6;
    uint32 summon_unit_id = 2;
}
