syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ExtraLineupType.proto";
import "LineupAvatar.proto";

message LineupInfo {
    repeated uint32 GOFLIGGNHNE = 8;
    string name = 12;
    repeated LineupAvatar avatar_list = 1;
    repeated uint32 NCLJLLNGDCI = 3;
    repeated uint32 story_line_avatar_id_list = 7;
    bool is_virtual = 9;
    bool ABHONGJHICF = 4;
    ExtraLineupType extra_lineup_type = 15;
    uint32 game_story_line_id = 6;
    uint32 mp = 11;
    uint32 index = 14;
    uint32 leader_slot = 2;
    uint32 plane_id = 13;
    uint32 max_mp = 10;
}
