syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "ChatType.proto";
import "MessageChatData.proto";

message SendMsgCsReq {
    MessageChatData message_datas = 8;
    repeated uint32 target_list = 9;
    ChatType chat_type = 13;
}
