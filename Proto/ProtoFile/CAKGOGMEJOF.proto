syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "CBELDECDCCI.proto";
import "PMNGJCDCGMM.proto";

message CAKGOGMEJOF {
    repeated PMNGJCDCGMM message_datas = 1;
    map<uint32, uint32> BLMPNONPLNI = 2;
    repeated CBELDECDCCI OMBLPOCHCHM = 3;
    uint32 area_id = 4;
    uint32 difficulty_level = 5;
}
