syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "BLKGDGAPBKC.proto";
import "FightFestType.proto";

message StartFightFestCsReq {
    repeated BLKGDGAPBKC avatar_list = 3;
    uint32 id = 4;
    FightFestType type = 5;
    uint32 event_id = 8;
    repeated uint32 GIGPHJEBDFL = 10;
}
