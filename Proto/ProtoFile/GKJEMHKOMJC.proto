syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "FateMasterStatusType.proto";
import "JOGCCINEHFJ.proto";

message GKJEMHKOMJC {
    uint32 rank = 5;
    int32 hp = 7;
    repeated JOGCCINEHFJ CFFCNEDGCJJ = 8;
    FateMasterStatusType status = 9;
    uint32 avatar_id = 11;
    int32 max_hp = 14;
}
