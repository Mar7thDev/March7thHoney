syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "SceneIdentifier.proto";
import "Vector.proto";

message EnterSceneCsReq {
    Vector IDABOKLJOLG = 8;
    SceneIdentifier scene_identifier = 10;
    bool FBPKOFOIOLC = 9;
    bool is_close_map = 12;
    uint32 entry_id = 2;
    uint64 interact_id = 3;
    uint32 teleport_id = 15;
}
