syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message BuffInfo {
    uint32 buff_id = 1;
    uint32 level = 4;
    uint32 base_avatar_id = 5;
    uint32 count = 6;
    uint32 buff_summon_entity_id = 8;
    map<string, float> dynamic_values = 10;
    uint64 add_time_ms = 12;
    float life_time = 13;
}
