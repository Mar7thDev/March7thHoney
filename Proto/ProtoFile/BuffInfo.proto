syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message BuffInfo {
    map<string, float> dynamic_values = 5;
    uint32 buff_id = 14;
    uint32 buff_summon_entity_id = 11;
    uint64 add_time_ms = 15;
    uint32 count = 10;
    uint32 level = 3;
    float life_time = 4;
    uint32 base_avatar_id = 9;
}
