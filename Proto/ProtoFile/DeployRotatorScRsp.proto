syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "RotaterData.proto";
import "RotaterEnergyInfo.proto";

message DeployRotatorScRsp {
    RotaterData rotater_data = 3;
    RotaterEnergyInfo energy_info = 13;
    uint32 retcode = 15;
}
