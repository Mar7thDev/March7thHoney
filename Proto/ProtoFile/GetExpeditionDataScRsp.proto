syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "ExpeditionInfo.proto";

message GetExpeditionDataScRsp {
    int64 KAMBBFDEBAM = 6;
    repeated ExpeditionInfo expedition_info = 7;
    uint32 retcode = 9;
    uint32 total_expedition_count = 12;
    repeated uint32 NBKFAEDOGPG = 13;
}
