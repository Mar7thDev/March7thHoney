syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "PropExtraInfo.proto";

message ScenePropInfo {
    uint32 prop_state = 1;
    repeated string trigger_name_list = 3;
    PropExtraInfo extra_info = 8;
    uint64 create_time_ms = 10;
    uint32 life_time_ms = 12;
    uint32 prop_id = 13;
}
