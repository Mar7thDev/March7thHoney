syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "MessageItem.proto";
import "MessageSectionStatus.proto";

message MessageSection {
    repeated uint32 message_item_list = 7;
    repeated MessageItem item_list = 3;
    uint32 frozen_item_id = 11;
    uint32 id = 12;
    MessageSectionStatus status = 1;
}
