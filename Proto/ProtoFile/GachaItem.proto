syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "Item.proto";
import "ItemList.proto";

message GachaItem {
    bool is_new = 6;
    ItemList token_item = 7;
    ItemList transfer_item_list = 12;
    Item gacha_item = 13;
}
