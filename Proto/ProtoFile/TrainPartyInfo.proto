syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "GAGGCODGDLB.proto";
import "HELJNONBKPH.proto";
import "OIIPJFDNPAH.proto";
import "TrainPartyArea.proto";

message TrainPartyInfo {
    uint32 star_num = 1;
    repeated GAGGCODGDLB MHABCMLHCGD = 2;
    uint32 JJGKIPDGOGP = 4;
    uint32 BHEJCEJHLIB = 5;
