syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "TeleportInfo.proto";

message SceneIdentifier {
    uint32 floor_id = 2;
    uint32 game_story_line_id = 6;
    uint32 content_id = 14;
    TeleportInfo teleport_info = 1621;
}
