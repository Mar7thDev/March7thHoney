syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ChallengeHistoryMaxLevel.proto";
import "CurChallenge.proto";
import "ItemList.proto";

message ChallengeSettleNotify {
    repeated uint32 KDIDCCOOJJC = 1;
    uint32 star = 2;
    ChallengeHistoryMaxLevel max_level = 6;
    bool is_win = 7;
    uint32 score_two = 8;
    uint32 challenge_id = 9;
    uint32 challenge_score = 12;
    ItemList reward = 14;
    CurChallenge cur_challenge = 15;
}
