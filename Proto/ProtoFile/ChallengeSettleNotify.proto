syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ChallengeHistoryMaxLevel.proto";
import "CurChallenge.proto";
import "ItemList.proto";

message ChallengeSettleNotify {
    ChallengeHistoryMaxLevel max_level = 14;
    repeated uint32 KDIDCCOOJJC = 2;
    CurChallenge cur_challenge = 13;
    ItemList reward = 4;
    uint32 challenge_score = 1;
    uint32 score_two = 9;
    uint32 challenge_id = 3;
    uint32 JIJBNNANAGP = 8;
    uint32 star = 6;
    bool is_win = 11;
}
