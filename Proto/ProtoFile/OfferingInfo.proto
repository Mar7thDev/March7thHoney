syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "OfferingState.proto";

message OfferingInfo {
    repeated uint32 has_taken_reward_id_list = 5;
    uint32 level_exp = 6;
    OfferingState offering_state = 4;
    uint32 offering_id = 1;
    uint32 total_exp = 14;
    uint32 offering_level = 13;
}
