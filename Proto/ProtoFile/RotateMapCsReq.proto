syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "MotionInfo.proto";
import "RotateMapInfo.proto";

message RotateMapCsReq {
    MotionInfo motion = 2;
    uint32 group_id = 4;
    RotateMapInfo AMMJECHPGPE = 6;
    uint32 PBOLMBLKDND = 14;
}
