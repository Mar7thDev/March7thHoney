syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

message Equipment {
    uint32 promotion = 3;
    uint32 dress_avatar_id = 4;
    uint32 exp = 5;
    uint32 level = 7;
    bool is_protected = 8;
    uint32 rank = 10;
    uint32 unique_id = 11;
    uint32 tid = 12;
}
