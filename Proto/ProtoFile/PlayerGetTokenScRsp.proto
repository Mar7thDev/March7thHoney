syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "BlackInfo.proto";

message PlayerGetTokenScRsp {
    string stop_desc = 1;
    string authkey = 2;
    uint32 retcode = 7;
    uint64 secret_key_seed = 8;
    uint32 uid = 11;
    BlackInfo black_info = 14;
}
