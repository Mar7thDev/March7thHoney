syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ChallengeStageInfo.proto";

message Challenge {
    uint32 record_id = 1;
    uint32 score_id = 2;
    bool HGPKMHFPMBJ = 4;
    uint32 challenge_id = 5;
    uint32 taken_reward = 9;
    uint32 star = 11;
    ChallengeStageInfo stage_info = 14;
    uint32 score_two = 15;
}
