syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "DisplayAvatarVec.proto";
import "HeadFrameInfo.proto";
import "HeadIconData.proto";

message GetPlayerBoardDataScRsp {
    repeated uint32 unlocked_personal_card_list = 10;
    string signature = 12;
    repeated uint32 assist_avatar_id_list = 8;
    repeated HeadIconData unlocked_head_icon_list = 4;
    HeadFrameInfo head_frame_info = 5;
    DisplayAvatarVec display_avatar_vec = 2;
    uint32 current_head_icon_id = 13;
    uint32 current_personal_card_id = 7;
    uint32 retcode = 15;
}
