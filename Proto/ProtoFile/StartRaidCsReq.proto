syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "AvatarIdentifier.proto";

message StartRaidCsReq {
    uint32 is_save = 3;
    uint32 world_level = 4;
    uint32 prop_entity_id = 5;
    uint32 raid_id = 7;
    repeated uint32 avatar_list = 11;
    repeated AvatarIdentifier NIMDEPFJJNI = 12;
}
