syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "AvatarIdentifier.proto";

message StartRaidCsReq {
    repeated AvatarIdentifier NIMDEPFJJNI = 9;
    repeated uint32 avatar_list = 4;
    uint32 raid_id = 15;
    uint32 world_level = 11;
    uint32 is_save = 5;
    uint32 prop_entity_id = 6;
}
