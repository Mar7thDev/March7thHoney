syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "AreaDynamicInfo.proto";
import "PPECMOMNAMG.proto";

message TrainPartyBuildDiyScRsp {
    uint32 area_id = 4;
