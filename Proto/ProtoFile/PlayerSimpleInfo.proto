syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "AssistSimpleInfo.proto";
import "CJLCPMDGIBO.proto";
import "FriendOnlineStatus.proto";
import "HeadFrameInfo.proto";
import "PlatformType.proto";

message PlayerSimpleInfo {
    bool is_banned = 1;
    uint32 chat_bubble_id = 2;
    string signature = 3;
    string nickname = 4;
    uint32 head_icon = 5;
    uint32 personal_card = 6;
    CJLCPMDGIBO player_outfit_data = 7;
    uint32 level = 8;
    string platform_nick = 9;
    FriendOnlineStatus online_status = 10;
    repeated AssistSimpleInfo assist_simple_info_list = 11;
    uint32 uid = 12;
    string platform_uuid = 13;
    int64 last_active_time = 14;
    PlatformType platform = 15;
    uint32 gender = 48;
    HeadFrameInfo head_frame_info = 837;
    int64 update_time = 1034;
}
