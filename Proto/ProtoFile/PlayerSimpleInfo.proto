syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "AssistSimpleInfo.proto";
import "CJLCPMDGIBO.proto";
import "FriendOnlineStatus.proto";
import "HeadFrameInfo.proto";
import "PlatformType.proto";

message PlayerSimpleInfo {
    repeated AssistSimpleInfo assist_simple_info_list = 6;
    string signature = 5;
    HeadFrameInfo head_frame_info = 1049;
    CJLCPMDGIBO player_outfit_data = 1;
    string platform_nick = 3;
    string nickname = 8;
    string platform_uuid = 15;
    uint32 level = 9;
    int64 last_active_time = 13;
    uint32 gender = 115;
    FriendOnlineStatus online_status = 10;
    uint32 uid = 7;
    uint32 personal_card = 11;
    PlatformType platform = 14;
    uint32 chat_bubble_id = 4;
    uint32 head_icon = 2;
    bool is_banned = 12;
    int64 update_time = 797;
}
