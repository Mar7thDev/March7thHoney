syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "SceneBattleInfo.proto";

message StartCocoonStageScRsp {
    uint32 retcode = 3;
    uint32 prop_entity_id = 4;
    uint32 cocoon_id = 5;
    uint32 wave = 6;
    SceneBattleInfo battle_info = 9;
    uint32 challenge_cnt = 10;
}
