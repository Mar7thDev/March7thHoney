syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "SceneBattleInfo.proto";

message StartCocoonStageScRsp {
    SceneBattleInfo battle_info = 7;
    uint32 wave = 4;
    uint32 retcode = 9;
    uint32 prop_entity_id = 2;
    uint32 cocoon_id = 15;
    uint32 challenge_cnt = 1;
}
