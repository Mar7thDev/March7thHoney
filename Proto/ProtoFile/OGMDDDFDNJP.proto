syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "DPDDLAOBMBH.proto";

message OGMDDDFDNJP {
    uint32 unique_id = 4;
    uint32 retcode = 10;
    oneof BPIHFAJCLOC {
        string name = 3;
        DPDDLAOBMBH relic_list = 8;
    }
}
