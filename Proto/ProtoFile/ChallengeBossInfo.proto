syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "AvatarIdentifier.proto";
import "ChallengeBossAvatarRelicInfo.proto";
import "ChallengeBossEquipmentInfo.proto";
import "ChallengeBossSingleNodeInfo.proto";

message ChallengeBossInfo {
    bool unk1 = 3;
    repeated AvatarIdentifier avatar_lineup_first = 5;
    ChallengeBossSingleNodeInfo second_node = 6;
    repeated AvatarIdentifier avatar_lineup_second = 8;
    map<uint32, ChallengeBossAvatarRelicInfo> challenge_avatar_relic_map = 10;
    ChallengeBossSingleNodeInfo first_node = 11;
    map<uint32, ChallengeBossEquipmentInfo> challenge_avatar_equipment_map = 12;
}
