syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

message RegionInfo {
    string name = 1;
    string title = 2;
    string dispatch_url = 3;
    string env_type = 4;
    string display_name = 5;
    string stop_desc = 6;
    string MPDILONJDEH = 7;
}
