syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "GridFightCurrentTask.proto";

message GridFightTutorialSyncInfo {
    oneof KCOCCGEOECO {
        GridFightCurrentTask current_task = 9;
        uint32 start_grid_fight_tutorial_id = 10;
        uint32 finish_grid_fight_tutorial_id = 11;
    }
}
