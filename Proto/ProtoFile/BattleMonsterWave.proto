syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "BattleMonster.proto";
import "BattleMonsterParam.proto";

message BattleMonsterWave {
    repeated BattleMonster monster_list = 1;
    BattleMonsterParam monster_param = 2;
    uint32 battle_stage_id = 3;
    uint32 battle_wave_id = 4;
}
