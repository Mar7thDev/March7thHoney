syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "HLJMCIBOBJO.proto";
import "SpBarInfo.proto";

message AetherAvatarInfo {
    uint32 id = 1;
    uint32 index = 2;
    uint32 promotion = 3;
    repeated uint32 OKMFEGDIONG = 4;
    HLJMCIBOBJO KBNCLFCGHCK = 5;
    SpBarInfo sp_bar = 6;
}
