syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "ChargerInfo.proto";
import "RotaterEnergyInfo.proto";

message InteractChargerScRsp {
    ChargerInfo charger_info = 8;
    RotaterEnergyInfo energy_info = 10;
    uint32 retcode = 15;
}
