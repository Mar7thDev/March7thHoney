syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ChallengePeakRewardGroup.proto";

message ChallengePeakSettleScNotify {
    repeated uint32 finished_target_list = 2;
    repeated ChallengePeakRewardGroup peak_reward_group_list = 15;
    bool is_unlock_easy_boss = 12;
    bool hard_mode_has_passed = 10;
    bool is_boss_target_better = 6;
    bool is_wait_confirm = 8;
    uint32 turn_left = 14;
    uint32 cycles_used = 11;
    bool is_first_pass = 9;
    bool is_win = 4;
    uint32 peak_id = 5;
}
