syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "BattleEndStatus.proto";
import "BattleOp.proto";
import "BattleStatistics.proto";

message PVEBattleResultCsReq {
    map<string, uint32> LJJEOOJCEOG = 7;
    BattleStatistics stt = 15;
    bytes turn_snapshot_hash = 2;
    string debug_extra_info = 4;
    repeated BattleOp op_list = 1;
    uint32 client_res_version = 13;
    uint32 stage_id = 8;
    uint32 cost_time = 9;
    uint32 NIBMFCFBHEP = 14;
    uint32 LGOJDHLMGEN = 12;
    bool LGJMMJEFGNK = 6;
    bool NNGDLOHALCN = 10;
    bool DKIDHMAOMJB = 11;
    BattleEndStatus end_status = 3;
    uint32 battle_id = 5;
}
