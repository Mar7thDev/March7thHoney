syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "BattleEndStatus.proto";
import "BattleOp.proto";
import "BattleStatistics.proto";

message PVEBattleResultCsReq {
    uint32 LGOJDHLMGEN = 1;
    map<string, uint32> LJJEOOJCEOG = 2;
    string debug_extra_info = 3;
    uint32 stage_id = 4;
    uint32 battle_id = 5;
    bool LGJMMJEFGNK = 6;
    repeated BattleOp op_list = 7;
    bool DKIDHMAOMJB = 8;
    bool NNGDLOHALCN = 9;
    uint32 NIBMFCFBHEP = 10;
    BattleEndStatus end_status = 11;
    uint32 cost_time = 12;
    uint32 client_res_version = 13;
    BattleStatistics stt = 14;
    bytes turn_snapshot_hash = 15;
}
