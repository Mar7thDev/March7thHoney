syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "ItemList.proto";

message BuyGoodsScRsp {
    uint32 goods_id = 3;
    uint32 goods_buy_times = 4;
    ItemList return_item_list = 6;
    uint32 retcode = 7;
    uint32 shop_id = 11;
}
