syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ChallengeCurBuffInfo.proto";
import "ChallengeStatus.proto";
import "ExtraLineupType.proto";
import "KillMonster.proto";

message CurChallenge {
    ExtraLineupType extra_lineup_type = 1;
    uint32 challenge_id = 2;
    uint32 score_two = 5;
    ChallengeStatus status = 6;
    uint32 dead_avatar_num = 7;
    repeated KillMonster kill_monster_list = 9;
    ChallengeCurBuffInfo stage_info = 10;
    uint32 round_count = 12;
    uint32 score_id = 13;
}
