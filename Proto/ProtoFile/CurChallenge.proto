syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ChallengeCurBuffInfo.proto";
import "ChallengeStatus.proto";
import "ExtraLineupType.proto";
import "KillMonster.proto";

message CurChallenge {
    repeated KillMonster kill_monster_list = 1;
    ChallengeCurBuffInfo stage_info = 11;
    uint32 round_count = 9;
    ExtraLineupType extra_lineup_type = 5;
    uint32 dead_avatar_num = 6;
    uint32 score_id = 14;
    uint32 challenge_id = 7;
    uint32 score_two = 8;
    ChallengeStatus status = 12;
}
