syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ChallengePeakBuild.proto";

message ChallengePeak {
    repeated uint32 finished_target_list = 8;
    repeated uint32 peak_avatar_id_list = 2;
    repeated ChallengePeakBuild peak_build_list = 10;
    bool has_passed = 3;
    uint32 cycles_used = 11;
    uint32 peak_id = 1;
}
