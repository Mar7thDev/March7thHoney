syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "EFEGKDHEMFN.proto";
import "PlanetFesQuestState.proto";

message GCACHJFLGHH {
    PlanetFesQuestState status = 2;
    uint32 progress = 5;
    uint32 quest_id = 10;
    uint32 OJBEACGLLOH = 14;
    oneof AGFCPGHPEDD {
        EFEGKDHEMFN CHFNLJPEENB = 1;
        uint32 KGAABCGGHNM = 11;
    }
}
