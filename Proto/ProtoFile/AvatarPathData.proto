syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "AvatarPathSkillTree.proto";
import "EquipRelic.proto";

message AvatarPathData {
    repeated AvatarPathSkillTree avatar_path_skill_tree = 9;
    repeated EquipRelic equip_relic_list = 11;
    uint32 unk_enhanced_id = 3;
    uint32 path_equipment_id = 14;
    uint64 unlock_timestamp = 6;
    uint32 rank = 2;
    uint32 avatar_id = 5;
    uint32 dressed_skin_id = 8;
}
