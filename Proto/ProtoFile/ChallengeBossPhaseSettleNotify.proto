syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "BattleTarget.proto";

message ChallengeBossPhaseSettleNotify {
    repeated BattleTarget battle_target_list = 1;
    bool AGAEPDNHPJC = 10;
    bool is_win = 6;
    bool is_second_half = 2;
    bool is_reward = 7;
    uint32 page_type = 12;
    uint32 phase = 4;
    uint32 challenge_score = 5;
    uint32 score_two = 11;
    uint32 challenge_id = 3;
    uint32 star = 14;
}
