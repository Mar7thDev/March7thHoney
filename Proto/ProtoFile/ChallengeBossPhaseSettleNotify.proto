syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "BattleTarget.proto";

message ChallengeBossPhaseSettleNotify {
    uint32 challenge_score = 2;
    uint32 star = 3;
    bool is_second_half = 4;
    bool AGAEPDNHPJC = 5;
    bool is_reward = 6;
    uint32 page_type = 8;
    uint32 phase = 10;
    bool is_win = 11;
    repeated BattleTarget battle_target_list = 12;
    uint32 challenge_id = 14;
    uint32 score_two = 15;
}
