syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "BGCEJDCHKBA.proto";
import "DENBKAOHBAM.proto";

message PMNGJCDCGMM {
    BGCEJDCHKBA type = 1;
    uint32 config_id = 2;
    uint32 unique_id = 3;
    uint32 level = 4;
    repeated DENBKAOHBAM switch_list = 5;
}
