syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "MotionInfo.proto";

message SceneEntityMoveScNotify {
    MotionInfo motion = 4;
    uint32 entry_id = 5;
    uint32 entity_id = 13;
    uint32 client_pos_version = 15;
}
