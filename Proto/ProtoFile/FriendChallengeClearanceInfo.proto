syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ChallengeBossStatistics.proto";
import "ChallengeStatistics.proto";
import "ChallengeStoryStatistics.proto";
import "PlayerChallengeTierceRecord.proto";

message FriendChallengeClearanceInfo {
    uint32 LMPPDGOFOMF = 4;
    PlayerChallengeTierceRecord MEGBIPBAFBP = 11;
    uint32 group_id = 14;
