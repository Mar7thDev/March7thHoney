syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

message HHHMMJBGCNG {
    double total_damage = 5;
    uint32 role_id = 7;
    repeated uint32 grid_fight_equipment_list = 8;
    uint32 role_star = 12;
    bool LDMNBDIDFCC = 13;
    bool HNLEDBPGDBC = 15;
}
