syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ClientMail.proto";

message GetMailScRsp {
    repeated ClientMail notice_mail_list = 9;
    repeated ClientMail mail_list = 3;
    uint32 start = 8;
    uint32 retcode = 11;
    uint32 total_num = 12;
    bool is_end = 14;
}
