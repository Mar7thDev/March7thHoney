syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "MessageGroupStatus.proto";
import "MessageSection.proto";

message MessageGroup {
    repeated MessageSection message_section_list = 10;
    int64 refresh_time = 15;
    uint32 message_section_id = 3;
    MessageGroupStatus status = 6;
    uint32 id = 14;
}
