syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "SceneBattleInfo.proto";

message QuickStartCocoonStageScRsp {
    uint32 cocoon_id = 3;
    uint32 wave = 4;
    SceneBattleInfo battle_info = 5;
    uint32 Count = 7;
    uint32 retcode = 14;
}
