syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "ChallengePeakBossClearance.proto";

message ChallengePeakBoss {
    uint32 LJGDCGBFNKN = 1;
    repeated uint32 finished_target_list = 2;
    ChallengePeakBossClearance hard_mode = 6;
    bool hard_mode_has_passed = 7;
    ChallengePeakBossClearance easy_mode = 14;
}
