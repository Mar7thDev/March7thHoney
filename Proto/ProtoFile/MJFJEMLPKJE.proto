syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "RelicAffix.proto";

message MJFJEMLPKJE {
    uint32 level = 1;
    uint32 exp = 3;
    uint32 main_affix_id = 7;
    uint32 tid = 13;
    repeated RelicAffix sub_affix_list = 15;
}
