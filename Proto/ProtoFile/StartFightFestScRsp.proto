syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "FightFestType.proto";
import "SceneBattleInfo.proto";

message StartFightFestScRsp {
    SceneBattleInfo battle_info = 6;
    uint32 id = 8;
    FightFestType type = 9;
    uint32 retcode = 11;
    uint32 event_id = 14;
}
