syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "BELNLOJAFCM.proto";
import "BuffInfo.proto";
import "CustomSaveData.proto";
import "HGNBPANECAL.proto";
import "HIEKLHPINHL.proto";
import "MissionStatusBySceneInfo.proto";
import "SceneEntityGroupInfo.proto";
import "SceneEntityInfo.proto";
import "SceneGroupState.proto";
import "SceneIdentifier.proto";

message SceneInfo {
    repeated SceneGroupState group_state_list = 1285;
    repeated CustomSaveData custom_data_list = 4;
    map<string, int32> floor_saved_data = 1245;
    repeated SceneEntityInfo entity_list = 2;
    MissionStatusBySceneInfo scene_mission_info = 804;
    BELNLOJAFCM FOJJGJPIMBL = 1146;
    repeated SceneEntityGroupInfo entity_group_list = 1150;
    repeated HGNBPANECAL CPIKFGPCOCE = 10;
    repeated uint32 opened_chests_list = 318;
    repeated uint32 lighten_section_list = 15;
    SceneIdentifier scene_identifier = 1777;
    repeated BuffInfo scene_buff_info_list = 14;
    map<uint32, HIEKLHPINHL> BIKBFGPFAAC = 3;
    uint32 plane_id = 1;
    uint32 dimension_id = 715;
    uint32 client_pos_version = 11;
    uint32 floor_id = 9;
    uint32 entry_id = 5;
    uint32 world_id = 6;
    uint32 content_id = 685;
    uint32 game_mode_type = 8;
    uint32 game_story_line_id = 1413;
    uint32 leader_entity_id = 7;
    uint64 interact_id = 909;
}
