syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "ExpeditionInfo.proto";
import "ItemList.proto";

message AcceptMultipleExpeditionScRsp {
    int64 KAMBBFDEBAM = 7;
    uint32 retcode = 11;
    repeated ItemList HALFGLGLDLO = 14;
    repeated ExpeditionInfo accept_multi_expedition = 15;
}
