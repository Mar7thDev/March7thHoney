syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "FJPONJFLOOH.proto";
import "GridFightShopGoodsInfo.proto";

message GridFightShopSyncInfo {
    uint32 GLIFNMBMMBL = 2;
    repeated GridFightShopGoodsInfo shop_goods_list = 5;
    FJPONJFLOOH LDEDGOOKHFL = 10;
    uint32 NDGMCJHKNIN = 11;
    bool shop_is_locked = 15;
}
