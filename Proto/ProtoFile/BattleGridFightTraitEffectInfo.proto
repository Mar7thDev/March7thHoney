syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "BattleGridFightTraitCoreRoleInfo.proto";
import "BattleGridFigntAvatarCoreRoleInfo.proto";
import "CPMNHNHKLBK.proto";
import "GridFightTraitEffectLevelInfo.proto";
import "KFMKBMJPEIC.proto";

message BattleGridFightTraitEffectInfo {
    uint32 effect_id = 1;
    oneof NEBNJDMFELO {
        BattleGridFightTraitCoreRoleInfo trait_core_role = 101;
        BattleGridFigntAvatarCoreRoleInfo avatar_core_info = 102;
        GridFightTraitEffectLevelInfo trait_effect_level_info = 103;
        KFMKBMJPEIC JLCLHAKNMLL = 104;
        CPMNHNHKLBK LFIDNOAECMN = 105;
    }
