syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

message MazeGroup {
    uint32 group_id = 4;
    bool is_need_refresh = 6;
    repeated uint32 destory_monster_config_id_list = 11;
    map<string, int32> property_map = 12;
    int64 modify_time = 15;
}
