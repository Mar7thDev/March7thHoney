syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "ClientDownloadData.proto";

message PlayerHeartBeatScRsp {
    ClientDownloadData download_data = 4;
    uint32 retcode = 8;
    uint64 client_time_ms = 9;
    uint64 server_time_ms = 14;
}
