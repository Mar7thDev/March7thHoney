syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "BGOMIHEFHPA.proto";
import "FPIBAIPJCMD.proto";
import "HeliobusChallengeLineup.proto";
import "ONBLLGHELOB.proto";

message HeliobusActivityDataScRsp {
    ONBLLGHELOB skill_info = 15;
    repeated FPIBAIPJCMD challenge_list = 12;
    repeated HeliobusChallengeLineup DJKMBPEFCKL = 6;
    repeated BGOMIHEFHPA AAHPCIOOLHB = 5;
    uint32 level = 11;
    uint32 IMGDMDDKHDL = 10;
    uint32 OMMNAFNIKPH = 13;
    uint32 phase = 9;
    uint32 AFMLOAPAAPM = 2;
    uint32 retcode = 14;
}
