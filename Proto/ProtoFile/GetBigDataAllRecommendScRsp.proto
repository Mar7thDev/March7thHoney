syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "BigDataRecommendAvatarRelic.proto";
import "BigDataRecommendRelicAvatar.proto";
import "BigDataRecommendType.proto";
import "GNBBDMBNNDJ.proto";

message GetBigDataAllRecommendScRsp {
    BigDataRecommendType big_data_recommend_type = 5;
    uint32 retcode = 9;
    oneof OODKOEILJCD {
        BigDataRecommendRelicAvatar relic_avatar = 1;
        BigDataRecommendAvatarRelic avatar_relic = 8;
        GNBBDMBNNDJ KHCMLINMGEN = 7;
    }
}
