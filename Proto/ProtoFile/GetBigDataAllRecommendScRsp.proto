syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "BigDataRecommendAvatarRelic.proto";
import "BigDataRecommendRelicAvatar.proto";
import "BigDataRecommendType.proto";
import "GNBBDMBNNDJ.proto";

message GetBigDataAllRecommendScRsp {
    BigDataRecommendType big_data_recommend_type = 13;
    uint32 retcode = 3;
    oneof OODKOEILJCD {
        BigDataRecommendRelicAvatar relic_avatar = 8;
        BigDataRecommendAvatarRelic avatar_relic = 1;
        GNBBDMBNNDJ KHCMLINMGEN = 4;
    }
}
