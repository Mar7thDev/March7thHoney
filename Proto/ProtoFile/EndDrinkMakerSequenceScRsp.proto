syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "ItemList.proto";
import "JLMCNJKMCFG.proto";
import "POHIEKPHMGH.proto";

message EndDrinkMakerSequenceScRsp {
    uint32 exp = 1;
    uint32 level = 2;
    ItemList reward = 3;
    repeated JLMCNJKMCFG DANFIBMHMND = 5;
    uint32 LPDMPNABBEN = 6;
    uint32 EDBOHDJDJAA = 7;
    uint32 retcode = 8;
    POHIEKPHMGH PDPMLDMOMPH = 11;
}
