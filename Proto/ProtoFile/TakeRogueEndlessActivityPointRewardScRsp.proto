syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "ItemList.proto";

message TakeRogueEndlessActivityPointRewardScRsp {
    ItemList reward = 1;
    bool OINMENFPODP = 2;
    uint32 NAGLJDCLGGB = 4;
    uint32 retcode = 5;
    repeated uint32 MOGBNJOHKLA = 9;
    uint32 level = 13;
}
