syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message HDKEPPDIDIH {
    uint32 avatar_id = 1;
    repeated uint32 EJDDMNAODEN = 2;
    uint32 source = 3;
    double damage = 4;
    repeated uint32 JNDBCDAIIDD = 5;
    int32 AFPKBFAPOAH = 6;
    double OELDAKBOPJA = 7;
    uint32 CNGEOGOMPOP = 8;
    uint32 wave = 9;
    uint32 enhanced_id = 10;
}
