syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ItemList.proto";
import "MailType.proto";

message ClientMail {
    string title = 11;
    string sender = 10;
    repeated string para_list = 3;
    string content = 15;
    ItemList attachment = 8;
    int64 time = 5;
    MailType mail_type = 4;
    uint32 id = 13;
    int64 expire_time = 6;
    uint32 template_id = 12;
    bool is_read = 2;
}
