syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ItemList.proto";
import "MailType.proto";

message ClientMail {
    uint32 id = 1;
    int64 expire_time = 2;
    bool is_read = 3;
    string content = 4;
    string title = 5;
    MailType mail_type = 6;
    ItemList attachment = 8;
    int64 time = 9;
    string sender = 11;
    uint32 template_id = 12;
    repeated string para_list = 15;
}
