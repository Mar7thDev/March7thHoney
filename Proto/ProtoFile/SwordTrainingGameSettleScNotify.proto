syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "IPPKHOFKMHM.proto";
import "ItemList.proto";

message SwordTrainingGameSettleScNotify {
    IPPKHOFKMHM reason = 3;
    ItemList reward = 5;
    uint32 game_story_line_id = 6;
    uint32 turn = 7;
    uint32 LBNLIJBPKHI = 8;
    repeated uint32 KACAMGJNOOB = 10;
    uint32 CDBGPMABMGM = 11;
    repeated uint32 BHFHFONGHML = 14;
}
