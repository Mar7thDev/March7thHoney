syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "AetherAvatarInfo.proto";
import "BattleBuff.proto";
import "BattleMonsterWave.proto";

message BAFDFBJHLGK {
    repeated AetherAvatarInfo avatar_list = 1;
    repeated BattleMonsterWave monster_wave_list = 2;
    repeated BattleBuff buff_list = 3;
}
