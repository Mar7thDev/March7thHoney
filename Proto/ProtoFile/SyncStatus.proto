syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "GroupStatus.proto";
import "SectionStatus.proto";

message SyncStatus {
    repeated SectionStatus section_status = 3;
    repeated uint32 CMEKBMAEHLD = 12;
    repeated uint32 AFKCPLHIMGH = 14;
    repeated GroupStatus message_group_status = 15;
}
