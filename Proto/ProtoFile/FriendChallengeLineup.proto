syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ChallengeLineupList.proto";
import "PlayerSimpleInfo.proto";

message FriendChallengeLineup {
    string remark_name = 13;
    PlayerSimpleInfo player_info = 7;
    repeated ChallengeLineupList lineup_list = 2;
    uint32 buff_two = 14;
    uint32 buff_one = 8;
    uint32 score_id = 12;
    uint32 EEJCPNAEKLJ = 1;
}
