syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "CNEEMBBNNBO.proto";
import "OGGELMMFPKP.proto";

message DFEGGFFOMKI {
    uint32 wave = 1;
    uint32 cur_hp = 5;
    CNEEMBBNNBO reason = 6;
    repeated OGGELMMFPKP PPCKLBHFCCA = 7;
    uint32 stage_id = 8;
    uint32 max_hp = 13;
}
