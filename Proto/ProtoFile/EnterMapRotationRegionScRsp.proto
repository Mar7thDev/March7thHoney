syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "MotionInfo.proto";
import "RotaterEnergyInfo.proto";

message EnterMapRotationRegionScRsp {
    uint32 JPPMEKJGJFD = 2;
    uint32 retcode = 6;
    uint32 region_id = 8;
    MotionInfo motion = 9;
    RotaterEnergyInfo energy_info = 11;
    uint32 client_pos_version = 15;
}
