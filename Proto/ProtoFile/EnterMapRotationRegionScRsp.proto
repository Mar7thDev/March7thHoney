syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "MotionInfo.proto";
import "RotaterEnergyInfo.proto";

message EnterMapRotationRegionScRsp {
    RotaterEnergyInfo energy_info = 6;
    MotionInfo motion = 10;
    uint32 LJHKNKFLGDE = 4;
    uint32 JPPMEKJGJFD = 13;
    uint32 client_pos_version = 2;
    uint32 retcode = 11;
}
