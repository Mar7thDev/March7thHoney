syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "FriendSimpleInfo.proto";
import "PlayerSimpleInfo.proto";

message GetFriendListInfoScRsp {
    uint32 retcode = 6;
    repeated PlayerSimpleInfo black_list = 12;
    repeated FriendSimpleInfo friend_list = 15;
}
