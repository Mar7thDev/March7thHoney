syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "GridFightForgeEquipmentInfo.proto";
import "GridFightForgeRoleInfo.proto";

message GridFightForgeGoodsInfo {
    oneof CKMEAIDKOIA {
        GridFightForgeRoleInfo role_goods_info = 3;
        GridFightForgeEquipmentInfo equipment_goods_info = 9;
    }
}
