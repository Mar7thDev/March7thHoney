syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "GachaInfo.proto";
import "NEIMLKNMDBM.proto";

message GetGachaInfoScRsp {
    repeated GachaInfo gacha_info_list = 3;
    repeated NEIMLKNMDBM AKMDBPNEHDE = 13;
    uint32 GPNLDDLBOLM = 4;
    uint32 OGMPKDHKPAJ = 12;
    uint32 retcode = 9;
    uint32 KKKNJDBNJPM = 1;
    uint32 gacha_random = 10;
}
