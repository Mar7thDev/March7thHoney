syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "PlayerBasicInfo.proto";

message PlayerLoginScRsp {
    int32 cur_timezone = 1;
    string DKEPKHPOLHC = 3;
    string GIOAPOKHAOF = 4;
    uint32 stamina = 5;
    uint64 server_timestamp_ms = 6;
    PlayerBasicInfo basic_info = 8;
    uint64 login_random = 9;
    uint32 retcode = 11;
    bool KDNPPNHLNOA = 13;
    bool KCDAHNNCKPP = 14;
}
