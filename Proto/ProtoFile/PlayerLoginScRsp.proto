syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "PlayerBasicInfo.proto";

message PlayerLoginScRsp {
    PlayerBasicInfo basic_info = 1;
    string GIOAPOKHAOF = 2;
    string DKEPKHPOLHC = 10;
    uint64 login_random = 7;
    uint64 server_timestamp_ms = 4;
    uint32 retcode = 15;
    int32 cur_timezone = 8;
    bool KCDAHNNCKPP = 9;
    bool KDNPPNHLNOA = 12;
    uint32 stamina = 13;
}
