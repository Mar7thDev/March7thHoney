syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Goods.proto";

message Shop {
    uint32 city_level = 1;
    uint32 shop_id = 5;
    int64 end_time = 7;
    repeated Goods goods_list = 10;
    int64 begin_time = 13;
    uint32 city_exp = 14;
    uint64 city_taken_level_reward = 15;
}
