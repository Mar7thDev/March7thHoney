syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Goods.proto";

message Shop {
    repeated Goods goods_list = 7;
    uint32 city_exp = 15;
    uint32 shop_id = 4;
    int64 end_time = 12;
    uint32 city_level = 6;
    uint64 city_taken_level_reward = 8;
    int64 begin_time = 11;
}
