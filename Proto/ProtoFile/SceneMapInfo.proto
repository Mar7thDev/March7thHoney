syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ChestInfo.proto";
import "ChestMonsterStat.proto";
import "MazeGroup.proto";
import "MazePropState.proto";
import "MissionStatusBySceneInfo.proto";
import "SceneIdentifier.proto";

message SceneMapInfo {
    repeated MazeGroup maze_group_list = 1;
    uint32 dimension_id = 3;
    repeated MazePropState maze_prop_list = 4;
    uint32 floor_id = 5;
    repeated uint32 unlock_teleport_list = 6;
    repeated uint32 lighten_section_list = 7;
    repeated ChestMonsterStat chest_monster_list = 8;
    uint32 retcode = 9;
    uint32 cur_map_entry_id = 12;
    uint32 entry_id = 13;
    repeated ChestInfo chest_list = 14;
    map<string, int32> floor_saved_value_map = 15;
    MissionStatusBySceneInfo client_group_mission_info = 123;
    repeated uint32 opened_chest_id_list = 561;
    SceneIdentifier scene_identifier = 954;
    repeated uint32 finished_chest_monster_id_list = 1700;
}
