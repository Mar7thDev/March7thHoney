syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ChestInfo.proto";
import "FAHFBEJCKLF.proto";
import "MazeGroup.proto";
import "MazePropState.proto";
import "MissionStatusBySceneInfo.proto";
import "SceneIdentifier.proto";

message SceneMapInfo {
    map<string, int32> floor_saved_data = 6;
    repeated FAHFBEJCKLF chest_monster_list = 1;
    repeated uint32 opened_chest_id_list = 879;
    repeated MazeGroup maze_group_list = 5;
    repeated ChestInfo chest_list = 13;
    SceneIdentifier scene_identifier = 915;
    MissionStatusBySceneInfo client_group_mission_info = 1584;
    repeated MazePropState maze_prop_list = 4;
    repeated uint32 finished_chest_monster_id_list = 439;
    repeated uint32 unlock_teleport_list = 14;
    repeated uint32 lighten_section_list = 3;
    uint32 retcode = 10;
    uint32 dimension_id = 11;
    uint32 floor_id = 12;
    uint32 entry_id = 8;
    uint32 cur_map_entry_id = 7;
}
