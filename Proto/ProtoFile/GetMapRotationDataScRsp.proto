syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ChargerInfo.proto";
import "RotateMapInfo.proto";
import "RotaterData.proto";
import "RotaterEnergyInfo.proto";

message GetMapRotationDataScRsp {
    repeated ChargerInfo EGAGKNADAHJ = 1;
    bool BHABAIFPOOA = 2;
    int32 region_id = 5;
    RotateMapInfo COOOMDKGODF = 6;
    uint32 JPPMEKJGJFD = 8;
    repeated RotaterData CEDGGDFMILP = 10;
