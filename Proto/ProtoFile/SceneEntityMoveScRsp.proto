syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "ClientDownloadData.proto";
import "EntityMotion.proto";

message SceneEntityMoveScRsp {
    ClientDownloadData download_data = 6;
    repeated EntityMotion entity_motion_list = 11;
