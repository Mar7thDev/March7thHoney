syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "BattleEventProperty.proto";
import "PLDMGGBPHPB.proto";

message BattleEventBattleInfo {
    uint32 battle_event_id = 1;
    BattleEventProperty status = 2;
    repeated PLDMGGBPHPB skill_info = 3;
}
