syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ItemList.proto";
import "RaidStatus.proto";
import "RaidTargetInfo.proto";

message RaidInfoNotify {
    ItemList item_list = 1;
    repeated RaidTargetInfo raid_target_info = 11;
    uint64 raid_finish_time = 9;
    uint32 world_level = 2;
    uint32 raid_id = 5;
    RaidStatus status = 12;
}
