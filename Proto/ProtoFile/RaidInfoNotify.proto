syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "ItemList.proto";
import "RaidStatus.proto";
import "RaidTargetInfo.proto";

message RaidInfoNotify {
    uint64 raid_finish_time = 1;
    uint32 world_level = 7;
    repeated RaidTargetInfo raid_target_info = 8;
    RaidStatus status = 11;
    uint32 raid_id = 13;
    ItemList item_list = 15;
}
