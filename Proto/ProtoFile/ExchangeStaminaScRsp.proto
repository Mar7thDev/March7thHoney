syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "ItemCost.proto";

message ExchangeStaminaScRsp {
    repeated ItemCost item_cost_list = 6;
    uint32 exchange_times = 8;
    int64 last_recover_time = 9;
    uint32 retcode = 14;
    uint32 stamina_add = 15;
}
