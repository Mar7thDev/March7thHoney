syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "ItemList.proto";

message AddItemRsp {
    ItemList reward = 6;
    int64 unlock_timestamp = 13;
    oneof PANAJBHKAKO {
        uint32 avatar_id = 8;
        uint32 FLEOCMEFANH = 11;
    }
}
