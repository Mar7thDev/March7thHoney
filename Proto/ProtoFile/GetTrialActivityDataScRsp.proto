syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "PAALDKHKOLE.proto";
import "TrialActivityInfo.proto";

message GetTrialActivityDataScRsp {
    repeated PAALDKHKOLE OBOPMFBGBAE = 8;
    repeated uint32 EBNNNJJHIBM = 11;
