syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "BattleAvatar.proto";
import "BattleBuff.proto";
import "BattleEventBattleInfo.proto";
import "BattleGridFightSpecialBattleInfo.proto";
import "BattleRogueMagicInfo.proto";
import "BattleTargetList.proto";
import "EDCFKACPFNB.proto";
import "GLIBGKGGEJL.proto";
import "GridFightInfo.proto";
import "KIAICMELIMM.proto";
import "PKPFAHEBJIO.proto";
import "SceneMonsterWave.proto";

message SceneBattleInfo {
    uint32 stage_id = 1;
    repeated BattleBuff buff_list = 2;
    uint32 world_level = 4;
    uint32 logic_random_seed = 5;
    repeated BattleAvatar battle_avatar_list = 7;
    uint32 monster_wave_length = 9;
    repeated SceneMonsterWave monster_wave_list = 10;
    bool encrypt_result = 12;
    uint32 battle_id = 14;
    uint32 rounds_limit = 15;
    BattleGridFightSpecialBattleInfo battle_evolve_build_data = 188;
    GridFightInfo battle_grid_fight_data = 301;
    EDCFKACPFNB battle_action_event_id = 466;
    PKPFAHEBJIO battle_fate_data = 502;
    GLIBGKGGEJL battle_fate_rin_data = 1053;
    KIAICMELIMM battle_sword_training_data = 1427;
    repeated BattleEventBattleInfo battle_event = 1565;
    map<uint32, BattleTargetList> battle_target_info = 1712;
    BattleRogueMagicInfo battle_rogue_magic_info = 1939;
}
