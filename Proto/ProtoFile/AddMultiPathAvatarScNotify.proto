syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "DPBEGBNICPG.proto";
import "ItemList.proto";
import "PJNEFBBLPND.proto";

message AddMultiPathAvatarScNotify {
    PJNEFBBLPND LANGJOJLEOC = 2;
    bool is_new = 4;
    repeated DPBEGBNICPG OIOFPADOGFC = 10;
    uint32 avatar_id = 12;
    ItemList reward = 14;
}
