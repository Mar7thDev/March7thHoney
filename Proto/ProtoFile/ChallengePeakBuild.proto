syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "EquipRelic.proto";

message ChallengePeakBuild {
    uint32 equipment_unique_id = 4;
    repeated EquipRelic relic_list = 5;
    uint32 avatar_type = 6;
    uint32 CBHKFOEOMFF = 12;
    uint32 avatar_id = 13;
}
