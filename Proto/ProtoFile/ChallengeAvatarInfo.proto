syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "AvatarType.proto";

message ChallengeAvatarInfo {
    uint32 id = 7;
    uint32 CBHKFOEOMFF = 9;
    AvatarType avatar_type = 10;
    uint32 index = 13;
    uint32 level = 15;
}
