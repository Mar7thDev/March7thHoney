syntax = "proto3";

option csharp_namespace = "CastoriceHoney.Server.Proto";

option java_package = "emu.lunarcore.proto";

import "MissionCustomValue.proto";
import "MissionStatus.proto";

message MainMission {
    uint32 id = 2;
    MissionStatus status = 5;
    repeated MissionCustomValue custom_value_list = 12;
}
