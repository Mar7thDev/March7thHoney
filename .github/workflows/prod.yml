name: PROD build

on:
  push:
    branches: ['codex/prod-*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Verify and publish win-x64
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build and run the resource-independent regressions
        run: python3 scripts/verify-security.py
      - name: Publish the standard self-contained server
        run: dotnet publish Program/Program.csproj -c Release -r win-x64 --self-contained true -p:LimitedMode=false -p:DoAot=false -o publish
      - uses: actions/upload-artifact@v7
        with:
          name: March7thHoney-win-x64
          path: publish
          if-no-files-found: error
