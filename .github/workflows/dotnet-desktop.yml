name: Build and Publish

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 支持在 GitHub 页面上手动点击运行

jobs:
  build-and-publish:
    name: Publish (${{ matrix.mode_name }})
    runs-on: windows-latest
    
    strategy:
      fail-fast: false
      matrix:
        # 这里的 mode 对应你脚本中的 switch 判断逻辑
        include:
          - mode: "1"
            mode_name: "Private"
            define_constants: ""
          - mode: "2"
            mode_name: "Public"
            define_constants: "PUBLIC_MODE"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Single File
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projectPath = "Program/Program.csproj"
          $outputDir = "Publish/win-x64"

          if (Test-Path $outputDir) {
            Remove-Item -LiteralPath $outputDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $outputDir | Out-Null

          $publishArgs = @(
            "publish"
            $projectPath
            "-c", "Release"
            "-f", "net10.0"
            "-r", "win-x64"
            "--self-contained", "true"
            "-o", $outputDir
            "/p:PublishSingleFile=true"
            "/p:IncludeNativeLibrariesForSelfExtract=true"
            "/p:EnableCompressionInSingleFile=true"
            "/p:PublishReadyToRun=true"
            "/p:PublishTrimmed=false"
          )

          if ("${{ matrix.define_constants }}") {
            $publishArgs += "/p:DefineConstants=${{ matrix.define_constants }}"
          }

          dotnet @publishArgs

      - name: Prepare Publish Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = "Publish/win-x64"
          $repoConfigDir = "Config"
          $publishConfigDir = Join-Path $outputDir "Config"

          Get-ChildItem -Path $outputDir -Filter "*.pdb" -File -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem -Path $outputDir -Filter "appsettings*.json" -File -ErrorAction SilentlyContinue | Remove-Item -Force

          if (Test-Path $publishConfigDir) {
            Remove-Item -LiteralPath $publishConfigDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $publishConfigDir | Out-Null

          if (Test-Path $repoConfigDir) {
            $resourceCachePath = Join-Path $repoConfigDir "Resource.cache"
            if (Test-Path $resourceCachePath) {
              Copy-Item -Path $resourceCachePath -Destination (Join-Path $publishConfigDir "Resource.cache") -Force
            }

            foreach ($name in @("Json", "Handbook", "Data", "Custom", "Security")) {
              $src = Join-Path $repoConfigDir $name
              $dst = Join-Path $publishConfigDir $name
              if (Test-Path $src) {
                Copy-Item -Path $src -Destination $dst -Recurse
              }
            }
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # 成品名称会区分 Private 和 Public
          name: Program-win-x64-${{ matrix.mode_name }}
          # 对应脚本中的 $OutputRoot/$Runtime，即 Publish/win-x64
          path: Publish/win-x64/
          if-no-files-found: error
          retention-days: 7
